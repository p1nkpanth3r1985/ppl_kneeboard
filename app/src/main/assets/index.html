T.push({ id:"airframe", ref:"020 · 1", title:"Airframe, controls and landing gear",
blurb:"How the structure carries loads, the control runs, undercarriage, brakes and tyres, and the structural limits.",
learn:()=>`
<h3>Structure</h3>
<ul>
<li><b>Monocoque</b>: the skin carries the loads, like an egg shell. <b>Semi-monocoque</b>, used on most light aircraft, adds frames, stringers and longerons so skin and framework share the load.</li>
<li>The wing's main <b>spar</b> carries the bending load; ribs give the aerofoil shape; the skin takes torsion.</li>
<li>Flying controls are usually moved by cables, pulleys and push-pull rods. Check for full and free movement in the correct sense before every flight.</li>
</ul>
<h3>Landing gear, brakes and tyres</h3>
<ul>
<li>Most trainers have a <b>tricycle</b> undercarriage: a nosewheel plus two mainwheels. It is directionally stable on the ground and gives good visibility on take-off and landing.</li>
<li>Nose legs often have an <b>oleo</b> (oil and air) strut to absorb shocks, and a shimmy damper to stop the nosewheel oscillating.</li>
<li>Brakes are normally <b>hydraulic disc</b> brakes on the mainwheels, operated by toe pedals. Check for leaks, pad wear and disc condition.</li>
<li>Tyres: check inflation, cuts, wear and <b>creep marks</b>. These are painted marks on the tyre and wheel; if they no longer line up, the tyre has slipped on the rim and the inner tube valve may be at risk.</li>
</ul>
<h3>Structural limits</h3>
<div class="tbl"><table>
<tr><th>Category</th><th>Limit load factors</th><th>Typical use</th></tr>
<tr><td>Normal</td><td>+3.8 g to −1.52 g</td><td>Normal flying, no aerobatics</td></tr>
<tr><td>Utility</td><td>+4.4 g to −1.76 g</td><td>Limited manoeuvres such as spins, if approved</td></tr>
<tr><td>Aerobatic</td><td>+6.0 g to −3.0 g</td><td>Aerobatics</td></tr>
</table></div>
<p>The <b>limit load</b> is the most the structure should ever see in service. The <b>ultimate load</b> is 1.5 times that; beyond the limit load, permanent damage is possible.</p>
<div class="box trap"><b>Common trap</b>Creep marks show the tyre slipping on the wheel, not tread wear.</div>`,
qs:[
{q:"What is a semi-monocoque structure?",o:["One where the skin and an internal framework of frames and stringers share the loads","One where the skin carries no load at all","One where the skin alone carries all the loads","A structure made entirely of steel tube"],e:"Semi-monocoque combines a load-bearing skin with frames, stringers and longerons. Pure monocoque relies on the skin alone; a tube frame with fabric covering uses the framework alone."},
{q:"Which part of the wing carries most of the bending load?",o:["The main spar","The ribs","The leading edge","The wing tip"],e:"The spar runs along the span and resists bending. Ribs keep the aerofoil shape."},
{q:"What do creep marks on a tyre and wheel show?",o:["Whether the tyre has slipped round on the wheel rim","How much tread is left","The correct inflation pressure","The date the tyre was fitted"],e:"If the marks are out of line, the tyre has moved on the rim, which can tear the valve from an inner tube."},
{q:"What is the purpose of a shimmy damper on the nosewheel?",o:["To stop the nosewheel oscillating from side to side","To absorb landing shocks","To steer the aircraft","To lock the nosewheel straight in flight"],e:"Shimmy is a rapid side-to-side oscillation of the nosewheel. The damper stops it. Shock absorption is the oleo's job."},
{q:"What are the limit load factors for an aircraft in the Normal category?",o:["+3.8 g to −1.52 g","+4.4 g to −1.76 g","+6.0 g to −3.0 g","+2.0 g to −1.0 g"],e:"Normal +3.8/−1.52, Utility +4.4/−1.76, Aerobatic +6.0/−3.0."},
{q:"How does ultimate load relate to limit load?",o:["Ultimate load is 1.5 times the limit load","They are the same","Ultimate load is half the limit load","Ultimate load is twice the limit load"],e:"Structures are designed with a 1.5 safety factor. Between limit and ultimate load, permanent deformation is possible; beyond ultimate, failure."},
{q:"How are the brakes on a typical light training aircraft operated?",o:["Hydraulically, by toe pedals on the rudder pedals","Mechanically, by the control column","Electrically, from a switch","By the flap lever"],e:"Most trainers have hydraulic disc brakes on the mainwheels, worked by pressing the top of the rudder pedals."},
{q:"An oleo strut absorbs landing shocks using:",o:["Oil and compressed air or nitrogen","Springs only","Rubber blocks only","The tyre pressure alone"],e:"An oleo-pneumatic strut uses compressed gas as a spring and oil forced through an orifice to damp the motion."},
{type:"match", q:"Match each part to its main job.", pairs:[["Spar","Carries the wing's bending load"],["Ribs","Give the wing its aerofoil shape"],["Oleo strut","Absorbs landing shocks"],["Shimmy damper","Stops the nosewheel oscillating"]],
  e:"Knowing what each part does tells you what to look for on the walk-round."},
{q:"Why is a tricycle undercarriage easier to handle on the ground than a tailwheel?",o:["The CG is ahead of the mainwheels, so it tends to run straight","It has bigger brakes","It always has nosewheel steering linked to the ailerons","It makes the aircraft lighter"],e:"With the CG ahead of the mainwheels, a swing tends to correct itself. A tailwheel aircraft's CG is behind the mainwheels, so a swing tends to grow (a ground loop)."},
{q:"During your pre-flight check you find the control column moves the ailerons the wrong way. What should you do?",o:["Do not fly; report it as a serious defect","Fly carefully and use the rudder for roll","Ask a passenger to help hold the controls","Note it in the tech log after the flight"],e:"Crossed control cables have caused fatal accidents after maintenance. Always check controls for full, free and correct movement, and never fly with a fault."},
{q:"What does a red line on a structural or engine instrument normally mean?",o:["A limit that must never be exceeded","The normal operating range","A caution range for smooth air only","The minimum value for starting"],e:"Red lines mark maximum (or minimum) limits; green arcs normal ranges; yellow arcs caution ranges."}
]});

T.push({ id:"engine", ref:"020 · 2", title:"The piston engine",
blurb:"The four-stroke cycle, magnetos and ignition, oil, temperatures, detonation and the fixed-pitch propeller.",
learn:()=>`
<h3>The four-stroke cycle</h3>
${fourStroke}
<p>Light aircraft engines are usually <b>horizontally opposed</b> and <b>air-cooled</b>. Each cylinder fires once every two turns of the crankshaft.</p>
<h3>Ignition: magnetos</h3>
<ul>
<li>Two independent <b>magnetos</b>, each firing one of two spark plugs in every cylinder. Two plugs give a better burn and a back-up if one system fails.</li>
<li>Magnetos make their own electricity from engine rotation. The engine keeps running with the master switch off or a flat battery.</li>
<li>The <b>mag check</b> at the power check compares the RPM drop on each magneto with the limits in the POH. Your checklist gives a maximum drop of 125 RPM and a maximum difference of 50 RPM.</li>
<li>Switching a magneto off <b>earths</b> it through the P-lead. If a P-lead is broken, that magneto stays <b>live</b> with the switch off, and the propeller is dangerous to touch. The <b>dead cut check</b> before shutdown confirms both earth properly.</li>
</ul>
<h3>Oil and temperatures</h3>
<ul>
<li>Oil lubricates, cools, seals and cleans. Oil pressure should rise within about 30 seconds of starting; if not, shut down.</li>
<li>Low oil pressure with high oil temperature points to an engine problem; land as soon as possible.</li>
<li>Long climbs at low airspeed and full power raise cylinder head temperatures; a cruise-climb at a higher speed helps cooling.</li>
</ul>
<h3>Detonation and pre-ignition</h3>
<ul>
<li><b>Detonation</b>: the mixture explodes violently instead of burning smoothly, from too low a fuel grade, too lean a mixture or high temperatures. It can damage pistons quickly.</li>
<li><b>Pre-ignition</b>: the mixture ignites before the spark, from a hot spot such as carbon deposits.</li>
</ul>
<h3>Fixed-pitch propeller</h3>
<p>With a fixed-pitch propeller, the tachometer (RPM) is the power indicator. RPM rises with airspeed in a dive and falls in a climb at the same throttle setting.</p>`,
qs:[
{type:"order", q:"Put the four strokes of the cycle in order.", items:["Induction","Compression","Power","Exhaust"], e:"Suck, squeeze, bang, blow. Each cylinder completes the cycle every two crankshaft revolutions."},
{q:"Why does a piston aero engine have two magnetos?",o:["For redundancy and a more complete burn, with two plugs per cylinder","To start the engine faster","To charge the battery","So one can run while the other cools"],e:"Dual ignition is safer (one can fail) and burns the mixture more efficiently from two flame fronts."},
{q:"The master switch is turned off in flight. What happens to the engine?",o:["It keeps running, because the magnetos are self-powered","It stops at once","It runs rough on one magneto","It stops when the battery runs flat"],e:"Magnetos generate their own current. Electrical instruments and radios would stop, but the engine would not."},
{q:"What is the danger of a broken magneto P-lead?",o:["The magneto stays live with the ignition off, so the propeller could start the engine if moved","The engine will not start","The battery will discharge","The oil pressure will drop"],e:"The P-lead earths the magneto when switched off. Broken, it can't, so always treat a propeller as live."},
{q:"What is the purpose of the dead cut check?",o:["To confirm both magnetos switch off properly before shutdown","To test the starter motor","To check the fuel selector","To check the alternator output"],e:"Briefly switching the magnetos off at idle should make the engine falter. If it doesn't, a magneto isn't earthing."},
{type:"calc", gen:() => { const rpm = rnd(1700, 1700), l = rnd(60, 125, 5), r = l + rnd(10, 70, 5);
  return { q:`At the power check (your checklist limits: maximum drop 125 RPM, maximum difference 50 RPM), RPM is ${rpm}. Left magneto gives ${rpm - l} RPM, right gives ${rpm - r} RPM. What is the difference between the two drops?`, a:r - l, tol:0, unit:" RPM",
    steps:[`Left drop = ${rpm} − ${rpm - l} = ${l}`, `Right drop = ${rpm} − ${rpm - r} = ${r}`, `Difference = ${r} − ${l} = ${r - l} RPM`, r > 125 || r - l > 50 ? "Outside your checklist limits: don't fly." : "Within your checklist limits."] }; },
  e:"Check both the size of each drop and the difference between them against the limits in your checklist and POH."},
{q:"Oil pressure has not risen within 30 seconds of starting. What should you do?",o:["Shut the engine down","Increase RPM to raise the pressure","Wait another five minutes","Take off; it will rise in flight"],e:"No oil pressure means no lubrication. Shut down at once to avoid engine damage. Your checklist says the same."},
{q:"Which of these is NOT a function of engine oil?",o:["Providing the fuel for combustion","Lubricating","Cooling","Sealing and cleaning"],e:"Oil lubricates, cools, seals and cleans. It is not part of the combustion process."},
{q:"What is detonation?",o:["Explosive, uncontrolled burning of the mixture after the spark","Ignition from a hot spot before the spark","A magneto failure","Fuel freezing in the carburettor"],e:"Detonation is a violent explosion instead of a smooth burn. Causes include low-grade fuel, too lean a mixture and high temperatures."},
{q:"What is pre-ignition?",o:["The mixture igniting before the spark, from a hot spot","The mixture exploding after the spark","Starting the engine with the primer","Ignition with both magnetos off"],e:"Pre-ignition comes from glowing deposits or overheated parts. Detonation happens after normal ignition."},
{q:"In an aircraft with a fixed-pitch propeller, which instrument shows engine power?",o:["The tachometer (RPM)","The manifold pressure gauge","The oil pressure gauge","The ammeter"],e:"With fixed pitch, RPM is the power indication. Constant-speed propellers use manifold pressure as well."},
{q:"With the throttle fixed, what happens to RPM as a fixed-pitch propeller aircraft enters a dive?",o:["It rises","It falls","It stays the same","It drops to idle"],e:"Higher airspeed unloads the propeller, so it turns faster. Watch you don't exceed the RPM red line."}
]});

T.push({ id:"fuel", ref:"020 · 3", title:"Fuel systems and carburation",
blurb:"Fuel grades and colours, gravity-fed systems, drains and vents, the carburettor, mixture and carb icing.",
learn:()=>`
<h3>Fuel grades</h3>
<div class="tbl"><table>
<tr><th>Fuel</th><th>Colour</th><th>Notes</th></tr>
<tr><td>AVGAS 100LL</td><td>Blue</td><td>Standard aviation gasoline for most piston engines</td></tr>
<tr><td>Jet A-1</td><td>Clear to straw</td><td>Kerosene for turbines and some diesel engines. In a petrol engine it causes detonation and engine failure</td></tr>
<tr><td>Mogas / UL91</td><td>Varies</td><td>Only where the engine and airframe are approved for it</td></tr>
</table></div>
<p>Jet A-1 nozzles are usually wider than avgas nozzles so they don't fit an avgas filler, but don't rely on that: check the grade every time.</p>
<h3>The fuel system</h3>
<ul>
<li>High-wing aircraft like the Cessna 150 usually feed fuel by <b>gravity</b> from the wing tanks; low-wing aircraft need fuel pumps.</li>
<li>Tank <b>vents</b> let air in as fuel is used. A blocked vent can starve the engine.</li>
<li><b>Water</b> is heavier than fuel and collects at the lowest points. Drain samples from every drain point before flight and check for water and debris.</li>
<li><b>Unusable fuel</b> is the amount the system can't deliver; it doesn't count towards endurance.</li>
</ul>
<h3>The carburettor and mixture</h3>
<ul>
<li>In a float carburettor, air speeds up through a <b>venturi</b>; the drop in pressure draws fuel from the float chamber. The throttle valve (butterfly) controls how much mixture reaches the cylinders.</li>
<li>As you climb, air density falls but the fuel flow doesn't, so the mixture becomes too <b>rich</b>. Leaning with the mixture control restores the right ratio.</li>
<li>Full rich for take-off at low aerodromes; lean as the POH directs in the cruise. <b>Idle cut-off</b> stops the engine by shutting off the fuel.</li>
</ul>
<h3>Carburettor icing</h3>
<p>Fuel evaporation and the pressure drop in the venturi cool the air, so ice can form well above 0 °C in humid air. Carb heat takes hot, <b>unfiltered</b> air from around the exhaust; use it as the checklist directs, and not on the ground in dusty conditions. Fuel-injected engines don't suffer carburettor icing.</p>`,
qs:[
{q:"What colour is AVGAS 100LL?",o:["Blue","Green","Red","Clear to straw"],e:"100LL is dyed blue. Jet A-1 is clear to straw coloured."},
{q:"What would happen if Jet A-1 were put into a piston engine designed for avgas?",o:["Detonation and probable engine failure","It would run normally","It would only cause rough idling","It would improve performance"],e:"Kerosene doesn't burn properly in a spark-ignition engine. Misfuelling has caused fatal accidents; always confirm the grade."},
{q:"Why do you drain a fuel sample before flight?",o:["To check for water and contamination, which collect at the lowest point","To check the fuel quantity","To cool the fuel","To release vapour from the tank"],e:"Water is heavier than fuel and settles at the drains. Take samples from all drain points until they are clean."},
{q:"How is fuel usually fed to the engine in a high-wing trainer such as the Cessna 150?",o:["By gravity from the wing tanks","By an electric pump only","By the oil pump","By pressure from the propeller"],e:"The tanks sit above the engine, so gravity feeds the carburettor."},
{q:"What could a blocked fuel tank vent cause?",o:["Fuel starvation as a vacuum builds in the tank","Overfilling","Carburettor icing","Oil leaks"],e:"As fuel leaves the tank, air must replace it. A blocked vent stops this and the flow can stop."},
{q:"As you climb without leaning, the mixture becomes:",o:["Too rich","Too lean","Unchanged","Weak at low level only"],e:"Air density falls with height while fuel flow is unchanged, so the fuel/air ratio rises: too rich."},
{q:"What does the idle cut-off position of the mixture control do?",o:["Shuts off fuel to stop the engine","Gives the richest mixture","Turns off the magnetos","Opens the carburettor heat"],e:"Shutting down with idle cut-off stops the engine by fuel starvation, leaving no fuel in the cylinders to fire unexpectedly."},
{q:"Why is carb heat air unfiltered, and when should you avoid using it on the ground?",o:["It is taken from around the exhaust, so avoid it on dusty or gravel surfaces","It is filtered, so it can be used anywhere","It is only used for starting","It comes from the cabin"],e:"Unfiltered hot air bypasses the air filter. Using it on the ground can draw in dust and grit."},
{q:"How does a float carburettor draw fuel in?",o:["Air speeds up through a venturi; the lower pressure draws fuel from the float chamber","The fuel pump sprays it directly into the cylinders","The magnetos pull it in electrically","Gravity alone pours it into the cylinders"],e:"The venturi effect is the same Bernoulli principle as lift."},
{q:"Which engine type does not suffer from carburettor icing?",o:["A fuel-injected engine","A float-carburettor engine at low power","Any engine on a humid day","A carburetted engine in cruise"],e:"Fuel injection has no venturi or evaporation in the induction air path, so no carburettor ice. Intake icing from snow or freezing rain is still possible."},
{type:"match", q:"Match each fuel to its usual appearance.", pairs:[["AVGAS 100LL","Blue"],["Jet A-1","Clear to straw"],["Water in a sample","Bubbles or a separate layer at the bottom"]],
  e:"A clear sample from an avgas tank is suspicious: it may be water or the wrong fuel."},
{q:"What is unusable fuel?",o:["Fuel the system cannot deliver to the engine, which must not be counted in your endurance","Fuel that has been contaminated","Fuel in the carburettor","The reserve fuel"],e:"The POH gives total and usable capacity. Plan only with usable fuel."}
]});

T.push({ id:"electrics", ref:"020 · 4", title:"The electrical system",
blurb:"Battery, alternator, master switch, ammeter, circuit breakers and what still works when the electrics fail.",
learn:()=>`
<ul>
<li>Light aircraft use a <b>DC</b> system, usually 14 V or 28 V.</li>
<li>The <b>battery</b> starts the engine and is a back-up supply if the alternator fails.</li>
<li>The engine-driven <b>alternator</b> powers the system in flight and recharges the battery. Most alternators need some battery power to start producing current.</li>
<li>The <b>master switch</b> connects the battery and alternator to the system; some aircraft have a split switch for each.</li>
<li><b>Circuit breakers</b> and fuses protect each circuit from overload. Reset a popped breaker once only, after a short pause; if it pops again, leave it out.</li>
<li>The <b>ammeter</b> shows whether the battery is charging (positive) or discharging (negative). A load meter instead shows the alternator's output.</li>
</ul>
<h3>Alternator failure</h3>
<p>Signs: low-voltage warning light, ammeter showing discharge. Shed all non-essential loads to stretch the battery, follow the checklist (your electrical failure drill: shed loads, check and reset, master off for 3 seconds then on), and land as soon as practical. The battery will only last a limited time.</p>
<h3>What still works?</h3>
<div class="tbl"><table>
<tr><th>Keeps working with total electrical failure</th><th>Stops</th></tr>
<tr><td>Engine (magnetos), ASI, altimeter, VSI, compass, vacuum-driven gyros (AI and DI on many trainers)</td><td>Radios, transponder, electric turn coordinator, fuel gauges (on many aircraft), lights, electric flaps, stall warner if electric</td></tr>
</table></div>
<div class="box trap"><b>Common trap</b>An electrical failure does not stop the engine. A vacuum pump failure does not stop the electrics. Know which instruments run from which source in your aircraft.</div>`,
qs:[
{q:"What is the main job of the alternator in flight?",o:["To supply the electrical system and recharge the battery","To fire the spark plugs","To drive the vacuum pump","To start the engine"],e:"The alternator is engine driven and powers everything electrical in flight. The magnetos look after ignition separately."},
{q:"The ammeter shows a steady discharge in flight. What is most likely?",o:["The alternator has failed and the battery is supplying the system","The battery is overcharging","The magnetos have failed","Everything is normal"],e:"A discharge means the battery is being drained. Shed loads and follow the electrical failure checklist."},
{q:"A circuit breaker pops in flight. What is the usual advice?",o:["Wait a moment, reset it once; if it pops again, leave it out","Hold it in so the circuit keeps working","Reset it repeatedly until it stays in","Never reset it in flight"],e:"A breaker that trips again shows a real fault. Forcing it in can start an electrical fire. Your radio failure drill says 'reset only once'."},
{q:"With a total electrical failure, which instrument would normally keep working?",o:["The airspeed indicator","The transponder","The radio","The electric turn coordinator"],e:"The pitot-static instruments (ASI, altimeter, VSI) and the compass need no electricity."},
{q:"After an alternator failure, why shed non-essential electrical loads?",o:["To make the battery last as long as possible","To stop the engine overheating","To reset the magnetos","To charge the battery"],e:"The battery has limited capacity. Reducing loads buys time for the essential radio and transponder."},
{q:"What does the master switch do?",o:["Connects the battery and alternator to the aircraft's electrical system","Switches the magnetos on and off","Turns on the fuel pump only","Controls the radio volume"],e:"The master is the electrical system's main switch. The magneto switch is separate."},
{q:"Which statement about magnetos and the electrical system is correct?",o:["The magnetos are independent of the battery and alternator","The magnetos are powered by the battery","The magnetos are powered by the alternator","The magnetos stop if the master switch is off"],e:"That's why the engine keeps running after an electrical failure."},
{type:"order", q:"Put the actions from your checklist's electrical failure drill in order.", items:["Shed all non-essential electrical load","Check field/output and reset circuit breakers","Check ammeter/voltage and warning light","Master switch off for 3 seconds, then on"],
  e:"If output returns, keep to essential services only and land or divert as soon as practicable, as your checklist says."},
{q:"Why might the fuel gauges become unreliable after a total electrical failure?",o:["On many aircraft the fuel gauges are electrically powered","Fuel stops flowing without electricity","The fuel freezes","They are linked to the magnetos"],e:"Know your fuel by time and consumption, not just by the gauges."},
{q:"What is the usual system voltage in a light aircraft?",o:["14 V or 28 V DC","230 V AC","110 V AC","6 V DC"],e:"Light aircraft use low-voltage DC systems, typically 12/14 V or 24/28 V."},
{type:"match", q:"Match each component to its job.", pairs:[["Battery","Starts the engine and backs up the supply"],["Alternator","Powers the system in flight and recharges the battery"],["Circuit breaker","Protects a circuit from overload"],["Ammeter","Shows charge or discharge"]],
  e:"A quick way to diagnose an electrical problem is to ask which of these has failed."}
]});

T.push({ id:"instruments", ref:"020 · 5", title:"Flight instruments",
blurb:"The pitot-static instruments and their blockages, ASI markings, the gyro instruments and the magnetic compass.",
learn:()=>`
${pitotStatic}
<h3>Blockages</h3>
<div class="tbl"><table>
<tr><th>Blocked</th><th>ASI</th><th>Altimeter</th><th>VSI</th></tr>
<tr><td>Static (in a climb)</td><td>Under-reads</td><td>Stuck at the level where it blocked</td><td>Reads zero</td></tr>
<tr><td>Static (in a descent)</td><td>Over-reads</td><td>Stuck</td><td>Reads zero</td></tr>
<tr><td>Pitot (and its drain)</td><td>Acts like an altimeter: over-reads in a climb, under-reads in a descent</td><td>Normal</td><td>Normal</td></tr>
</table></div>
<p>Many aircraft have an <b>alternate static source</b> inside the cabin. Cabin pressure is usually slightly lower than outside, so the ASI and altimeter may read a little high.</p>
<h3>ASI markings</h3>
<div class="tbl"><table>
<tr><th>Marking</th><th>Meaning</th></tr>
<tr><td>White arc</td><td>Flap operating range: from the stall speed with full flap (Vso) to the maximum flap extended speed (Vfe)</td></tr>
<tr><td>Green arc</td><td>Normal operating range: from the clean stall speed (Vs1) to the maximum structural cruising speed (Vno)</td></tr>
<tr><td>Yellow arc</td><td>Caution range, smooth air only: Vno to Vne</td></tr>
<tr><td>Red line</td><td>Never exceed speed (Vne)</td></tr>
</table></div>
<h3>Gyro instruments</h3>
<ul>
<li><b>Attitude indicator</b>: shows pitch and bank; on many trainers it is driven by a <b>vacuum</b> pump. Check the suction gauge.</li>
<li><b>Direction indicator (DI)</b>: has no magnetic sense, and drifts (precesses). Realign it with the compass in steady, level flight, about every 15 minutes.</li>
<li><b>Turn coordinator</b>: shows rate of roll and turn, often electric. The balance ball is a simple inclinometer: step on the ball to centre it.</li>
</ul>
<h3>Magnetic compass errors (northern hemisphere)</h3>
<ul>
<li><b>Acceleration errors</b> on easterly or westerly headings: accelerate and it shows a turn towards north; decelerate, towards south (ANDS).</li>
<li><b>Turning errors</b> when rolling out: undershoot north, overshoot south (UNOS).</li>
</ul>`,
qs:[
{q:"Which instrument uses both pitot and static pressure?",o:["The airspeed indicator","The altimeter","The VSI","The magnetic compass"],e:"The ASI measures the difference between pitot (total) and static pressure: dynamic pressure."},
{q:"The static source becomes blocked during a climb. What will the altimeter do?",o:["Stay at the reading where the blockage happened","Over-read","Under-read","Read zero"],e:"With the static pressure trapped, the altimeter has nothing new to measure and freezes."},
{q:"The static source is blocked and the aircraft climbs. What does the ASI do?",o:["Under-reads","Over-reads","Reads correctly","Reads zero"],e:"The trapped static pressure is higher than the real outside pressure, so pitot minus static is too small."},
{q:"The pitot tube and its drain hole are blocked. How does the ASI behave in a climb?",o:["It over-reads, acting like an altimeter","It under-reads","It reads correctly","It drops to zero"],e:"Pitot pressure is trapped while static pressure falls in the climb, so the difference grows and the ASI shows an increasing speed."},
{q:"What does the top of the white arc on the ASI show?",o:["The maximum flap extended speed (Vfe)","The never exceed speed","The stall speed with full flap","The maximum structural cruising speed"],e:"The white arc runs from Vso (bottom) to Vfe (top)."},
{q:"In which range should you fly only in smooth air?",o:["The yellow arc","The green arc","The white arc","Below the white arc"],e:"The yellow arc, from Vno to Vne, is the caution range: only in smooth air, avoiding large control movements."},
{q:"Why must the DI be realigned with the compass during flight?",o:["Gyroscopic precession makes it drift","It is affected by deviation","It only works on northerly headings","It is powered by the magnetos"],e:"The DI has no magnetic sense. Realign it with the compass in steady, level flight, about every 15 minutes."},
{q:"On many light trainers, what drives the attitude indicator?",o:["A vacuum pump","The battery directly","The pitot tube","The magnetos"],e:"Many trainers use a vacuum system for the AI and DI and an electric turn coordinator, so one failure doesn't take out all the gyros."},
{q:"In the northern hemisphere, flying east, you accelerate. What does the magnetic compass show?",o:["A turn towards north","A turn towards south","No change","A turn towards east"],e:"Acceleration errors on east or west headings: Accelerate North, Decelerate South (ANDS)."},
{q:"When rolling out of a turn onto north using the compass in the northern hemisphere, you should:",o:["Roll out before the compass shows north (undershoot)","Roll out after it passes north (overshoot)","Roll out exactly as it reaches north","Use the compass only on easterly headings"],e:"Undershoot north, overshoot south (UNOS) allows for the compass's turning errors."},
{q:"The balance ball is out to the right in a turn. What should you do?",o:["Apply right rudder","Apply left rudder","Apply more bank","Reduce power"],e:"'Step on the ball': press the rudder on the side the ball has moved to."},

T.push({ id:"airworthiness", ref:"020 · 6", title:"Airworthiness and maintenance",

learn:()=>`
<ul>
<li><b>Certificate of airworthiness (C of A)</b>: shows the aircraft type meets the airworthiness standard. It stays valid only while the aircraft is maintained and has a current airworthiness review.</li>
<li><b>Airworthiness review certificate (ARC)</b>: confirms the aircraft's airworthiness has been reviewed. Usually renewed every year.</li>
<li><b>Certificate of release to service (CRS)</b>: signed after maintenance to release the aircraft back into service.</li>
<li><b>Technical log</b>: records flying hours, defects and when the next maintenance is due. Check it before every flight.</li>
<li>Aircraft on a <b>Permit to Fly</b> (for example LAA types) follow a different system with their own conditions.</li>
</ul>
<h3>Pilot maintenance</h3>
<p>A pilot-owner may do certain simple tasks, such as specific inspections or replacing some items, as allowed by the maintenance rules and recorded properly. As a student or club pilot, you report defects and leave maintenance to the maintenance organisation.</p>
<h3>Defects</h3>
<p>Write any defect in the tech log. If it affects airworthiness, the aircraft must not fly until it has been put right and released. If in doubt, don't fly.</p>
<div class="box note"><b>Check</b>The exact documents and intervals depend on how the aircraft is registered and maintained. Ask your school how its aircraft are managed.</div>`,

{q:"Which statement about a student pilot doing maintenance is correct?",o:["A student should report defects and leave maintenance to the maintenance organisation","A student may carry out any repair","Students must change the oil before each flight","Maintenance never needs recording"],e:"Pilot-owner maintenance is limited to specific tasks with proper records, and doesn't apply to students flying school aircraft."},
{type:"match", q:"Match each document to what it shows.", pairs:[["Certificate of registration","Who owns the aircraft and its registration mark"],["Certificate of airworthiness","The type meets the airworthiness standard"],["Airworthiness review certificate","The aircraft's airworthiness has been reviewed recently"],["Technical log","Hours, defects and maintenance due"]],

T.push({ id:"mass", ref:"030 · 1", title:"Mass and balance",
blurb:"The definitions, moments and centre of gravity, and why both the weight and the CG must be in limits.",
learn:()=>`
<h3>Definitions</h3>
<div class="tbl"><table>
<tr><th>Term</th><th>Meaning</th></tr>
<tr><td>Basic empty mass</td><td>The aircraft with unusable fuel, full oil and fixed equipment, from its weight schedule</td></tr>
<tr><td>Datum</td><td>The reference point from which all arms are measured, set by the manufacturer</td></tr>
<tr><td>Arm</td><td>Distance of an item from the datum</td></tr>
<tr><td>Moment</td><td>Mass × arm</td></tr>
<tr><td>Centre of gravity (CG)</td><td>Total moment ÷ total mass</td></tr>
<tr><td>Maximum take-off mass</td><td>The most the aircraft may weigh at the start of the take-off</td></tr>
</table></div>
<h3>Working out the CG</h3>
<p>List every item with its mass and arm, multiply to get each moment, add the masses and the moments, then divide. Check that both the total mass and the CG fall within the envelope in the POH.</p>
<div class="tbl"><table>
<tr><th>Item</th><th>Mass (kg)</th><th>Arm (m)</th><th>Moment (kg m)</th></tr>
<tr><td>Basic empty mass</td><td>520</td><td>0.85</td><td>442.0</td></tr>
<tr><td>Pilot and passenger</td><td>160</td><td>0.95</td><td>152.0</td></tr>
<tr><td>Fuel 60 L × 0.72</td><td>43</td><td>1.05</td><td>45.2</td></tr>
<tr><td>Baggage</td><td>10</td><td>1.60</td><td>16.0</td></tr>
<tr><td><b>Total</b></td><td><b>733</b></td><td></td><td><b>655.2</b></td></tr>
</table></div>
<p>CG = 655.2 ÷ 733 = <b>0.894 m</b> aft of the datum. These are made-up example figures; always use your aircraft's own weight schedule and POH.</p>
<h3>Why it matters</h3>
<ul>
<li><b>Overweight</b>: longer take-off run, poorer climb, higher stall speed, structural loads beyond design.</li>
<li><b>CG forward</b> of the limit: heavy elevator, may not be able to flare or rotate.</li>
<li><b>CG aft</b> of the limit: unstable in pitch, possibly unrecoverable stall or spin.</li>
<li>Fuel burn moves the CG during the flight; check it at take-off and at landing.</li>
</ul>`,
qs:[
{q:"How is the centre of gravity calculated?",o:["Total moment divided by total mass","Total mass divided by total moment","Total mass multiplied by total arm","The average of all the arms"],e:"Add up all the moments (mass × arm), add up the masses, then divide moment by mass."},
{q:"What is a moment in mass and balance?",o:["Mass multiplied by its arm from the datum","The time taken to load the aircraft","The mass of fuel used per hour","The distance between the CG limits"],e:"Moment = mass × arm. Moments add up even though arms don't."},
{q:"What is the datum?",o:["The reference point from which all arms are measured","The aircraft's centre of gravity","The maximum take-off mass","The forward CG limit"],e:"The manufacturer chooses the datum; it can be anywhere, even ahead of the aircraft's nose."},
{type:"calc", gen:() => { const p = rnd(130, 190, 5), L = rnd(40, 90, 5), f = Math.round(L * 0.72), b = rnd(0, 20, 5);
  const m = EX.bem + p + f + b, mo = EX.bem*EX.bemArm + p*EX.seatArm + f*EX.fuelArm + b*EX.bagArm, cg = mo / m;
  return { q:`Example aircraft: basic empty mass ${EX.bem} kg at ${EX.bemArm} m; front seats ${p} kg at ${EX.seatArm} m; fuel ${L} L (at 0.72 kg/L = ${f} kg) at ${EX.fuelArm} m; baggage ${b} kg at ${EX.bagArm} m. Where is the CG, in metres aft of the datum? (two decimal places)`, a:Math.round(cg*100)/100, tol:0.01, unit:" m",
    steps:[`Moments: ${EX.bem}×${EX.bemArm} = ${(EX.bem*EX.bemArm).toFixed(1)}; ${p}×${EX.seatArm} = ${(p*EX.seatArm).toFixed(1)}; ${f}×${EX.fuelArm} = ${(f*EX.fuelArm).toFixed(1)}; ${b}×${EX.bagArm} = ${(b*EX.bagArm).toFixed(1)}`,
      `Total mass = ${m} kg; total moment = ${mo.toFixed(1)} kg m`, `CG = ${mo.toFixed(1)} ÷ ${m} = ${cg.toFixed(3)} m`] }; },
  e:"Invented example figures. Use your own aircraft's weight schedule for real loading."},
{type:"calc", gen:() => { const L = rnd(30, 110, 5), kg = L * 0.72;
  return { q:`Avgas has a specific gravity of 0.72. What is the mass of ${L} litres? (nearest kg)`, a:Math.round(kg), tol:1, unit:" kg",
    steps:[`Mass = litres × 0.72`, `${L} × 0.72 = ${kg.toFixed(1)} kg`] }; }},
{type:"calc", gen:() => { const m = rnd(60, 110), a = [0.95, 1.05, 1.6, 2.2][rnd(0, 3)], mo = m * a;
  return { q:`A ${m} kg item is placed ${a} m aft of the datum. What is its moment? (one decimal place)`, a:Math.round(mo*10)/10, tol:0.1, unit:" kg m",
    steps:[`Moment = mass × arm = ${m} × ${a} = ${mo.toFixed(1)} kg m`] }; }},
{q:"What is the main danger of the CG being behind the aft limit?",o:["Reduced stability in pitch and possibly an unrecoverable stall or spin","Heavy elevator forces","A longer take-off run only","Higher fuel consumption only"],e:"An aft CG reduces the tailplane's restoring moment. Beyond the limit, the aircraft may be unstable and recovery may not be possible."},
{q:"What is the main danger of the CG being ahead of the forward limit?",o:["Not enough elevator authority to rotate or flare","The aircraft becomes unstable in pitch","Lower stall speed","Better climb performance"],e:"A forward CG needs more tail download. Near or beyond the limit, you can run out of elevator at low speed."},
{q:"Why should the CG be checked for the landing as well as the take-off?",o:["Burning fuel changes both the mass and the CG during the flight","The datum moves in flight","Passengers may move about","It is only required for aerobatics"],e:"If the fuel tanks are away from the CG, using fuel moves it. Some loadings are fine at take-off but out of limits at landing."},
{q:"Which effect would being over the maximum take-off mass NOT cause?",o:["A lower stall speed","A longer take-off run","A poorer rate of climb","Higher loads on the structure"],e:"More mass raises the stall speed; it also lengthens the take-off and reduces climb."},
{type:"order", q:"Put the steps of a mass and balance calculation in order.", items:["List each item's mass and arm","Work out each moment (mass × arm)","Add up the masses and the moments","Divide total moment by total mass to find the CG","Check mass and CG against the POH envelope"],
  e:"Then repeat for the landing, with the fuel you expect to use taken off."},
{q:"What is included in the basic empty mass?",o:["The aircraft, unusable fuel, full oil and fixed equipment","The aircraft plus a full load of fuel","The aircraft plus the pilot","Only the airframe without the engine"],e:"Basic empty mass comes from the aircraft's weight schedule, which is updated when equipment changes."}
]});

T.push({ id:"takeoff", ref:"030 · 2", title:"Take-off and landing performance",
blurb:"Runway distances, what makes them longer, the CAA factors and safety margins, and the effect of wind.",
learn:()=>`
<h3>Declared distances</h3>
<div class="tbl"><table>
<tr><th>Distance</th><th>Meaning</th></tr>
<tr><td>TORA</td><td>Take-off run available: the runway length available for the ground run</td></tr>
<tr><td>TODA</td><td>Take-off distance available: TORA plus any clearway</td></tr>
<tr><td>ASDA</td><td>Accelerate-stop distance available: TORA plus any stopway</td></tr>
<tr><td>LDA</td><td>Landing distance available</td></tr>
</table></div>
<h3>CAA factors</h3>
<p>From the CAA's Safety Sense leaflet on aeroplane performance. The factors <b>multiply</b> together.</p>
${factorsTable}
<p>Example: book take-off distance 400 m, dry grass (×1.20), 10 °C warmer than the chart (×1.10), safety factor (×1.33): 400 × 1.20 × 1.10 × 1.33 = <b>702 m</b> needed.</p>
<h3>Wind</h3>
<p>When using the POH charts, the CAA advises allowing for <b>no more than 50% of the reported headwind</b> component and <b>at least 150% of any tailwind</b> component. Headwind shortens the distances; tailwind lengthens them sharply.</p>
<div class="box trap"><b>Common trap</b>Don't add the percentages; multiply the factors. 1.20 × 1.30 is 1.56, not 1.50.</div>`,
qs:[
{type:"calc", gen:() => { const d = rnd(300, 500, 10); const opts = [["dry grass",1.2],["wet grass",1.3],["a 2% uphill slope",1.1],["an aerodrome 1,000 ft above sea level",1.1],["a temperature 10 °C above the chart figure",1.1],["10% more weight than the chart",1.2]];
  const a = opts[rnd(0, 5)], b = opts.filter(x => x !== a)[rnd(0, 4)], r = d * a[1] * b[1] * 1.33;
  return { q:`The POH gives an unfactored take-off distance of ${d} m. Conditions: ${a[0]} and ${b[0]}. Using the CAA factors and the 1.33 safety factor, what distance do you need? (nearest 10 m)`, a:Math.round(r/10)*10, tol:10, unit:" m",
    steps:[`Factors: ${a[0]} ×${a[1]}, ${b[0]} ×${b[1]}, safety ×1.33`, `${d} × ${a[1]} × ${b[1]} × 1.33 = ${r.toFixed(0)} m`] }; },
  e:"Factors multiply. Compare the answer with the take-off distance available."},
{type:"calc", gen:() => { const d = rnd(350, 480, 10), wet = rnd(0, 1), f = wet ? 1.35 : 1.15, r = d * f * 1.43;
  return { q:`The POH gives an unfactored landing distance of ${d} m. You are landing on ${wet ? "wet" : "dry"} grass. Using the CAA factors and the 1.43 safety factor, what landing distance do you need? (nearest 10 m)`, a:Math.round(r/10)*10, tol:10, unit:" m",
    steps:[`${wet ? "Wet" : "Dry"} grass landing factor ×${f}; safety factor ×1.43`, `${d} × ${f} × 1.43 = ${r.toFixed(0)} m`] }; }},
{q:"How should the CAA performance factors be combined?",o:["Multiplied together","Added together","Only the largest one used","Averaged"],e:"The Safety Sense leaflet is explicit: factors must be multiplied."},
{q:"What is the CAA's recommended safety factor for take-off distance, if the POH figures are unfactored?",o:["1.33","1.43","1.10","2.00"],e:"1.33 for take-off and 1.43 for landing."},
{q:"What is the CAA's recommended safety factor for landing distance, if the POH figures are unfactored?",o:["1.43","1.33","1.15","1.50"],e:"Landing has the higher factor, 1.43, because touchdown point and technique vary more."},
{q:"What factor does dry grass add to the take-off distance?",o:["1.20","1.30","1.10","1.43"],e:"Dry grass up to 20 cm on firm soil: ×1.20 for take-off. Wet grass: ×1.30."},
{q:"When using the POH wind correction, how much of a reported headwind does the CAA advise you to allow for?",o:["No more than 50%","All of it","150%","None"],e:"Wind varies, so take credit for only half the headwind, and allow for at least 150% of any tailwind."},
{q:"What is TODA?",o:["Take-off run available plus any clearway","The length of the runway only","The runway plus stopway","The landing distance available"],e:"TODA = TORA + clearway. ASDA = TORA + stopway."},
{q:"Which combination gives the longest take-off distance?",o:["Heavy, hot, high aerodrome, wet grass, slight tailwind","Light, cold, sea level, paved, headwind","Light, hot, sea level, paved","Heavy, cold, sea level, paved, headwind"],e:"Each adverse factor multiplies the distance: weight, temperature, elevation, surface and tailwind all add up fast."},
{q:"What factor does a tailwind of 10% of the lift-off speed add to the take-off distance?",o:["1.20","1.05","1.10","1.50"],e:"Even a small tailwind makes a big difference: ×1.20 for take-off and landing."},
{type:"match", q:"Match each declared distance to its definition.", pairs:[["TORA","Runway length available for the ground run"],["TODA","TORA plus clearway"],["ASDA","TORA plus stopway"],["LDA","Length available for landing"]],
  e:"Declared distances are published in the AIP and flight guides for each runway."},
{q:"Very short wet grass on firm subsoil can be very slippery. What landing distance increase does the CAA leaflet mention for it?",o:["Up to 60% (a factor of 1.6)","10%","25%","There is no effect"],e:"Short, wet grass can behave like ice for braking. The leaflet notes it can give a 60% increase."}

T.push({ id:"density", ref:"030 · 3", title:"Pressure and density altitude",
blurb:"Working out pressure altitude and density altitude, and what they do to performance.",
learn:()=>`
<h3>Pressure altitude</h3>
<p>Pressure altitude is the altitude in the standard atmosphere for the pressure you're at. It is what the altimeter shows with <b>1013 hPa</b> set. From the aerodrome elevation and QNH:</p>
<p><span class="mono">pressure altitude = elevation + (1013 − QNH) × 30 ft</span></p>
<p>Example: elevation 500 ft, QNH 1003: 500 + 10 × 30 = <b>800 ft</b>.</p>
<h3>Density altitude</h3>
<p>Density altitude is pressure altitude corrected for temperature. Performance depends on density, so a hot day at a low aerodrome can perform like a much higher one. A rule of thumb:</p>
<p><span class="mono">density altitude ≈ pressure altitude + 120 × (OAT − ISA temperature) ft</span></p>
<p>Example: pressure altitude 800 ft (ISA about 13 °C), OAT 28 °C: 800 + 120 × 15 = <b>2,600 ft</b>.</p>
<h3>Effect on performance</h3>
<ul>
<li>Less dense air means less engine power, less propeller thrust and less lift at a given true airspeed.</li>
<li>Take-off and landing runs get longer (true airspeed is higher for the same IAS) and climb rates fall.</li>
<li>Humidity also reduces density a little.</li>
</ul>`,
qs:[
{type:"calc", gen:() => { const el = rnd(0, 800, 50), q = rnd(990, 1030); const pa = el + (1013 - q) * 30;
  return { q:`Aerodrome elevation ${el} ft, QNH ${q} hPa. What is the pressure altitude? (use 30 ft per hPa; a minus sign if below sea level)`, a:pa, tol:0, unit:" ft", neg:true,
    steps:[`Pressure altitude = elevation + (1013 − QNH) × 30`, `${el} + (1013 − ${q}) × 30 = ${el} + ${(1013 - q) * 30} = ${pa} ft`] }; },
  e:"Low QNH raises the pressure altitude; high QNH lowers it."},
{type:"calc", gen:() => { const pa = rnd(0, 3000, 500), isa = 15 - 2 * pa / 1000, oat = Math.round(isa + rnd(5, 20)), da = pa + 120 * (oat - isa);
  return { q:`Pressure altitude ${pa} ft, outside air temperature ${oat} °C. Using the 120 ft per °C rule and 2 °C per 1,000 ft for ISA, what is the density altitude? (nearest 100 ft)`, a:Math.round(da/100)*100, tol:100, unit:" ft",
    steps:[`ISA at ${pa} ft = 15 − ${2*pa/1000} = ${isa} °C`, `ISA deviation = ${oat} − ${isa} = ${oat - isa} °C`, `DA = ${pa} + 120 × ${oat - isa} = ${da} ft`] }; }},
{q:"What does the altimeter show when 1013 hPa is set on the subscale?",o:["Pressure altitude","Density altitude","Height above the aerodrome","True altitude"],e:"Pressure altitude is the altitude in the standard atmosphere for the current pressure."},
{q:"Which conditions give a high density altitude?",o:["High temperature, high elevation, low pressure","Low temperature, low elevation, high pressure","Low temperature, high pressure","Any cloudy day"],e:"Heat, height and low pressure all reduce density."},
{q:"How does a high density altitude affect take-off performance?",o:["Longer take-off run and poorer climb","Shorter take-off run","No effect if the IAS is the same","Better climb"],e:"Less power, less thrust, and a higher true airspeed for the same IAS all lengthen the run and reduce the climb."},
{q:"Aerodrome elevation 300 ft, QNH 1023 hPa. What is the pressure altitude?",o:["0 ft","600 ft","300 ft","−300 ft"],e:"300 + (1013 − 1023) × 30 = 300 − 300 = 0 ft."},
{q:"How does humidity affect air density?",o:["Humid air is slightly less dense","Humid air is much denser","It has no effect","Humid air is denser only in winter"],e:"Water vapour is lighter than the nitrogen and oxygen it replaces, so moist air is slightly less dense."},
{q:"At a high density altitude, compared with sea level, the true airspeed at lift-off (same IAS) is:",o:["Higher","Lower","The same","Zero"],e:"In thinner air the same IAS means a higher TAS, and so a higher groundspeed and longer run."},
{q:"Why is density altitude important when using performance charts?",o:["Aircraft performance depends on air density, not just elevation","It changes the aircraft's empty mass","It is needed for the radio","It sets the transponder code"],e:"Many POH charts take pressure altitude and temperature as inputs, which together give density."},
{type:"match", q:"Match each term to its meaning.", pairs:[["Pressure altitude","Altitude shown with 1013 hPa set"],["Density altitude","Pressure altitude corrected for temperature"],["Elevation","Height of the aerodrome above mean sea level"]],
  e:"Elevation is fixed; pressure and density altitude change with the weather."}
]});

T.push({ id:"climbcruise", ref:"030 · 4", title:"Climb, cruise, range and endurance",
blurb:"What changes climb performance, and how to fly for the longest distance or the longest time.",
learn:()=>`
<h3>Climb</h3>
<ul>
<li><b>Vx</b> (best angle) gives most height for distance: obstacle clearance.</li>
<li><b>Vy</b> (best rate) gives most height for time: the normal climb.</li>
<li>Climb performance falls with more weight, higher density altitude and higher temperature. Flap usually reduces the rate of climb.</li>
</ul>
<h3>Range and endurance</h3>
<div class="tbl"><table>
<tr><th>Aim</th><th>Fly at</th></tr>
<tr><td>Maximum range (furthest distance)</td><td>Roughly the speed for best lift/drag ratio; a little faster into a headwind, a little slower with a tailwind</td></tr>
<tr><td>Maximum endurance (longest time)</td><td>A lower speed, for the least power required</td></tr>
</table></div>
<ul>
<li>Leaning the mixture as the POH directs reduces fuel flow in the cruise.</li>
<li>Wind doesn't change endurance, but it changes the distance covered in that time.</li>
<li>The POH cruise tables give power settings, TAS and fuel flow for different altitudes and RPM.</li>
</ul>`,
qs:[
{q:"Which speed gives the greatest height gain in a given time?",o:["Vy","Vx","Vne","Vfe"],e:"Vy is best rate of climb. Vx is best angle."},
{q:"How does increased weight affect the rate of climb?",o:["It reduces it","It increases it","No effect","It increases it only at high altitude"],e:"More weight needs more lift and more power just to stay level, leaving less spare for climbing."},
{q:"To stay airborne for the longest time (for example while holding), you should fly at:",o:["The maximum endurance speed, which is lower than the best range speed","Vne","The maximum range speed","Full power"],e:"Endurance is about using the least fuel per hour, which happens at the speed for least power required."},
{q:"Flying into a strong headwind, how should the speed for best range change?",o:["Fly a little faster","Fly a little slower","No change","Fly at Vx"],e:"Into a headwind, a bit more speed reduces the time spent fighting the wind, improving range over the ground."},
{q:"Does wind affect the endurance of an aircraft?",o:["No; it affects distance covered, not time airborne","Yes; a headwind increases endurance","Yes; a tailwind increases endurance","Only above 5,000 ft"],e:"Endurance depends on fuel flow. Wind changes how far you get in that time."},
{q:"What is the usual effect of lowering flap on the rate of climb?",o:["It reduces it","It increases it","No effect","It doubles it"],e:"Flap adds drag. Small settings may sometimes help the angle of climb from a short strip, as the POH directs, but the rate is reduced."},
{type:"calc", gen:() => { const f = rnd(60, 100, 5), r = rnd(18, 28), m = f / r * 60;
  return { q:`Usable fuel ${f} L, fuel flow ${r} L/h. What is the endurance in minutes, with no reserve? (nearest minute)`, a:Math.round(m), tol:1, unit:" min",

{q:"Where would you find the fuel flow for a given cruise power setting and altitude?",o:["The cruise performance table in the POH","The certificate of airworthiness","The tech log","The ASI markings"],e:"The POH cruise tables give RPM, TAS and fuel flow at different altitudes and temperatures."},
{q:"How does a higher density altitude affect the climb?",o:["Climb rate reduces","Climb rate increases","No change","Only Vx changes"],e:"Less power and thrust are available in thinner air, so the climb rate falls."},
{type:"match", q:"Match each speed or aim to what it gives you.", pairs:[["Vx","Most height for distance"],["Vy","Most height for time"],["Best range speed","Most distance for fuel"],["Best endurance speed","Most time for fuel"]],
  e:"The POH gives the actual speeds for your aircraft."}
]});

T.push({ id:"fuelplan", ref:"030 · 5", title:"Fuel planning",
blurb:"Building up the fuel for a flight, the reserve rules, conversions and monitoring fuel in flight.",
learn:()=>`
<h3>Building up the fuel</h3>
<div class="tbl"><table>
<tr><th>Part</th><th>What for</th></tr>
<tr><td>Taxi</td><td>Start-up, taxi and power checks</td></tr>
<tr><td>Trip</td><td>Take-off, climb, cruise and descent to the destination</td></tr>
<tr><td>Contingency</td><td>Unexpected headwinds, routing changes, holding</td></tr>
<tr><td>Alternate</td><td>Diverting from the destination to an alternate, if needed</td></tr>
<tr><td>Final reserve</td><td>Fuel you plan never to use</td></tr>
</table></div>
<h3>Final reserve for aeroplanes (non-commercial rules)</h3>
<ul>
<li><b>VFR by day</b>: 30 minutes at holding speed at 1,500 ft above the destination.</li>
<li>VFR by day, taking off and landing at the same aerodrome and staying within sight of it: 10 minutes at maximum continuous cruise power.</li>
<li>VFR by night: 45 minutes.</li>
</ul>
<p>Many schools and pilots set a larger personal reserve, for example an hour. Check your school's rules.</p>
<h3>Conversions</h3>
<p>1 US gallon = 3.785 L. 1 imperial gallon = 4.546 L. Avgas: 1 L ≈ 0.72 kg.</p>
<h3>In flight</h3>
<ul>
<li>Check fuel against the plan at regular intervals (the F in FREDA). If it doesn't match, find out why.</li>
<li>Decide early: divert while you still have options, not when the reserve is being used.</li>
</ul>`,
qs:[
{q:"What is the final reserve fuel for an aeroplane flying VFR by day under the non-commercial rules?",o:["30 minutes at holding speed at 1,500 ft above the destination","10 minutes in all cases","45 minutes","1 hour"],e:"30 minutes for VFR by day; 45 for VFR by night. The 10-minute case applies only to flights staying in sight of the departure aerodrome."},
{q:"When may the shorter 10-minute final reserve be used for a VFR day flight?",o:["When taking off and landing at the same aerodrome and staying within sight of it","On any local flight","When the weather is good","When carrying no passengers"],e:"It is a narrow case: same aerodrome, in sight of it throughout."},
{type:"calc", gen:() => { const t = rnd(40, 120, 5), r = rnd(18, 28), trip = r * t / 60, res = r * 0.5, tot = trip + res;
  return { q:`Flight time ${t} min, fuel flow ${r} L/h. Ignoring taxi and contingency, how much fuel do you need for the trip plus a 30-minute final reserve? (nearest litre)`, a:Math.round(tot), tol:1, unit:" L",
    steps:[`Trip = ${r} × ${t}/60 = ${trip.toFixed(1)} L`, `Reserve = ${r} × 0.5 = ${res.toFixed(1)} L`, `Total = ${tot.toFixed(1)} L`] }; },
  e:"Add taxi and contingency fuel too, and never plan to use the final reserve."},
{type:"calc", gen:() => { const g = rnd(15, 26), l = g * 3.785;
  return { q:`A POH gives usable fuel as ${g} US gallons. How many litres is that? (nearest litre)`, a:Math.round(l), tol:1, unit:" L",
    steps:[`1 US gallon = 3.785 L`, `${g} × 3.785 = ${l.toFixed(1)} L`] }; }},
{type:"calc", gen:() => { const kg = rnd(30, 80), l = kg / 0.72;
  return { q:`How many litres of avgas weigh ${kg} kg? (nearest litre)`, a:Math.round(l), tol:1, unit:" L",
    steps:[`Litres = kg ÷ 0.72`, `${kg} ÷ 0.72 = ${l.toFixed(1)} L`] }; }},
{q:"What is contingency fuel for?",o:["Unexpected extras such as stronger headwinds or a route change","Starting the engine","The final approach only","Filling the tanks to the top"],e:"Contingency covers the unexpected without eating into the final reserve."},
{type:"order", q:"Put the parts of the fuel calculation in the order they're used in a flight.", items:["Taxi fuel","Trip fuel","Contingency fuel","Alternate fuel","Final reserve"],
  e:"Plan to land with the final reserve still in the tanks."},
{q:"Halfway through a flight you have used more fuel than planned. What should you do?",o:["Work out why, recalculate, and divert early if the reserve is threatened","Carry on and hope the wind changes","Lean the mixture fully and continue","Ignore it; the gauges are unreliable"],e:"Fuel checks against the plan are there to catch this. Decide early, while you still have options."},
{q:"What is the final reserve for an aeroplane flying VFR at night?",o:["45 minutes","30 minutes","10 minutes","60 minutes"],e:"At night the reserve rises to 45 minutes at holding speed at 1,500 ft above the destination."},
{q:"Why is unusable fuel excluded from fuel planning?",o:["The fuel system cannot deliver it to the engine","It is contaminated","It is kept for emergencies","It is too heavy"],e:"Only usable fuel keeps the engine running."},
{q:"The fuel gauges read more than your fuel log shows. Which should you trust for planning?",o:["The lower figure, and check why they differ","The higher figure","The gauges always","Neither; land immediately"],e:"Light aircraft gauges are often inaccurate. Plan on the more conservative figure and use time and fuel flow as your main check."}
]});

T.push({ id:"planning", ref:"030 · 6", title:"Flight planning and the PLOG",
blurb:"Planning a cross-country: route, safety altitude, the PLOG, weather, NOTAMs and notification.",
learn:()=>`
<h3>Planning a route</h3>
<ul>
<li>Draw the route on the current chart, checking airspace, danger areas, obstacles and terrain.</li>
<li>Choose turning points that are easy to identify.</li>
<li>Work out a <b>safety altitude</b> for each leg. A common method: the highest ground or obstacle within 5 nm of track, plus 1,000 ft, rounded up to the next 100 ft. Your school may use a different margin.</li>
<li>Pick cruising levels that clear the safety altitude where possible and suit the airspace.</li>
</ul>
<h3>The PLOG</h3>
<div class="tbl"><table>
<tr><th>Column</th><th>Source</th></tr>
<tr><td>True track and distance</td><td>Measured on the chart</td></tr>
<tr><td>Wind velocity</td><td>Forecast for the level and time</td></tr>
<tr><td>Heading and groundspeed</td><td>Wind triangle (flight computer)</td></tr>
<tr><td>Magnetic heading</td><td>True heading ± variation</td></tr>
<tr><td>Time and fuel</td><td>Distance ÷ groundspeed; time × fuel flow</td></tr>
</table></div>
<h3>Before you go</h3>
<ul>
<li>Weather: forecasts, METARs and TAFs for departure, destination and alternates.</li>
<li>NOTAMs for the route and aerodromes, and any temporary restrictions.</li>
<li>Prior permission (PPR) where the destination needs it; opening hours.</li>
<li>Mass and balance, performance and fuel.</li>
<li>Book out with the departure aerodrome. A flight plan is required for some flights, for example when crossing an international FIR boundary.</li>
</ul>`,
qs:[
{type:"calc", gen:() => { const h = rnd(400, 2600, 10), sa = Math.ceil((h + 1000) / 100) * 100;
  return { q:`Using the method "highest point within 5 nm of track, plus 1,000 ft, rounded up to the next 100 ft": the highest obstacle near your leg is ${h.toLocaleString("en-GB")} ft AMSL. What is the safety altitude?`, a:sa, tol:0, unit:" ft",
    steps:[`${h} + 1,000 = ${h + 1000} ft`, `Round up to the next 100 ft: ${sa} ft`] }; },
  e:"Different schools use different margins; follow yours."},
{q:"Which wind direction goes into the PLOG wind triangle?",o:["The forecast wind, in degrees true","The surface wind from the ATIS in degrees magnetic","The wind at the destination only","No wind is needed"],e:"Forecast winds aloft are in degrees true, matching true tracks measured on the chart. Convert to magnetic heading after the triangle."},
{q:"Why should turning points be features that are easy to identify?",o:["So you can confirm your position at each change of heading","They make the route shorter","They avoid the need for a PLOG","They are required by law"],e:"A turning point you can't find makes every leg after it uncertain."},
{q:"Which of these should you check before a cross-country flight?",o:["NOTAMs for the route and aerodromes","The aircraft's last owner","The fuel price","The previous day's METARs only"],e:"NOTAMs can close aerodromes, activate restricted airspace or warn of hazards."},
{q:"When is a flight plan required in the UK for a VFR flight?",o:["For some flights, for example when crossing an international FIR boundary","For every flight","Never","Only at night"],e:"Most UK domestic VFR flights only need booking out, but flights crossing international FIR boundaries need a flight plan. Check the current requirements in the AIP."},
{q:"What does PPR mean?",o:["Prior permission required","Pilot position report","Public parking restricted","Planned power reduction"],e:"Many aerodromes require you to contact them before arriving."},
{type:"order", q:"Put these PLOG steps for one leg in a sensible order.", items:["Measure true track and distance on the chart","Enter the forecast wind for the level","Work out true heading and groundspeed","Apply variation to get magnetic heading","Work out the time and fuel for the leg"],
  e:"Then add up times and fuel for the whole route and compare with the fuel available."},
{q:"What is the main purpose of a safety altitude?",o:["To give clearance above terrain and obstacles if visibility deteriorates","To set the transition altitude","To decide the cruising speed","To satisfy ATC only"],e:"It's the altitude to climb to if you lose sight of the ground or are uncertain of position."},
{type:"calc", gen:() => { const d = rnd(20, 60), g = rnd(80, 115, 5), r = rnd(20, 26), m = d * 60 / g, f = r * m / 60;
  return { q:`PLOG leg: ${d} nm at a groundspeed of ${g} kt, fuel flow ${r} L/h. How much fuel will the leg use? (one decimal place)`, a:Math.round(f*10)/10, tol:0.3, unit:" L",
    steps:[`Time = ${d} × 60 ÷ ${g} = ${m.toFixed(1)} min`, `Fuel = ${r} × ${m.toFixed(1)} ÷ 60 = ${f.toFixed(1)} L`] }; }},
{q:"Why should you plan an alternate aerodrome?",o:["In case the destination becomes unavailable or the weather worsens","Because it is always a legal requirement for VFR","To make the flight longer","To refuel on every flight"],e:"An alternate gives you a planned option if things change. Include the fuel to reach it."},
{type:"match", q:"Match each source to what you get from it.", pairs:[["AIP aerodrome pages","Runways, circuits, frequencies and procedures"],["NOTAMs","Temporary changes and hazards"],["TAF","Forecast weather at an aerodrome"],["Chart","Airspace, terrain and obstacles"]],
  e:"A complete brief uses all of them."}
]});

T.push({ id:"hypoxia", ref:"040 · 1", title:"Breathing, hypoxia and carbon monoxide",
blurb:"What happens to the body as air pressure falls, and two cabin hazards that feel the same.",
learn:()=>`
<h3>The atmosphere and oxygen</h3>
<p>Air is about <b>21% oxygen</b> at every altitude a light aircraft reaches. What falls with height is the <b>pressure</b>, so each breath delivers less oxygen into the blood.</p>
<h3>Hypoxia</h3>
<p>Hypoxia is a shortage of oxygen in the body's tissues. It is dangerous because it is <b>insidious</b>: one of the first things it affects is judgement, so the pilot may feel fine, even euphoric.</p>
<ul>
<li>Symptoms include impaired judgement, euphoria, slowed thinking, headache, tingling, visual impairment and cyanosis (blue lips and fingernails).</li>
<li><b>Night vision</b> is one of the first things affected, from as low as about 5,000 ft.</li>
<li>Smoking, alcohol, fatigue and poor fitness all lower your tolerance.</li>
<li>Treatment: descend, and use oxygen if available.</li>
</ul>
<h3>Hyperventilation</h3>
<p>Over-breathing, often from anxiety, washes too much <b>carbon dioxide</b> out of the blood. Symptoms are dizziness, tingling in the hands and lips, and feeling light-headed, very similar to hypoxia. Treatment: consciously slow your breathing rate and depth, or talk out loud, which naturally slows it.</p>
<h3>Carbon monoxide</h3>
<p>Carbon monoxide is colourless and odourless. In a light aircraft it most often comes from an exhaust leak into the <b>cabin heater</b>. It binds to haemoglobin about 200 times more readily than oxygen, so even small amounts block oxygen transport. Symptoms: headache, drowsiness, nausea, impaired judgement.</p>
<p>Action: heater off, fresh air vents open, land as soon as possible. A carbon monoxide detector in the cockpit is cheap protection.</p>
<div class="box trap"><b>Common trap</b>The proportion of oxygen does not fall with height. The partial pressure of oxygen does.</div>`,
qs:[
{q:"How does the percentage of oxygen in the air change as you climb in a light aircraft?",o:["It stays at about 21%","It falls steadily","It rises","It halves every 5,000 ft"],e:"The proportion stays at about 21%. The total pressure, and so the partial pressure of oxygen, falls."},
{q:"Why is hypoxia particularly dangerous for a pilot?",o:["Its early effects impair judgement, so the pilot may not recognise it","It always causes immediate unconsciousness","It only occurs above 25,000 ft","It is always accompanied by severe pain"],e:"Hypoxia is insidious: it degrades judgement early, and can bring euphoria, so the pilot may feel fine while performing badly."},
{q:"Which faculty is often affected first by mild hypoxia at moderate altitudes?",o:["Night vision","Hearing","Sense of smell","Muscle strength"],e:"Night vision is sensitive to reduced oxygen and can be impaired from as low as about 5,000 ft."},
{q:"What causes the symptoms of hyperventilation?",o:["Too much carbon dioxide being breathed out","Too little oxygen in the air","Carbon monoxide in the cabin","Nitrogen bubbles in the blood"],e:"Over-breathing lowers the carbon dioxide level in the blood, causing dizziness and tingling. The cure is to slow the breathing down."},
{q:"In a single-engine light aircraft, what is the most likely source of carbon monoxide in the cabin?",o:["An exhaust leak into the cabin heating system","The fuel tanks","The battery","Passengers' breath"],e:"Cabin heat is usually taken from a muff around the exhaust. A crack lets exhaust gas, including carbon monoxide, into the cabin."},
{q:"You suspect carbon monoxide poisoning in flight. What should you do?",o:["Turn the heater off, open the fresh air vents and land as soon as possible","Turn the heater up and climb","Breathe faster to clear it","Continue and see if the symptoms go"],e:"Stop the source, ventilate, and land. Carbon monoxide leaves the blood slowly, so symptoms can persist."},
{q:"Why is carbon monoxide so harmful even in small amounts?",o:["It combines with haemoglobin far more readily than oxygen does","It displaces nitrogen in the lungs","It raises blood pressure","It irritates the eyes"],e:"Haemoglobin takes up carbon monoxide about 200 times more readily than oxygen, so it blocks the blood's oxygen-carrying capacity."}
]});

T.push({ id:"vision", ref:"040 · 2", title:"Vision and lookout",
blurb:"How the eye works, night adaptation, scanning for traffic and approach illusions.",
learn:()=>`
<h3>The eye</h3>
<div class="tbl"><table>
<tr><th>Cells</th><th>Where</th><th>Good for</th></tr>
<tr><td>Cones</td><td>Concentrated at the centre (the fovea)</td><td>Colour and fine detail, in good light</td></tr>
<tr><td>Rods</td><td>Around the edge of the retina</td><td>Low light and movement; no colour</td></tr>
</table></div>
<ul>
<li>The <b>blind spot</b> is where the optic nerve leaves the eye. Using both eyes and moving the head covers it.</li>
<li>Full <b>dark adaptation</b> takes about 30 minutes. A bright light destroys it in seconds.</li>
<li>At night, look slightly to one side of an object (<b>off-centre viewing</b>), because the centre of the eye has no rods.</li>
</ul>
<h3>Lookout</h3>
<ul>
<li>In a featureless sky the eye relaxes to focus a metre or two away (<b>empty field myopia</b>). Focus on something distant, such as a cloud or the horizon, then scan.</li>
<li>The eye sees detail only when it stops. Scan in short, regular steps of about 10°, pausing at each.</li>
<li>An aircraft on a collision course stays at a <b>constant relative bearing</b>. It does not appear to move, and grows very slowly until the last few seconds.</li>
</ul>
<h3>Approach illusions</h3>
<div class="tbl"><table>
<tr><th>Runway</th><th>Makes you feel</th><th>Risk</th></tr>
<tr><td>Upsloping</td><td>Too high</td><td>Flying a low approach</td></tr>
<tr><td>Downsloping</td><td>Too low</td><td>Flying a high approach</td></tr>
<tr><td>Narrower than usual</td><td>Too high</td><td>Flying a low approach</td></tr>
<tr><td>Wider than usual</td><td>Too low</td><td>Flying a high approach</td></tr>
</table></div>`,
qs:[
{q:"Which cells in the eye are mainly used for vision at night?",o:["Rods","Cones","The fovea","The optic nerve"],e:"Rods are sensitive to low light and movement but not colour. Cones need good light."},
{q:"About how long does it take for the eyes to fully adapt to darkness?",o:["30 minutes","2 minutes","5 minutes","2 hours"],e:"Full dark adaptation takes around 30 minutes, and bright light can undo it almost at once."},
{q:"Another aircraft is on a collision course with you. How will it appear?",o:["Stationary in your field of view, at a constant relative bearing","Moving rapidly across the windscreen","Getting smaller","Moving up and down"],e:"An aircraft that is going to hit you holds the same relative position. Its lack of movement makes it hard to spot."},
{q:"What is empty field myopia?",o:["The eye relaxing to focus close by when there is nothing to look at","Short-sightedness caused by bright sunlight","Loss of colour vision at altitude","The blind spot in each eye"],e:"With no features to focus on, the eye focuses a metre or two away, so distant aircraft are missed. Focus on something distant before scanning."},
{q:"What is the best technique for scanning for other traffic?",o:["Short, regular movements of about 10°, pausing at each","One continuous sweep from side to side","Staring straight ahead","Looking only where traffic is reported"],e:"The eye only detects detail when it is still, so scan in short steps with a pause at each."},
{q:"Approaching an upsloping runway, what illusion is likely?",o:["Feeling too high, leading to a low approach","Feeling too low, leading to a high approach","Feeling too fast","No illusion"],e:"An upslope makes the runway look longer and steeper, as if you are high. Pilots then tend to descend too low."},
{q:"At night, how should you look at a dim object to see it best?",o:["Slightly to one side of it","Directly at it","With one eye closed","Through a red filter"],e:"The centre of the eye has only cones, which need good light. Looking slightly off-centre puts the image on the rods."}
]});

T.push({ id:"balance", ref:"040 · 3", title:"Balance, disorientation and pressure",
blurb:"The balance organs, the illusions they produce, and what pressure changes do to ears, sinuses and divers.",
learn:()=>`
<h3>The balance organs</h3>
<ul>
<li>The <b>semicircular canals</b> detect <b>angular acceleration</b> (starting or stopping a rotation). A steady rate of turn soon stops being felt.</li>
<li>The <b>otoliths</b> detect <b>linear acceleration</b> and gravity. They cannot tell the difference between tilting and accelerating.</li>
</ul>
<h3>Illusions</h3>
<div class="tbl"><table>
<tr><th>Illusion</th><th>Cause</th><th>Feels like</th></tr>
<tr><td>The leans</td><td>A slow roll into a turn goes undetected; rolling level is felt</td><td>Banked the other way when actually level</td></tr>
<tr><td>Somatogravic</td><td>Forward acceleration, e.g. take-off or go-around at night</td><td>Nose-up pitch, tempting the pilot to push the nose down</td></tr>
<tr><td>Coriolis</td><td>Moving the head during a turn</td><td>Strong tumbling sensation</td></tr>
</table></div>
<p>Without visual references these feelings are unreliable. The answer is to believe the instruments, and to avoid flying into cloud or poor visibility without the training to do so.</p>
<h3>Pressure changes</h3>
<ul>
<li>The <b>Eustachian tube</b> equalises pressure in the middle ear. Air escapes easily on the climb; on the <b>descent</b>, air has to get back in, and a cold or congestion can block it, causing severe ear pain. The <b>Valsalva</b> manoeuvre (pinch the nose, close the mouth, gently blow) helps. Don't fly with a heavy cold.</li>
<li>Sinuses can be blocked the same way.</li>
<li><b>Scuba diving</b>: the body absorbs extra nitrogen under water. Flying soon afterwards lowers the pressure further, and nitrogen can form bubbles in the blood (<b>decompression sickness</b>). Leave a suitable interval after diving; check current guidance with your instructor or AME.</li>
</ul>`,
qs:[
{q:"What do the semicircular canals detect?",o:["Angular acceleration","Linear acceleration","Gravity alone","Sound"],e:"The canals respond to changes in rotation. Linear acceleration and gravity are sensed by the otoliths."},
{q:"After a long, steady turn, a pilot rolls level but feels banked the other way. What is this illusion called?",o:["The leans","Somatogravic illusion","Coriolis illusion","Empty field myopia"],e:"The canals adapted to the steady turn, so rolling level is sensed as a roll in the opposite direction."},
{q:"At night, a pilot accelerating on take-off feels the nose pitching up. What is this, and what is the danger?",o:["A somatogravic illusion; the pilot may push the nose down towards the ground","The leans; the pilot may roll the wrong way","Coriolis illusion; the pilot may spin","Hypoxia; the pilot may lose consciousness"],e:"The otoliths can't tell acceleration from a nose-up tilt. Without visual cues, the pilot may lower the nose into a descent."},
{q:"Which head movement during a turn is most likely to cause a strong tumbling sensation?",o:["A sudden head movement, such as looking down to pick something up","Keeping the head still","Looking straight ahead","Closing one eye"],e:"Moving the head during a turn stimulates more than one canal at once, producing the Coriolis illusion."},
{q:"With a heavy cold, when is ear pain most likely in flight?",o:["During the descent","During the climb","In level cruise","Only on the ground"],e:"On the descent air has to flow back into the middle ear through the Eustachian tube, which congestion blocks."},
{q:"What is the Valsalva manoeuvre used for?",o:["To help equalise pressure in the middle ear","To cure hyperventilation","To recover from the leans","To improve night vision"],e:"Gently blowing against a closed mouth and pinched nose pushes air up the Eustachian tube into the middle ear."},
{q:"Why should you avoid flying soon after scuba diving?",o:["Nitrogen absorbed while diving can form bubbles as pressure falls, causing decompression sickness","Diving raises blood alcohol","Diving damages night vision","Salt water affects the balance organs for a week"],e:"Under pressure the body absorbs extra nitrogen. Reducing pressure by flying can bring it out of solution as bubbles. Leave a suitable interval, as current guidance advises."}
