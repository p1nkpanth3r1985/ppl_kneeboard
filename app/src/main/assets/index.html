// =====================================================================
// App logic
// =====================================================================
const KEY = "c150cl.v1";          // checklist progress
const PKEY = "c150cl.prefs";      // display preferences
const MAX_AGE = 6 * 3600 * 1000;  // progress older than 6 h is discarded

let state = {};                   // itemKey -> true
let last = null;                  // id of last phase opened
let prefs = { mode:"day", size:"m", haptic:true };
let staleCleared = false;
let currentPhase = null;
let section = "cl";            // "cl" checklist or "st" Air Law study

const $ = id => document.getElementById(id);
const home = $("home"), phaseView = $("phaseView"), hdr = $("hdr"), hdrTitle = $("hdrTitle");
const hprogBar = $("hprogBar"), modeBtn = $("modeBtn");
const ALL = NORMAL.concat(EMERG);
const byId = id => ALL.find(p => p.id === id);

// ---------- storage (all wrapped: storage can be blocked) ----------
function load(){
  try{ const p = JSON.parse(localStorage.getItem(PKEY) || "null"); if(p) Object.assign(prefs, p); }catch(e){}
  try{
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if(s && s.t){
      if(Date.now() - s.t < MAX_AGE){ state = s.state || {}; last = s.last || null; }
      else { staleCleared = Object.keys(s.state || {}).length > 0; localStorage.removeItem(KEY); }
    }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({ t:Date.now(), state, last })); }catch(e){} }
function savePrefs(){ try{ localStorage.setItem(PKEY, JSON.stringify(prefs)); }catch(e){} }

// ---------- helpers ----------
function itemsOf(phase){
  const out = [];
  phase.subs.forEach((sub,si) => sub.items.forEach((it,ii) => out.push({ key:`${phase.id}.${si}.${ii}`, si, ii, it })));
  return out;
}
function progress(phase){
  const items = itemsOf(phase);
  const done = items.filter(x => state[x.key]).length;
  return { done, total:items.length, next:items.find(x => !state[x.key]) };
}
function resetPhase(phase){ itemsOf(phase).forEach(x => delete state[x.key]); save(); }

let toastT = null;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600);
}
function buzz(){ if(prefs.haptic && navigator.vibrate){ try{ navigator.vibrate(12); }catch(e){} } }

// Two-tap confirm: first tap arms (turns red), second within 3 s fires.
function armedButton(cls, label, armedLabel, action){
  const b = document.createElement("button");
  b.className = cls; b.textContent = label;
  let t = null;
  b.addEventListener("click", () => {
    if(b.classList.contains("armed")){
      clearTimeout(t); b.classList.remove("armed"); b.textContent = label; action();
    } else {
      b.classList.add("armed"); b.textContent = armedLabel;
      t = setTimeout(() => { b.classList.remove("armed"); b.textContent = label; }, 3000);
    }
  });
  return b;
}

// ---------- display prefs ----------
const MODES = { day:{ icon:"☁", name:"Day mode" }, sun:{ icon:"☀", name:"Sunlight mode" }, night:{ icon:"☾", name:"Night mode" } };
const THEME = { day:"#0e3a5c", sun:"#000000", night:"#05090d" };
function applyPrefs(){
  document.body.dataset.mode = prefs.mode;
  document.documentElement.dataset.size = prefs.size;
  modeBtn.textContent = MODES[prefs.mode].icon;
  const tc = document.querySelector('meta[name="theme-color"]'); if(tc) tc.content = THEME[prefs.mode];
}
modeBtn.addEventListener("click", () => {
  const order = ["day","sun","night"];
  prefs.mode = order[(order.indexOf(prefs.mode) + 1) % 3];
  applyPrefs(); savePrefs(); toast(MODES[prefs.mode].name);
});

// ---------- home ----------
function renderHome(){
  currentPhase = null;
  section = "cl"; $("studyView").hidden = true; $("emergFab").hidden = false;
  hdr.classList.add("top"); hdr.classList.remove("insub"); markTabs();
  phaseView.hidden = true; home.hidden = false;
  hdr.classList.remove("inphase");
  hdrTitle.innerHTML = 'Cessna 150/152<small>Pooley’s Checklist · MOD05/18</small>';
  home.innerHTML = "";

  const cav = document.createElement("div");
  cav.className = "caveat";
  cav.textContent = "Not authoritative — supplement to the Pilot's Operating Handbook";
  home.appendChild(cav);

  if(staleCleared){
    const s = document.createElement("div");
    s.className = "stale";
    s.textContent = "Ticks from your last session were over 6 hours old and have been cleared.";
    home.appendChild(s);
  }

  // Continue card: last phase opened, if part-done
  const lp = last && byId(last);
  if(lp){
    const p = progress(lp);
    if(p.done > 0 && p.done < p.total){
      const c = document.createElement("button");
      c.className = "cont";
      c.innerHTML = `<span class="ct"><span class="k">Continue</span><div class="n">${lp.title}</div>`+
        `<div class="x">${p.done} / ${p.total} · Next: ${p.next.it[0]}</div></span><span class="arrow">›</span>`;
      c.addEventListener("click", () => openPhase(lp));
      home.appendChild(c);
    }
  }

  home.appendChild(label("Normal Procedures", false));
  home.appendChild(grid(NORMAL, false));
  home.appendChild(label("Emergencies", true));
  home.appendChild(grid(EMERG, true));
}
function label(text, red){
  const l = document.createElement("div");
  l.className = "grid-label" + (red ? " red" : "");
  l.textContent = text;
  return l;
}
function grid(list, red){
  const g = document.createElement("div");
  g.className = "grid";
  list.forEach((phase, idx) => {
    const b = document.createElement("button");
    b.className = "pbtn" + (red ? " red" : "");
    const p = progress(phase);
    if(red){
      b.innerHTML = `<span class="pnum">E${idx+1}</span><span class="pname">${phase.title}</span>`;
    } else {
      if(p.done === p.total) b.classList.add("done");
      const pct = Math.round(p.done / p.total * 100);
      b.innerHTML = `<span class="pnum">${String(idx+1).padStart(2,"0")}</span>`+
        `<span class="pname">${phase.title}</span>`+
        `<span class="pbar"><i style="width:${pct}%"></i></span>`+
        `<span class="pcount">${p.done === p.total ? "✓ Complete" : p.done + " / " + p.total}</span>`;
    }
    b.addEventListener("click", () => openPhase(phase));
    g.appendChild(b);
  });
  return g;
}

// ---------- phase view ----------
let doneCard = null;
function renderPhase(phase){
  currentPhase = phase;
  last = phase.id; save();
  home.hidden = true; phaseView.hidden = false;
  section = "cl"; $("studyView").hidden = true; $("emergFab").hidden = false;
  hdr.classList.remove("top", "insub");
  hdr.classList.add("inphase");
  phaseView.innerHTML = "";

  if(phase.note){
    const n = document.createElement("div");
    n.className = "pnote" + (phase.emerg ? " warn" : "");
    n.textContent = phase.note;
    phaseView.appendChild(n);
  }

  const singleDrill = phase.subs.length === 1 && phase.subs[0].name === "Drill";
  let lastSi = -1;
  itemsOf(phase).forEach(({ key, si, it }) => {
    if(si !== lastSi && !singleDrill){
      const s = document.createElement("div");
      s.className = "sub" + (phase.emerg ? " red" : "");
      s.textContent = phase.subs[si].name;
      phaseView.appendChild(s);
    }
    lastSi = si;
    const b = document.createElement("button");
    b.className = "ibtn" + (phase.emerg ? " red" : "") + (state[key] ? " checked" : "");
    b.setAttribute("aria-pressed", state[key] ? "true" : "false");
    const mn = it[2] ? `<span class="mn">${it[2]}</span>` : "";
    b.innerHTML = `<span class="box"></span><span class="txt"><span class="chal">${mn}${it[0]}</span><span class="resp">${it[1]}</span></span>`;
    b.addEventListener("click", () => {
      const on = !state[key];
      if(on) state[key] = true; else delete state[key];
      b.classList.toggle("checked", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      save(); buzz();
      refreshPhase(on);
    });
    phaseView.appendChild(b);
  });

  if(phase.endnote){
    const n = document.createElement("div");
    n.className = "pnote warn";
    n.textContent = phase.endnote;
    phaseView.appendChild(n);
  }

  // Completion card with "next phase" button
  doneCard = document.createElement("div");
  doneCard.className = "donecard";
  const idx = NORMAL.indexOf(phase);
  const nextPhase = idx >= 0 ? NORMAL[idx + 1] : null;
  doneCard.innerHTML = `<div class="dt">✓ ${phase.emerg ? "Drill" : "Section"} complete</div>`;
  const nb = document.createElement("button");
  nb.className = "bigbtn" + (nextPhase ? "" : " ghost");
  nb.textContent = nextPhase ? `Next: ${nextPhase.title} ›` : "Back to phases";
  nb.addEventListener("click", () => nextPhase ? openPhase(nextPhase, true) : goHome());
  doneCard.appendChild(nb);
  phaseView.appendChild(doneCard);

  phaseView.appendChild(armedButton("resetbtn", "Reset this section", "Tap again to reset", () => {
    resetPhase(phase); renderPhase(phase); toast("Section reset");
  }));

  window.scrollTo(0, 0);
  refreshPhase(false);
  // Resuming part-way through: bring the next item into view
  const p = progress(phase);
  if(p.done > 0 && p.done < p.total){
    const n = phaseView.querySelector(".ibtn.next");
    if(n) setTimeout(() => n.scrollIntoView({ block:"center" }), 0);
  }
}

// Updates header progress, "next" highlight and completion card.
function refreshPhase(advance){
  const phase = currentPhase; if(!phase) return;
  const p = progress(phase);
  hdrTitle.innerHTML = `${phase.title}<small>${phase.emerg ? "Emergency drill" : "Normal procedure"} · ${p.done} / ${p.total}</small>`;
  hprogBar.style.width = (p.done / p.total * 100) + "%";

  const btns = [...phaseView.querySelectorAll(".ibtn")];
  btns.forEach(b => b.classList.remove("next"));
  const nxt = btns.find(b => !b.classList.contains("checked"));
  doneCard.hidden = !!nxt;
  if(nxt){
    nxt.classList.add("next");
    if(advance) keepInView(nxt);
  } else if(advance){
    doneCard.scrollIntoView({ behavior:"smooth", block:"center" });
  }
}
function keepInView(el){
  const r = el.getBoundingClientRect();
  if(r.top < hdr.offsetHeight + 8 || r.bottom > window.innerHeight - 110){
    el.scrollIntoView({ behavior:"smooth", block:"center" });
  }
}

// ---------- navigation (hardware back button aware) ----------
function openPhase(phase, replace){
  closeSheet();
  renderPhase(phase);
  try{ history[replace ? "replaceState" : "pushState"]({ ph:phase.id }, ""); }catch(e){}
}
function goHome(){
  closeSheet();
  if(history.state && history.state.ph){ try{ history.back(); return; }catch(e){} }
  renderHome();
}
window.addEventListener("popstate", e => {
  closeSheet();
  if(e.state && e.state.st){ Study.fromState(e.state); return; }
  const ph = e.state && e.state.ph && byId(e.state.ph);
  ph ? renderPhase(ph) : renderHome();
});
$("backBtn").addEventListener("click", () => section === "st" ? Study.back() : goHome());

// ---------- section tabs (top-level screens only) ----------
function markTabs(){
  [["tabCl","cl"],["tabSt","st"]].forEach(([id, s]) => { const b = $(id); b.classList.toggle("on", section === s); b.setAttribute("aria-pressed", section === s ? "true" : "false"); });
}
$("tabCl").addEventListener("click", () => { if(section === "cl") return; try{ history.replaceState({}, ""); }catch(e){} renderHome(); });
$("tabSt").addEventListener("click", () => { if(section === "st") return; Study.showHome(); });

// ---------- bottom sheet ----------
function openSheet(title, red, body){
  $("sheetTitle").textContent = title;
  $("sheetHead").classList.toggle("red", !!red);
  const sb = $("sheetBody"); sb.innerHTML = ""; sb.appendChild(body);
  $("sheet").hidden = false;
}
function closeSheet(){ $("sheet").hidden = true; }
$("sheetClose").addEventListener("click", closeSheet);
$("sheetBackdrop").addEventListener("click", closeSheet);

// Emergency quick list: two taps from anywhere to any drill
$("emergFab").addEventListener("click", () => {
  const list = document.createElement("div");
  list.className = "elist";
  EMERG.forEach(ph => {
    const b = document.createElement("button");
    b.className = "ebtn";
    b.innerHTML = `<span>${ph.title}</span><span>›</span>`;
    b.addEventListener("click", () => openPhase(ph, !!(currentPhase && currentPhase.emerg)));
    list.appendChild(b);
  });
  openSheet("Emergencies", true, list);
});

// Settings
$("setBtn").addEventListener("click", () => {
  const wrap = document.createElement("div");
  const seg = (title, opts, key, note) => {
    const g = document.createElement("div"); g.className = "setgroup";
    g.innerHTML = `<div class="setlabel">${title}</div>`;
    const s = document.createElement("div"); s.className = "seg";
    opts.forEach(([v, lbl]) => {
      const b = document.createElement("button");
      b.textContent = lbl; if(prefs[key] === v) b.classList.add("on");
      b.addEventListener("click", () => {
        prefs[key] = v; applyPrefs(); savePrefs();
        s.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      });
      s.appendChild(b);
    });
    g.appendChild(s);
    if(note){ const n = document.createElement("div"); n.className = "setnote"; n.textContent = note; g.appendChild(n); }
    wrap.appendChild(g);
  };
  seg("Display", [["day","☁ Day"],["sun","☀ Sun"],["night","☾ Night"]], "mode",
      "Sun = black on white for glare. Night = dim, for dusk and cockpit at night.");
  seg("Text size", [["s","S"],["m","M"],["l","L"],["xl","XL"]], "size");
  seg("Vibrate on tick", [[true,"On"],[false,"Off"]], "haptic");

  const g = document.createElement("div"); g.className = "setgroup";
  g.innerHTML = `<div class="setlabel">Progress</div>`;
  g.appendChild(armedButton("resetbtn", "Reset all checks", "Tap again to reset everything", () => {
    state = {}; last = null; staleCleared = false; save(); closeSheet(); goHome(); renderHome(); toast("All checks reset");
  }));
  const n = document.createElement("div"); n.className = "setnote";
  n.textContent = "Ticks are saved on this device and cleared automatically after 6 hours of no use, so an old session never carries into a new flight.";
  g.appendChild(n);
  wrap.appendChild(g);

  const ga = document.createElement("div"); ga.className = "setgroup";
  ga.innerHTML = `<div class="setlabel">Air Law answers</div>`;
  ga.appendChild(armedButton("resetbtn", "Reset Air Law answers", "Tap again to clear answers", () => {
    Study.reset(); closeSheet(); if(section === "st") Study.showHome(); toast("Air Law answers cleared");
  }));
  const gn = document.createElement("div"); gn.className = "setnote";
  gn.textContent = "Air Law answers are kept on this device until you clear them. They are separate from checklist ticks.";
  ga.appendChild(gn);
  wrap.appendChild(ga);

  openSheet("Settings", false, wrap);
});

// ---------- keep the screen on (where supported) ----------
let wakeLock = null;
async function keepAwake(){
  try{ if("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") keepAwake(); });
document.addEventListener("click", function once(){ keepAwake(); document.removeEventListener("click", once); });


// =====================================================================
// Air Law study section
// Runs beside the checklist and shares only the header, the settings sheet
// and the display mode. Its progress has its own storage key.
// =====================================================================
const Study = (() => {
  const SKEY = "ppl-air-law-v1";
  const PASS = 75, MOCK_N = 20;
  const view = $("studyView");
  let store = { ans:{} };
  let sess = null;

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const qid = (t,i) => t.id + "-" + (i+1);
  const ALLQ = [];
  TOPICS.forEach(t => t.qs.forEach((q,i) => ALLQ.push({ id:qid(t,i), topic:t, q })));
  const byQ = {}; ALLQ.forEach(x => byQ[x.id] = x);
  const topicById = id => TOPICS.find(t => t.id === id);
  const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  function load(){ try{ const s = JSON.parse(localStorage.getItem(SKEY) || "null"); if(s && s.ans) store = s; }catch(e){} }
  function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(store)); }catch(e){} }
  function rec(id, ok){ const p = store.ans[id] || { n:0, c:0 }; store.ans[id] = { n:p.n+1, c:p.c+(ok?1:0), ok, t:Date.now() }; save(); }
  function reset(){ store = { ans:{} }; save(); }

  function tStats(t){ let a=0, ok=0; t.qs.forEach((q,i) => { const r = store.ans[qid(t,i)]; if(r){ a++; if(r.ok) ok++; } }); return { a, ok, n:t.qs.length }; }
  function overall(){ let a=0, ok=0; ALLQ.forEach(x => { const r = store.ans[x.id]; if(r){ a++; if(r.ok) ok++; } }); return { a, ok, n:ALLQ.length }; }
  const missed = () => ALLQ.filter(x => store.ans[x.id] && !store.ans[x.id].ok).map(x => x.id);

  // ---------- screen chrome ----------
  function enter(kind){
    // kind: "top" | "sub" | "quiz"
    section = "st";
    home.hidden = true; phaseView.hidden = true; view.hidden = false;
    currentPhase = null;
    $("emergFab").hidden = true;
    hdr.classList.toggle("top", kind === "top");
    hdr.classList.toggle("insub", kind === "sub");
    hdr.classList.toggle("inphase", kind === "quiz");
    markTabs();
    window.scrollTo(0, 0);
  }
  function title(main, small){ hdrTitle.innerHTML = `${esc(main)}<small>${esc(small)}</small>`; }
  function btn(cls, html, fn, attrs){
    const b = document.createElement("button");
    b.className = cls; b.innerHTML = html;
    if(attrs) Object.entries(attrs).forEach(([k,v]) => b.setAttribute(k, v));
    b.addEventListener("click", fn);
    return b;
  }

  // ---------- home ----------
  function renderHome(){
    sess = null;
    enter("top");
    const o = overall();
    title("PPL Air Law", `CAA syllabus 010 · ${ALLQ.length} questions`);
    view.innerHTML = "";

    const cav = document.createElement("div");
    cav.className = "caveat";
    cav.textContent = "Study notes and original practice questions — not the CAA question bank";
    view.appendChild(cav);

    const st = document.createElement("div");
    st.className = "stat";
    const pct = o.a ? Math.round(100 * o.ok / o.a) : 0;
    st.innerHTML = o.a ? `<b>${o.a}</b> of ${o.n} questions tried · <b>${pct}%</b> right on last attempt · pass mark ${PASS}%`
                       : `${o.n} questions across ${TOPICS.length} topics · pass mark ${PASS}%`;
    view.appendChild(st);

    const row = document.createElement("div"); row.className = "row2";
    row.appendChild(btn("cont", `<span class="ct"><span class="k">Mock paper</span><div class="n">${MOCK_N} random questions</div><div class="x">Marked at the end against ${PASS}%</div></span><span class="arrow">›</span>`,
      () => start("mock", shuffle(ALLQ.map(x => x.id)).slice(0, MOCK_N), null, false)));
    const m = missed().length;
    row.appendChild(btn("bigbtn ghost", `Review misses · ${m}`, () => start("review", shuffle(missed()), null, false), m ? null : { disabled:"" }));
    view.appendChild(row);

    view.appendChild(label("Topics", false));
    const g = document.createElement("div"); g.className = "grid";
    TOPICS.forEach((t, idx) => {
      const s = tStats(t);
      const done = s.ok === s.n;
      const b = btn("pbtn" + (done ? " done" : ""),
        `<span class="pnum">${String(idx+1).padStart(2,"0")}</span>`+
        `<span><span class="pref">${esc(t.ref)}</span><span class="pname" style="display:block">${esc(t.title)}</span></span>`+
        `<span class="pbar"><i style="width:${Math.round(100*s.ok/s.n)}%"></i></span>`+
        `<span class="pcount">${done ? "✓ All right" : s.a ? s.ok + " / " + s.n + " right" : s.n + " questions"}</span>`,
        () => openTopic(t));
      g.appendChild(b);
    });
    view.appendChild(g);
  }

  // ---------- topic notes ----------
  function renderTopic(t){
    sess = null;
    enter("sub");
    const s = tStats(t);
    title(t.title, `Air Law · ${t.ref}`);
    view.innerHTML = "";
    const wrap = document.createElement("div"); wrap.className = "topic";
    const lede = document.createElement("p"); lede.className = "lede"; lede.textContent = t.blurb;
    wrap.appendChild(lede);
    const card = document.createElement("div"); card.className = "card";
    card.innerHTML = `<div class="learn">${t.learn()}</div>`;
    wrap.appendChild(card);
    wrap.appendChild(btn("bigbtn", `Practise this topic · ${t.qs.length} questions${s.a ? " (" + s.ok + " right so far)" : ""}`,
      () => start("topic", shuffle(t.qs.map((q,i) => qid(t,i))), t.id, false)));
    view.appendChild(wrap);
  }

  // ---------- questions ----------
  function start(kind, ids, topicId, replace){
    if(!ids.length) return;
    sess = { kind, ids, i:0, log:[], cur:null, picked:null, topic:topicId };
    nextQ();
    try{ history[replace ? "replaceState" : "pushState"]({ st:"q" }, ""); }catch(e){}
    renderQ();
  }
  function nextQ(){
    const id = sess.ids[sess.i], x = byQ[id];
    sess.cur = { id, opts:shuffle(x.q.o.map((t,i) => ({ t, ok:i === 0 }))) };
    sess.picked = null;
  }
  function sessLabel(){ return sess.kind === "mock" ? "Mock paper" : sess.kind === "review" ? "Review misses" : topicById(sess.topic).title; }
  function renderQ(){
    enter("quiz");
    const x = byQ[sess.cur.id], mock = sess.kind === "mock", picked = sess.picked;
    title(sessLabel(), `Question ${sess.i+1} of ${sess.ids.length}`);
    hprogBar.style.width = (sess.i / sess.ids.length * 100) + "%";
    view.innerHTML = "";
    const w = document.createElement("div"); w.className = "quiz";
    const q = document.createElement("p"); q.className = "qtext"; q.textContent = x.q.q;
    w.appendChild(q);
    const opts = document.createElement("div"); opts.className = "opts";
    const answered = !mock && picked !== null;
    sess.cur.opts.forEach((o,k) => {
      let cls = "opt";
      if(answered){ if(o.ok) cls += " ok"; else if(k === picked) cls += " no"; }
      opts.appendChild(btn(cls, `<span class="l">${"ABCD"[k]}</span><span class="ot">${esc(o.t)}</span>`, () => pick(k), answered ? { disabled:"" } : null));
    });
    w.appendChild(opts);
    if(answered){
      const ok = sess.cur.opts[picked].ok;
      const e = document.createElement("div");
      e.className = "expl " + (ok ? "good" : "bad"); e.setAttribute("role","status");
      e.innerHTML = `<span class="v">${ok ? "Correct" : "Not quite"}</span>${esc(x.q.e)}`;
      w.appendChild(e);
      const last = sess.i >= sess.ids.length - 1;
      const nb = btn("bigbtn", last ? "See results ›" : "Next question ›", advance);
      w.appendChild(nb);
      setTimeout(() => e.scrollIntoView({ behavior:"smooth", block:"nearest" }), 0);
    }
    view.appendChild(w);
  }
  function pick(k){
    if(sess.picked !== null && sess.kind !== "mock") return;
    const o = sess.cur.opts[k];
    sess.picked = k;
    sess.log.push({ id:sess.cur.id, k, ok:o.ok, opts:sess.cur.opts });
    rec(sess.cur.id, o.ok);
    buzz();
    if(sess.kind === "mock") advance(); else renderQ();
  }
  function advance(){
    sess.i++;
    if(sess.i >= sess.ids.length){
      try{ history.replaceState({ st:"res" }, ""); }catch(e){}
      renderResult();
    } else { nextQ(); renderQ(); }
  }

  // ---------- results ----------
  function renderResult(){
    enter("sub");
    const n = sess.log.length, right = sess.log.filter(l => l.ok).length;
    const pct = n ? Math.round(100 * right / n) : 0;
    title(sessLabel(), "Results");
    view.innerHTML = "";
    const w = document.createElement("div"); w.className = "quiz";
    const sc = document.createElement("div"); sc.className = "score";
    sc.innerHTML = `<span class="n">${right}/${n}</span><span class="p">${pct}%</span>` +
      (sess.kind === "mock" ? `<span class="pill ${pct >= PASS ? "good" : "bad"}">${pct >= PASS ? "Above" : "Below"} the ${PASS}% pass mark</span>` : "");
    w.appendChild(sc);
    const wrong = sess.log.filter(l => !l.ok);
    w.appendChild(label(wrong.length ? "Missed, with the reasoning" : "Every question right", !!wrong.length));
    wrong.forEach(l => {
      const x = byQ[l.id], d = document.createElement("div");
      d.className = "miss";
      d.innerHTML = `<div class="mq">${esc(x.q.q)}</div>`+
        `<div class="ma y"><b>You said</b>${esc(l.opts[l.k].t)}</div>`+
        `<div class="ma c"><b>Correct</b>${esc(l.opts.find(o => o.ok).t)}</div>`+
        `<div class="why">${esc(x.q.e)}</div>`;
      w.appendChild(d);
    });
    if(wrong.length) w.appendChild(btn("bigbtn", `Retry the ${wrong.length} missed`, () => start("review", shuffle(wrong.map(l => l.id)), null, true)));
    if(sess.kind === "mock") w.appendChild(btn("bigbtn" + (wrong.length ? " ghost" : ""), "Another mock paper", () => start("mock", shuffle(ALLQ.map(x => x.id)).slice(0, MOCK_N), null, true)));
    w.appendChild(btn("bigbtn ghost", sess.kind === "topic" ? "Back to the notes" : "Back to topics", back));
    view.appendChild(w);
  }

  // ---------- navigation ----------
  function openTopic(t){
    try{ history.pushState({ st:"tp", tp:t.id }, ""); }catch(e){}
    renderTopic(t);
  }
  function back(){
    if(history.state && history.state.st && history.state.st !== "home"){ try{ history.back(); return; }catch(e){} }
    renderHome();
  }
  // Called from popstate with a study history entry
  function fromState(s){
    if(s.st === "tp" && topicById(s.tp)) return renderTopic(topicById(s.tp));
    if(s.st === "q" && sess) return renderQ();
    if(s.st === "res" && sess) return renderResult();
    renderHome();
  }
  function showHome(){
    try{ history.replaceState({ st:"home" }, ""); }catch(e){}
    renderHome();
  }

  load();
  return { showHome, renderHome, fromState, back, reset, hasProgress:() => overall().a > 0 };
})();

// ---------- boot ----------
load();
applyPrefs();
try{ history.replaceState({}, ""); }catch(e){}
renderHome();
</script>
</body>
</html>
