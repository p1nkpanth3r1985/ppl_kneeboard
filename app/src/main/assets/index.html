T.push({ id:"drag", ref:"080 · 2", title:"Drag and wake turbulence",
blurb:"Parasite and induced drag, minimum drag speed, ground effect and wingtip vortices.",
learn:()=>`
<h3>Two kinds of drag</h3>
<div class="tbl"><table>
<tr><th>Type</th><th>Made up of</th><th>Changes with speed</th></tr>
<tr><td>Parasite</td><td>Form (pressure) drag, skin friction, interference drag where parts meet</td><td>Increases with the square of speed</td></tr>
<tr><td>Induced</td><td>A by-product of making lift: wingtip vortices and downwash tilt the lift backwards</td><td>Decreases as speed increases (greatest at low speed and high angle of attack)</td></tr>
</table></div>
${dragCurve}
<h3>Reducing induced drag</h3>
<ul>
<li><b>High aspect ratio</b> (long, slender wings) weakens the tip vortices.</li>
<li><b>Ground effect</b>: within about one wingspan of the ground, the ground limits the downwash and tip vortices, so induced drag falls. The aircraft floats on landing, and can lift off before it is able to climb out of ground effect.</li>
</ul>
<h3>Wake turbulence</h3>
<p>Wingtip vortices trail behind every aircraft. They are strongest from aircraft that are <b>heavy, clean and slow</b> (high angle of attack). They sink below the generating aircraft's path and drift with the wind. Keep above a larger aircraft's flight path and allow time for vortices to drift or decay.</p>
<div class="box trap"><b>Common trap</b>Flying slower does not always mean less drag. Below Vmd, total drag rises again as induced drag takes over.</div>`,
qs:[
{q:"How does induced drag change as airspeed increases in level flight?",o:["It decreases","It increases with the square of speed","It stays constant","It increases in direct proportion to speed"],e:"Induced drag is greatest at low speed and high angle of attack. As speed rises the angle of attack needed falls, and induced drag decreases."},
{q:"How does parasite drag change if airspeed doubles?",o:["It increases about four times","It doubles","It halves","It stays the same"],e:"Parasite drag is proportional to the square of speed, so doubling speed roughly quadruples it."},
{q:"At the minimum drag speed (Vmd):",o:["Induced drag equals parasite drag","Induced drag is zero","Parasite drag is zero","Lift is at its maximum"],e:"Total drag is lowest where the falling induced drag curve and the rising parasite drag curve cross, so they are equal at Vmd."},
{q:"An aircraft floats along the runway further than expected just before touchdown. The main reason is:",o:["Ground effect reducing induced drag","Increased parasite drag near the ground","Higher air density at ground level","The flaps losing effectiveness"],e:"Within about a wingspan of the ground, downwash and tip vortices are reduced, so induced drag falls and the aircraft floats."},
{q:"Which wing reduces induced drag the most, other things being equal?",o:["A long, narrow wing (high aspect ratio)","A short, wide wing (low aspect ratio)","A wing with more camber","A wing with a thicker leading edge"],e:"High aspect ratio wings have weaker tip vortices relative to their lift, so less induced drag."},
{q:"Wake turbulence is greatest behind an aircraft that is:",o:["Heavy, clean and slow","Light, with flap down and fast","Light, clean and fast","Heavy and fast with flap down"],e:"Vortex strength depends on the lift being produced and the angle of attack: heavy, clean (no flap) and slow gives the strongest vortices."},
{q:"After they leave the wing tips, wake vortices tend to:",o:["Sink below the generating aircraft's flight path and drift with the wind","Rise above the flight path","Stay at the same height and remain stationary","Dissipate immediately in calm air"],e:"Vortices descend below the flight path and move with the wind. In calm conditions they can persist over the runway, which is when they are most dangerous."}
]});

T.push({ id:"stall", ref:"080 · 3", title:"Stalling, load factor and spins",
blurb:"Why a wing stalls, what changes the stall speed, and what a turn does to it.",
learn:()=>`
${liftCurve}
<h3>What changes the stall speed</h3>
<p>The wing always stalls at the same <b>angle of attack</b>. The <b>speed</b> at which you reach it changes:</p>
<ul>
<li><b>Weight</b>: heavier means higher stall speed (in proportion to the square root of weight).</li>
<li><b>Load factor</b>: a turn or a pull-up raises the stall speed.</li>
<li><b>Flap</b>: lowers the stall speed by increasing the maximum lift coefficient.</li>
<li><b>Power</b>: with power on, slipstream and the thrust line lower the indicated stall speed a little.</li>
<li>Ice, frost or damage on the wing raise the stall speed and can remove the warning.</li>
</ul>
<h3>Turns and load factor</h3>
<p>In a level turn the wing has to carry more than the aircraft's weight. Load factor <span class="mono">n = 1 ÷ cos(bank)</span>, and stall speed rises by <span class="mono">√n</span>.</p>
${loadFactor}
<p>Example: stalls at 50 kt straight and level, so in a 60° level turn it stalls at about 50 × 1.41 = <b>71 kt</b>.</p>
<h3>Stall warnings and wing design</h3>
<p>Signs of the approaching stall: the stall warner, buffet, controls becoming sloppy, high nose attitude and decreasing airspeed. Wings are designed to stall at the <b>root first</b>, so the ailerons near the tips keep working: <b>washout</b> (less incidence at the tip) and stall strips do this.</p>
<h3>Spins</h3>
<p>A spin needs two things: the wing <b>stalled</b> and <b>yaw</b>. One wing is more deeply stalled than the other and the aircraft autorotates. Recovery follows the POH for your type; in general it begins with power off, ailerons neutral and full opposite rudder, then moving the control column forward until the rotation stops.</p>
<div class="box trap"><b>Common trap</b>A stall is about angle of attack, not speed. A wing can stall at high speed in a steep turn or a sharp pull-up.</div>`,
qs:[
{q:"A wing stalls when:",o:["It exceeds the critical angle of attack","Airspeed falls below a fixed value","The nose is raised above the horizon","Engine power is reduced"],e:"The stall happens at the critical angle of attack, whatever the speed or attitude."},
{q:"What is the load factor in a level turn at 60° of bank?",o:["2 g","1.41 g","1.15 g","3 g"],e:"Load factor = 1 ÷ cos 60° = 1 ÷ 0.5 = 2."},
{q:"An aircraft stalls at 48 kt in straight and level flight. Roughly what is its stall speed in a level 60° banked turn?",o:["68 kt","52 kt","96 kt","60 kt"],e:"Stall speed rises by √n. At 60° bank n = 2 and √2 ≈ 1.41, so 48 × 1.41 ≈ 68 kt."},
{q:"What effect does increased weight have on stall speed?",o:["It increases it","It decreases it","It has no effect","It only affects the stall speed with flap down"],e:"More weight needs more lift. At the critical angle of attack that needs more speed, so stall speed rises."},
{q:"What is the main purpose of washout on a wing?",o:["To make the wing root stall before the tip, so the ailerons stay effective","To reduce parasite drag at cruise speed","To increase the stall speed","To reduce the effect of the propeller slipstream"],e:"Washout reduces the angle of incidence towards the tip, so the root reaches the critical angle first and the tips (with the ailerons) keep flying."},
{q:"Which two conditions must exist for a spin to develop?",o:["The wing must be stalled, and there must be yaw","High airspeed and full power","Flap down and a nose-down attitude","A steep turn and full aileron"],e:"A spin is an autorotation that needs the wing stalled and the aircraft yawing. Remove either and it cannot develop."},
{q:"How does lowering flap affect the stall speed?",o:["It reduces it","It increases it","It has no effect","It only changes the stall speed in a turn"],e:"Flap increases the maximum lift coefficient, so the wing produces the required lift at a lower speed and the stall speed falls."}
]});

T.push({ id:"stability", ref:"080 · 4", title:"Axes, controls and stability",
blurb:"The three axes, which control works about which, and what makes an aircraft stable.",
learn:()=>`
<h3>Axes and controls</h3>
<div class="tbl"><table>
<tr><th>Axis</th><th>Movement</th><th>Control</th><th>Stability</th></tr>
<tr><td>Longitudinal (nose to tail)</td><td>Roll</td><td>Ailerons</td><td>Lateral stability: dihedral, high wing</td></tr>
<tr><td>Lateral (wing tip to wing tip)</td><td>Pitch</td><td>Elevator</td><td>Longitudinal stability: tailplane, CG position</td></tr>
<tr><td>Normal (vertical)</td><td>Yaw</td><td>Rudder</td><td>Directional stability: fin and keel area</td></tr>
</table></div>
<p>All three axes pass through the centre of gravity.</p>
<h3>Stability</h3>
<p>A <b>stable</b> aircraft tends to return to its original condition after a disturbance, without the pilot doing anything.</p>
<ul>
<li><b>Longitudinal</b> stability comes from the tailplane acting like the feathers on a dart. The further forward the CG, the more stable the aircraft, and the heavier the elevator feels.</li>
<li>With the CG <b>aft</b>, the aircraft is less stable and the elevator feels light. Beyond the aft limit it can become unstable in pitch and hard to recover from a stall or spin.</li>
<li><b>Lateral</b> stability comes mainly from dihedral and a high wing: in a sideslip the lower wing meets the air at a greater angle and rolls the aircraft back towards level.</li>
<li><b>Directional</b> stability comes from the fin: a yaw puts the fin at an angle to the airflow and it pushes the tail back into line.</li>
</ul>
<div class="box trap"><b>Common trap</b>The lateral axis is the one through the wing tips, but it is the axis of <b>pitch</b>. Longitudinal stability (stability in pitch) is about the lateral axis.</div>`,
qs:[
{q:"The elevator controls movement about which axis?",o:["The lateral axis","The longitudinal axis","The normal axis","The vertical axis through the fin"],e:"The elevator pitches the aircraft about the lateral axis, which runs from wing tip to wing tip."},
{q:"The ailerons control movement about which axis?",o:["The longitudinal axis","The lateral axis","The normal axis","The propeller axis"],e:"Ailerons roll the aircraft about the longitudinal axis, which runs from nose to tail."},
{q:"Which feature mainly gives an aircraft directional stability?",o:["The fin","Dihedral","The tailplane","Washout"],e:"The fin (and side area behind the CG) returns the aircraft to straight after a yaw. Dihedral gives lateral stability; the tailplane gives longitudinal stability."},
{q:"What does dihedral provide?",o:["Lateral stability","Directional stability","Longitudinal stability","Reduced induced drag"],e:"In a sideslip the lower wing of a dihedral wing meets the air at a greater angle of attack, making more lift and rolling the aircraft back towards level."},
{q:"With the centre of gravity near the aft limit, an aircraft will be:",o:["Less stable in pitch, with lighter elevator forces","More stable in pitch, with heavier elevator forces","Unaffected in pitch","More stable laterally"],e:"An aft CG shortens the tailplane's moment arm, reducing longitudinal stability and making the elevator feel light."},
{q:"A forward centre of gravity tends to make an aircraft:",o:["More stable in pitch, with heavier elevator forces","Less stable in pitch","Easier to rotate at a lower speed","More prone to spinning"],e:"A forward CG increases longitudinal stability; the pilot needs more elevator force to change pitch."},
{q:"An aircraft is said to be stable if, after a disturbance, it:",o:["Tends to return to its original condition without pilot input","Stays exactly where the disturbance left it","Moves further away from its original condition","Needs constant pilot input to stay level"],e:"Positive stability is a tendency to return. Staying put is neutral stability; diverging is instability."}
]});

T.push({ id:"controls", ref:"080 · 5", title:"Control effects, trim and flaps",
blurb:"Adverse yaw and how designers reduce it, further effects, trim tabs, balancing and flaps.",
learn:()=>`
<h3>Adverse aileron yaw</h3>
<p>When you roll, the down-going aileron raises the lift on that wing, and with it the induced drag. The aircraft yaws <b>away</b> from the direction of the turn. Designers reduce this with:</p>
<ul>
<li><b>Differential ailerons</b>: the up-going aileron moves through a larger angle than the down-going one.</li>
<li><b>Frise ailerons</b>: the nose of the up-going aileron projects below the wing and adds drag on that side.</li>
<li>The pilot uses <b>rudder</b> in the direction of the turn to keep the balance ball centred.</li>
</ul>
<h3>Further effects</h3>
<ul>
<li><b>Further effect of rudder: roll.</b> Yaw speeds up the outer wing, which makes more lift, so the aircraft rolls the same way.</li>
<li><b>Further effect of aileron: yaw.</b> Bank leads to a sideslip, and the fin yaws the nose into the turn.</li>
</ul>
<h3>Trim and balance</h3>
<ul>
<li>A <b>trim tab</b> moves the opposite way to the control surface. To hold the elevator up (nose-up trim), the tab moves down.</li>
<li><b>Aerodynamic balance</b> (horn balance, inset hinge) reduces the force needed to move a control.</li>
<li><b>Mass balance</b> (weight ahead of the hinge line) prevents control surface <b>flutter</b>.</li>
</ul>
<h3>Flaps</h3>
<p>Flaps increase camber, which increases both lift and drag. They lower the stall speed, so the aircraft can approach slower, and allow a steeper approach at the same speed. Small settings add more lift than drag (sometimes used for take-off); large settings add mostly drag (for landing).</p>
<div class="box trap"><b>Common trap</b>Adverse yaw is caused by the <b>down-going</b> aileron, the one on the rising wing, not the up-going one.</div>`,
qs:[
{q:"What causes adverse aileron yaw?",o:["Extra induced drag from the down-going aileron","Extra parasite drag from the up-going aileron","The propeller slipstream","The fin stalling in the turn"],e:"The down-going aileron increases lift on the rising wing, and with it induced drag, which yaws the nose away from the turn."},
{q:"How do differential ailerons reduce adverse yaw?",o:["The up-going aileron moves through a larger angle than the down-going one","Both ailerons move down together","The down-going aileron moves further than the up-going one","They link the ailerons to the rudder"],e:"Moving the up-going aileron further increases drag on the descending wing, balancing the extra induced drag on the rising wing."},
{q:"What is the further effect of the rudder?",o:["Roll","Pitch","Yaw","A change in airspeed only"],e:"Yaw speeds up the outer wing, which makes more lift, so the aircraft rolls in the direction of the yaw."},
{q:"To trim the aircraft nose up, which way does the elevator trim tab move?",o:["Down","Up","It does not move; the elevator moves instead","To the side"],e:"The tab moves the opposite way to the surface it trims. A downward tab pushes the elevator trailing edge up, holding the nose up."},
{q:"What is the purpose of mass balancing a control surface?",o:["To prevent flutter","To reduce the stick force needed","To trim the aircraft","To increase control authority at low speed"],e:"Mass balance moves the surface's centre of gravity towards or ahead of the hinge line, preventing flutter. Aerodynamic balance reduces stick forces."},
{q:"What is the main effect of lowering a large flap setting on the approach?",o:["Lower stall speed and more drag, allowing a slower, steeper approach","Higher stall speed and less drag","Less lift and less drag","No change to the stall speed"],e:"Flap increases the maximum lift coefficient, lowering the stall speed, and large settings add a lot of drag, allowing a steeper approach without gaining speed."},
{q:"What is the further effect of the ailerons?",o:["Yaw","Pitch","Roll","Increase in airspeed"],e:"The bank causes a sideslip into the turn, and the fin then yaws the nose in the direction of the bank."}
]});

T.push({ id:"turn", ref:"080 · 6", title:"Turning, climbing and gliding",
blurb:"What turns an aircraft, the forces in a climb and glide, and what changes glide range.",
learn:()=>`
<h3>Turning</h3>
<p>To turn, the aircraft is banked so that the lift tilts. The <b>horizontal component of lift</b> provides the force towards the centre of the turn. To stop it descending, total lift must increase so that its vertical component still equals the weight. That is why you add back pressure, and often power, in a level turn.</p>
<ul>
<li>At the same airspeed, more bank gives a <b>higher rate</b> and a <b>smaller radius</b> of turn, and a higher load factor.</li>
<li>At the same bank, a higher speed gives a larger radius and a lower rate of turn.</li>
</ul>
<h3>Climbing</h3>
<p>In a steady climb part of the weight acts backwards along the flight path, so thrust must exceed drag. Lift is slightly <b>less</b> than weight, because lift only has to balance the part of the weight at right angles to the flight path.</p>
<ul>
<li><b>Vx</b>, best angle of climb: most height for distance travelled (obstacle clearance).</li>
<li><b>Vy</b>, best rate of climb: most height for time.</li>
</ul>
<h3>Gliding</h3>
<p>With no thrust, a component of weight along the flight path pulls the aircraft forward. The best glide distance comes from flying at the speed for the best <b>lift/drag ratio</b>.</p>
<ul>
<li>In still air, <b>weight does not change the best glide range</b>, only the speed you need to fly to get it (heavier means faster).</li>
<li>A <b>headwind</b> reduces the distance over the ground; a tailwind increases it.</li>
<li>Flap, an open door or a windmilling propeller adds drag and steepens the glide.</li>
</ul>
<div class="box trap"><b>Common trap</b>Flying slower than the best glide speed does not stretch the glide. It increases the rate of descent per mile and brings you closer to the stall.</div>`,
qs:[
{q:"What provides the force that turns an aircraft in a banked turn?",o:["The horizontal component of lift","The rudder","The vertical component of lift","The thrust of the propeller"],e:"Banking tilts the lift; its horizontal component provides the centripetal force. The rudder is used only to balance the turn."},
{q:"At a constant airspeed, increasing the angle of bank in a level turn will:",o:["Increase the rate of turn and decrease the radius","Decrease the rate of turn","Increase the radius of turn","Have no effect on the load factor"],e:"More bank gives a bigger horizontal lift component, so a tighter, quicker turn, and a higher load factor."},
{q:"In a steady climb, how does lift compare with weight?",o:["Lift is slightly less than weight","Lift is greater than weight","Lift is equal to weight","Lift is zero"],e:"In a steady climb, lift only has to balance the part of the weight at right angles to the flight path, so it is slightly less than the weight. Thrust makes up the difference."},
{q:"Which speed gives the most height gain in the shortest horizontal distance?",o:["Vx, best angle of climb","Vy, best rate of climb","Vmd","Cruise speed"],e:"Vx gives the steepest climb gradient and is used to clear obstacles. Vy gives the most height per minute."},
{q:"How does an increase in weight affect the maximum glide range in still air?",o:["It has no effect on range, but the best glide speed is higher","It increases the range","It decreases the range","It has no effect on range or speed"],e:"The best lift/drag ratio, and so the glide angle, does not depend on weight. A heavier aircraft must fly faster to achieve it, and covers the same distance in less time."},
{q:"To achieve maximum glide range, you should fly at the speed for:",o:["The best lift/drag ratio","The minimum sink rate","The stall speed plus 5 kt","The normal cruise speed"],e:"Best range comes from the best lift/drag ratio, the speed recommended in the POH as best glide."},
{q:"Gliding into a headwind compared with still air, the distance covered over the ground will be:",o:["Shorter","Longer","The same","Longer only with flap down"],e:"The headwind reduces groundspeed while the rate of descent stays the same, so less ground is covered before reaching the surface."}
]});

  e:"The longitudinal axis runs nose to tail, the lateral axis wing tip to wing tip, and the normal axis vertically through the CG."},
{q:"An aircraft has neutral stability. After a disturbance it will:",o:["Stay in its new condition, neither returning nor diverging","Return to its original condition","Diverge further from its original condition","Oscillate with increasing amplitude"],e:"Neutral stability means no tendency either way: it stays where the disturbance left it."},
{q:"What is the danger of loading an aircraft with the CG behind the aft limit?",o:["It may be unstable in pitch and difficult or impossible to recover from a stall or spin","The stall speed becomes much higher","The elevator becomes too heavy to move","The aircraft becomes too stable to rotate"],e:"Behind the aft limit the tailplane may not have enough moment to restore pitch, and stall or spin recovery may not be possible."},

// 090 Communications
(() => {
const ALPHA = ["Alfa","Bravo","Charlie","Delta","Echo","Foxtrot","Golf","Hotel","India","Juliett","Kilo","Lima","Mike","November","Oscar","Papa","Quebec","Romeo","Sierra","Tango","Uniform","Victor","Whiskey","X-ray","Yankee","Zulu"];
const alpha = `<div class="tiles">${ALPHA.map(w=>`<div class="tile"><div class="n">${w[0]}</div><div class="t">${w}</div></div>`).join('')}</div>`;

const T = [];
T.push({ id:"phonetics", ref:"090 · 1", title:"Phonetics, numbers and callsigns",
blurb:"The phonetic alphabet, how numbers are spoken, and when you can shorten a callsign.",
learn:()=>`
<h3>The phonetic alphabet</h3>
${alpha}
<h3>Numbers</h3>
<p>Each digit is spoken separately, except whole hundreds and thousands. Three is <b>"tree"</b>, five is <b>"fife"</b>, nine is <b>"niner"</b>.</p>
<div class="tbl"><table>
<tr><th>Item</th><th>Written</th><th>Spoken</th></tr>
<tr><td>Altitude</td><td>2,500 ft</td><td>"Two thousand five hundred feet"</td></tr>
<tr><td>Flight level</td><td>FL55</td><td>"Flight level five five"</td></tr>
<tr><td>Heading</td><td>080°</td><td>"Heading zero eight zero"</td></tr>
<tr><td>Frequency</td><td>126.700</td><td>"One two six decimal seven"</td></tr>
<tr><td>QNH</td><td>1008 hPa</td><td>"QNH one zero zero eight"</td></tr>
<tr><td>QNH below 1000</td><td>998 hPa</td><td>"QNH niner niner eight hectopascals"</td></tr>
<tr><td>Squawk</td><td>4521</td><td>"Squawk four five two one"</td></tr>
<tr><td>Wind</td><td>240/12</td><td>"Two four zero degrees, one two knots"</td></tr>
</table></div>
<p>Times are in UTC. Usually only the minutes are given ("two eight"); the hour is added if there is any chance of confusion.</p>
<h3>Callsigns</h3>
<p>A UK registration such as G-ABCD is spoken in full ("Golf Alfa Bravo Charlie Delta") on first contact. It may be shortened to the first letter and the last two ("Golf Charlie Delta") only <b>after the ground station has shortened it first</b>.</p>
<div class="box trap"><b>Common trap</b>Below 1000 hPa the word "hectopascals" is added, so that 998 can't be mistaken for 29.98 inches or 1998.</div>`,
qs:[
{q:"How is the digit 9 spoken in aviation radiotelephony?",o:["Niner","Nine","Nein","Nyne"],e:"Niner, so that it can't be confused with the German 'nein'. Three is 'tree' and five is 'fife'."},
{q:"How is flight level 55 transmitted?",o:["Flight level five five","Flight level fifty-five","Five thousand five hundred feet","Flight level five hundred and fifty"],e:"Flight levels are spoken as separate digits: 'flight level five five'."},
{q:"How is an altitude of 2,500 ft transmitted?",o:["Two thousand five hundred feet","Two five zero zero feet","Twenty-five hundred feet","Flight level two five"],e:"Whole thousands and hundreds are spoken as such: 'two thousand five hundred feet'."},
{q:"How is a QNH of 998 hPa transmitted?",o:["QNH niner niner eight hectopascals","QNH niner niner eight","QNH nine hundred and ninety-eight","QNH zero niner niner eight"],e:"Below 1000 hPa the unit is added, to avoid confusion with other figures."},
{q:"Your callsign is G-BNXE. When may you abbreviate it to \"Golf X-ray Echo\"?",o:["Only after the ground station has abbreviated it","Whenever the frequency is busy","After your first transmission","Never"],e:"Abbreviation is only allowed once the ground station has used the abbreviated form, which shows there is no risk of confusion."},
{q:"What is the phonetic word for the letter Q?",o:["Quebec","Queen","Quintet","Quaker"],e:"Q is Quebec. The alphabet is the ICAO standard alphabet."},
{q:"How is a frequency of 126.700 MHz normally transmitted?",o:["One two six decimal seven","One two six point seven zero zero","One hundred and twenty-six decimal seven","One two six seven"],e:"Digits are spoken separately with 'decimal'. When the last two digits are zero, only the first four digits are normally spoken."}
]});

T.push({ id:"words", ref:"090 · 2", title:"Standard words and phrases",
blurb:"What ROGER, WILCO, AFFIRM and the rest mean, and the readability scale.",
learn:()=>`
<div class="tbl"><table>
<tr><th>Word</th><th>Meaning</th></tr>
<tr><td>AFFIRM</td><td>Yes</td></tr>
<tr><td>NEGATIVE</td><td>No, or permission not granted, or that is not correct</td></tr>
<tr><td>ROGER</td><td>I have received all of your last transmission. Not a yes, and not a readback.</td></tr>
<tr><td>WILCO</td><td>I understand your message and will comply with it</td></tr>
<tr><td>STANDBY</td><td>Wait and I will call you</td></tr>
<tr><td>SAY AGAIN</td><td>Repeat all, or the following part, of your last transmission</td></tr>
<tr><td>CORRECTION</td><td>An error has been made; the correct version is…</td></tr>
<tr><td>READ BACK</td><td>Repeat all, or the specified part, of this message back to me as received</td></tr>
<tr><td>CONTACT</td><td>Establish radio contact with…</td></tr>
<tr><td>MONITOR</td><td>Listen out on (frequency); don't call unless needed</td></tr>
<tr><td>APPROVED</td><td>Permission for the proposed action is granted</td></tr>
</table></div>
<h3>Readability scale</h3>
<div class="tbl"><table>
<tr><th>Number</th><th>Meaning</th></tr>
<tr><td>1</td><td>Unreadable</td></tr>
<tr><td>2</td><td>Readable now and then</td></tr>
<tr><td>3</td><td>Readable but with difficulty</td></tr>
<tr><td>4</td><td>Readable</td></tr>
<tr><td>5</td><td>Perfectly readable</td></tr>
</table></div>
<div class="box trap"><b>Common trap</b>Don't answer a question with ROGER. If ATC asks "Can you accept…?", the answer is AFFIRM or NEGATIVE.</div>`,
qs:[
{q:"What does WILCO mean?",o:["I understand your message and will comply with it","I have received all of your last transmission","Yes","Wait and I will call you"],e:"WILCO is used for instructions that don't need a full readback, such as 'report final'."},
{q:"What does ROGER mean?",o:["I have received all of your last transmission","Yes, I agree","I will comply","Repeat your last message"],e:"ROGER only acknowledges receipt. It must not be used to answer a question or in place of a required readback."},
{q:"ATC asks: \"Golf-CD, can you accept a left-hand circuit?\" Which reply is correct if you can?",o:["Affirm, Golf-CD","Roger, Golf-CD","Wilco, Golf-CD","Yes yes, Golf-CD"],e:"A question needs AFFIRM or NEGATIVE. ROGER only means you received the message."},
{q:"What does STANDBY mean?",o:["Wait and I will call you","Stop transmitting","Change frequency","Repeat your message"],e:"STANDBY tells the other station you heard them and will come back. It is not approval of anything."},
{q:"ATC tells you to \"monitor Tower on 118.5\". What should you do?",o:["Change to 118.5 and listen, without calling unless necessary","Change to 118.5 and call Tower immediately","Stay on the current frequency","Squawk standby"],e:"MONITOR means listen out. CONTACT means change frequency and call."},
{q:"On the readability scale, what does readability 3 mean?",o:["Readable but with difficulty","Unreadable","Perfectly readable","Readable now and then"],e:"1 unreadable, 2 readable now and then, 3 with difficulty, 4 readable, 5 perfectly readable."},
{q:"What does NEGATIVE mean?",o:["No, or permission not granted, or that is not correct","I have received your message","I will comply","Wait"],e:"NEGATIVE covers no, permission not granted and not correct."}
]});

T.push({ id:"readback", ref:"090 · 3", title:"Readbacks and clearances",
blurb:"Which items you must read back, conditional clearances, and the words reserved for take-off.",
learn:()=>`
<h3>Items to read back in full</h3>
<ul>
<li>Taxi instructions, and level, heading and speed instructions</li>
<li>Route and approach clearances, and the runway in use</li>
<li>Clearances to take off, land, enter, backtrack, cross or hold short of an active runway</li>
<li>Squawk codes and "squawk ident"</li>
<li>Altimeter settings (with "hectopascals" below 1000)</li>
<li>Frequency changes and the type of ATS service</li>
<li>VDF information and transition levels</li>
</ul>
<p>Read back in the same order as given, and end with your callsign. Items not on the list, such as traffic information and the surface wind, are acknowledged rather than read back.</p>
<h3>Example</h3>
<p><b>ATC:</b> "Golf-CD, climb altitude three thousand feet, squawk four five two one."<br><b>You:</b> "Climb altitude three thousand feet, squawk four five two one, Golf-CD."</p>
<h3>Conditional clearances</h3>
<p>"Golf-CD, behind the landing Cessna, line up and wait behind." The readback must include the condition: "Behind the landing Cessna, line up and wait behind, Golf-CD." Before acting, identify the aircraft referred to.</p>
<h3>Take-off</h3>
<p>The words <b>"take off"</b> are used only in an actual take-off clearance (or when cancelling one). At all other times ATC and pilots say "departure" or "airborne", so that "take off" can never be heard by mistake.</p>`,
qs:[
{q:"Which of these must be read back in full?",o:["A frequency change","Traffic information","The surface wind","A weather report"],e:"Frequency changes are on the mandatory readback list. Traffic information and the wind are acknowledged."},
{q:"ATC instructs: \"Golf-CD, squawk 4521.\" What is the correct reply?",o:["Squawk 4521, Golf-CD","Roger, Golf-CD","Wilco, Golf-CD","4521"],e:"Squawk codes must be read back, followed by your callsign."},
{q:"What must be included when reading back a conditional clearance?",o:["The condition itself","Only the action","Only your callsign","The time"],e:"The condition is part of the clearance, so the readback must include it, for example 'behind the landing Cessna'."},
{q:"When may the words \"take off\" be used on the radio?",o:["Only in a take-off clearance or when cancelling one","At any time when departing","Only by the pilot","When reporting airborne"],e:"Reserving 'take off' for the clearance itself prevents a pilot mistaking another instruction for permission to go."},
{q:"In what order should you read back a clearance with several items?",o:["In the same order as given","In order of importance","Any order, as long as all items are included","Alphabetical order"],e:"Reading back in the order given makes it easier for the controller to check."},
{q:"Which item is NOT on the list of mandatory readbacks?",o:["Traffic information","A QNH","A clearance to cross a runway","A heading instruction"],e:"Traffic information is acknowledged. Altimeter settings, runway clearances and headings must be read back."},
{q:"ATC: \"Golf-CD, cleared to land runway 25.\" What is the correct reply?",o:["Cleared to land runway 25, Golf-CD","Roger, Golf-CD","Landing, Golf-CD","Wilco, Golf-CD"],e:"Landing clearances are on the readback list, with the runway and callsign."}
]});

T.push({ id:"services", ref:"090 · 4", title:"Air traffic services and stations",
blurb:"Who you are talking to, and the UK Flight Information Services outside controlled airspace.",
learn:()=>`
<h3>Station callsign suffixes</h3>
<div class="tbl"><table>
<tr><th>Suffix</th><th>Service</th></tr>
<tr><td>TOWER</td><td>Aerodrome control</td></tr>
<tr><td>GROUND</td><td>Ground movement control</td></tr>
<tr><td>APPROACH / RADAR</td><td>Approach control, with or without surveillance</td></tr>
<tr><td>INFORMATION</td><td>Flight information service (including aerodrome FIS)</td></tr>
<tr><td>RADIO</td><td>Air/ground communication service</td></tr>
</table></div>
<p>An <b>air/ground</b> operator ("Radio") can pass information but cannot give clearances or instructions. An <b>aerodrome FISO</b> ("Information") gives information to help you fly safely, but does not clear you to land or take off.</p>
<h3>UK Flight Information Services</h3>
<p>Outside controlled airspace, the UK provides four services. In all of them the <b>pilot remains responsible for collision avoidance</b>.</p>
<div class="tbl"><table>
<tr><th>Service</th><th>What you get</th></tr>
<tr><td>Basic Service</td><td>Information useful for the safe conduct of the flight. No monitoring of your flight; traffic information only if the controller happens to be aware.</td></tr>
<tr><td>Traffic Service</td><td>Surveillance-derived traffic information on relevant traffic. You decide how to avoid it.</td></tr>
<tr><td>Deconfliction Service</td><td>Traffic information plus advice on avoiding action. Intended for IFR flight.</td></tr>
<tr><td>Procedural Service</td><td>Non-surveillance service separating participating aircraft, mainly IFR.</td></tr>
</table></div>
<p>The type of service is agreed with the controller and must be read back.</p>
<h3>Frequency monitoring codes</h3>
<p>Some units publish a squawk to show that you are listening on their frequency without receiving a service. ATC can then contact you quickly if needed. 7000 is the general UK conspicuity code for VFR.</p>`,
qs:[
{q:"A ground station's callsign has the suffix \"RADIO\". What service does it provide?",o:["Air/ground communication service","Aerodrome control","Flight information service","Approach control with radar"],e:"RADIO is an air/ground station, which passes information but can't issue clearances or instructions."},
{q:"Under a Basic Service, who is responsible for collision avoidance?",o:["The pilot","The controller","The controller and the pilot equally","Nobody outside controlled airspace"],e:"In every UK FIS the pilot is responsible for avoiding other traffic. A Basic Service does not monitor your flight."},
{q:"What does a Traffic Service provide?",o:["Surveillance-derived traffic information, with the pilot responsible for avoiding it","Separation from all other traffic","Avoiding action instructions you must follow","Only weather information"],e:"Traffic Service gives information on relevant traffic from radar. You decide what to do about it."},
{q:"Which station suffix indicates an aerodrome flight information service?",o:["INFORMATION","TOWER","RADIO","GROUND"],e:"FIS units, including aerodrome FIS, use INFORMATION. TOWER is aerodrome control."},
{q:"An air/ground operator tells you the runway in use and the QNH. Can they clear you to land?",o:["No, they can only give information","Yes, if no other traffic is reported","Yes, outside controlled airspace","Only with the airfield manager's permission"],e:"Air/ground operators provide information only. The decision to land is yours."},
{q:"What is a frequency monitoring code?",o:["A squawk showing you are listening on a unit's frequency without receiving a service","The code for radio failure","A code to request a service","A code for flights in controlled airspace only"],e:"Frequency monitoring codes help ATC identify and contact you if needed, for example to prevent an airspace infringement."},
{q:"Which statement about the type of ATS service is correct?",o:["It must be agreed with the controller and read back","It is assigned automatically by squawk","It never needs to be stated","It only applies above 3,000 ft"],e:"The type of service is on the mandatory readback list, so both sides agree what is being provided."}
]});

T.push({ id:"emergency", ref:"090 · 5", title:"Emergencies and radio failure",
blurb:"MAYDAY and PAN calls, 121.5 MHz, practice PANs, and what to do when the radio stops.",
learn:()=>`
<h3>Distress and urgency</h3>
<p><b>MAYDAY MAYDAY MAYDAY</b> for grave and imminent danger needing immediate help. <b>PAN PAN, PAN PAN, PAN PAN</b> for an urgent situation that doesn't need immediate help. Then, as far as possible:</p>
<ol>
<li>Name of the station addressed</li>
<li>Callsign</li>
<li>Aircraft type</li>
<li>Nature of the emergency</li>
<li>Pilot's intentions</li>
<li>Position, height and heading</li>
<li>Pilot qualification (UK)</li>
<li>Other useful information, such as persons on board and endurance</li>
</ol>
<ul>
<li>Use the frequency you're already on. If you have no contact, use <b>121.5 MHz</b>. Squawk <b>7700</b>.</li>
<li>The station receiving a MAYDAY controls distress traffic. It may impose silence with "Stop transmitting, MAYDAY".</li>
<li>When the emergency is over, cancel it, for example "Cancel distress".</li>
</ul>
<h3>Practice PANs</h3>
<p>In the UK you may practise a PAN on <b>121.5 MHz only</b>, to the Distress and Diversion cell, starting with "<b>Practice PAN</b>". Listen first and don't practise if the frequency is busy.</p>
<h3>Radio failure</h3>
<ul>
<li>Check the basics: volume, squelch, frequency, headset plugs, the avionics master and circuit breakers.</li>
<li>Squawk <b>7600</b>.</li>
<li>If you think you can transmit but not receive, transmit your position and intentions <b>blind</b>, prefixed "Transmitting blind", twice each time.</li>
<li>If you can receive but not transmit, ATC may use the <b>speechless</b> procedure, asking you to press the transmit button a set number of times.</li>
</ul>`,
qs:[
{q:"Which is the international aeronautical emergency frequency?",o:["121.5 MHz","118.0 MHz","123.45 MHz","243.0 kHz"],e:"121.5 MHz is the VHF emergency frequency, monitored by the UK Distress and Diversion cell."},
{q:"In a MAYDAY message, which comes first after the callsign and aircraft type?",o:["The nature of the emergency","The position","The number of persons on board","The pilot's qualification"],e:"After the station, callsign and type: nature of the emergency, intentions, position/height/heading, pilot qualification, other information."},
{q:"Where may a UK pilot make a practice PAN?",o:["On 121.5 MHz only, prefixed \"Practice PAN\"","On any frequency in use","On the aerodrome frequency only","Practice PANs are not allowed"],e:"Practice PANs go to the Distress and Diversion cell on 121.5 MHz and must be clearly identified as practice."},
{q:"Which squawk indicates radio communication failure?",o:["7600","7700","7500","7000"],e:"7600 is radio failure, 7700 emergency, 7500 unlawful interference, 7000 VFR conspicuity."},
{q:"Your receiver has failed but you believe your transmitter works. What should you do?",o:["Transmit your messages blind, prefixed \"Transmitting blind\", twice","Stop transmitting altogether","Squawk 7500","Transmit on 121.5 only, once"],e:"Transmitting blind gives ATC your position and intentions. Each message is sent twice because you can't hear any reply."},
{q:"The controller hears a MAYDAY on the frequency and says \"Stop transmitting, MAYDAY\". What does this mean?",o:["Other stations must keep silent while the emergency is handled","The emergency is over","You must make a MAYDAY yourself","Change frequency immediately"],e:"This imposes radio silence on other aircraft so the distress traffic isn't interrupted."},
{q:"Which describes a PAN rather than a MAYDAY situation?",o:["An urgent situation that does not need immediate assistance","Grave and imminent danger","Fire in the cabin","Complete engine failure over the sea"],e:"PAN PAN is the urgency signal. MAYDAY is for grave and imminent danger requiring immediate help."}
]});

T.push({ id:"vhf", ref:"090 · 6", title:"VHF and routine calls",
blurb:"How far VHF reaches, the freecall format, and the standard circuit reports.",
learn:()=>`
<h3>VHF</h3>
<ul>
<li>The aeronautical VHF voice band runs from <b>118 to 137 MHz</b>.</li>
<li>VHF travels in straight lines, so it is <b>line of sight</b>. Hills and the curve of the earth block it.</li>
<li>Approximate range: <span class="mono">range (nm) ≈ 1.23 × √(height in ft)</span>. At 2,500 ft that is about 61 nm.</li>
</ul>
<h3>The freecall</h3>
<p>For a UK FIS freecall, after making initial contact and being asked to "pass your message":</p>
<ol>
<li>Callsign</li>
<li>Aircraft type</li>
<li>Departure point</li>
<li>Destination</li>
<li>Position (somewhere the controller will recognise)</li>
<li>Altitude and altimeter setting</li>
<li>Flight rules (VFR or IFR)</li>
<li>Routing, intentions or request</li>
</ol>
<p>Example: "Golf-ABCD, Cessna 150, Eshott to Carlisle, 5 miles west of Morpeth, altitude 2,500 feet, QNH 1012, VFR, request Basic Service."</p>
<h3>Circuit reports</h3>
<ul>
<li><b>Downwind</b>: when abeam the upwind end of the runway.</li>
<li><b>Base</b>: if requested, on completing the turn onto base leg.</li>
<li><b>Final</b>: after the turn onto final, within about 4 nm of the threshold.</li>
<li><b>Long final</b>: on final between about 4 and 8 nm.</li>
</ul>
<div class="box trap"><b>Common trap</b>Before transmitting, listen. Make sure the frequency is clear and you aren't about to interrupt an exchange.</div>`,
qs:[
{q:"Which frequency band is used for aeronautical VHF voice communication?",o:["118 to 137 MHz","108 to 118 MHz","190 to 1,750 kHz","2 to 30 MHz"],e:"Voice communications use 118 to 137 MHz. 108 to 118 MHz is used by VOR and ILS."},
{q:"Why might you lose radio contact with a station 40 nm away when flying low behind hills?",o:["VHF is line of sight and the hills block it","The station switches off at low level","VHF only works over water","The transmitter loses power at low level"],e:"VHF travels in straight lines. Terrain or the curve of the earth between you and the station blocks it."},
{q:"Approximately what VHF range would you expect at 2,500 ft over flat ground?",o:["61 nm","25 nm","150 nm","10 nm"],e:"1.23 × √2,500 = 1.23 × 50 ≈ 61 nm."},
{q:"In a UK freecall, what comes immediately after the aircraft type?",o:["Departure point","Position","Altitude","Request"],e:"Callsign, type, departure, destination, position, altitude and setting, flight rules, then intentions or request."},
{q:"When is the \"downwind\" report normally made?",o:["When abeam the upwind end of the runway","At the start of the crosswind leg","Halfway along the downwind leg","When turning onto base"],e:"Downwind is reported abeam the upwind end of the runway."},
{q:"At about what distance from the threshold is a \"final\" report made?",o:["Within about 4 nm","At 10 nm","At exactly 2 nm","Over the threshold"],e:"'Final' is reported after turning onto final within about 4 nm. Between about 4 and 8 nm is 'long final'."},
{q:"What should you do immediately before transmitting?",o:["Listen to make sure the frequency is clear","Press the transmit button and wait two seconds","Change to 121.5","Squawk ident"],e:"Listening first avoids blocking another transmission or interrupting an exchange."}
]});

extendTopic("comms", "words", { qs:[
{type:"match", q:"Match each standard word or phrase to its meaning.", pairs:[["AFFIRM","Yes"],["NEGATIVE","No, or permission not granted"],["WILCO","I understand and will comply"],["STANDBY","Wait and I will call you"],["SAY AGAIN","Repeat your last transmission"]],
  e:"ROGER is not on this list because it only acknowledges receipt; it answers nothing."},
{q:"You make an error during a transmission. What should you say?",o:["Correction, followed by the correct version","Say again","Disregard, then switch off","Negative, then start a new call later"],e:"'Correction' means an error has been made in this transmission and the correct version follows."},
{q:"What does \"I say again\" mean?",o:["I am repeating for clarity or emphasis","Please repeat your message","I did not understand","I am cancelling my last message"],e:"'I say again' is used by the sender to repeat. 'Say again' asks the other station to repeat."},
{q:"What is \"BREAK\" used for?",o:["To separate parts of a message, or messages to different stations","To end a radio exchange","To request radio silence","To declare an emergency"],e:"BREAK marks a separation within a transmission, for example between instructions to two different aircraft."},
{q:"What does \"APPROVED\" mean?",o:["Permission for the proposed action is granted","I have received your message","Yes, that is correct","The clearance is cancelled"],e:"APPROVED grants a request, for example 'Golf-CD, orbit overhead approved'."}
]});

extendTopic("comms", "readback", { qs:[
{type:"order", q:"ATC: \"Golf-CD, climb altitude three thousand feet, squawk four five two one, QNH one zero one two.\" Put your readback in the correct order.", items:["Climb altitude three thousand feet","Squawk four five two one","QNH one zero one two","Golf-CD"],
  e:"Read back in the order given, and finish with your callsign."},
{q:"ATC: \"Golf-CD, hold short runway 27.\" What is the correct reply?",o:["Hold short runway 27, Golf-CD","Roger, Golf-CD","Wilco, Golf-CD","Golf-CD"],e:"Instructions to hold short of an active runway must be read back in full."},
{q:"ATC: \"Golf-CD, report final.\" Which reply is correct?",o:["Wilco, Golf-CD","Report final, Golf-CD, cleared to land","Roger, final","Affirm, Golf-CD"],e:"A request to report doesn't need a readback: WILCO confirms you'll do it."},
{q:"With a landing clearance, ATC also gives the surface wind. What do you read back?",o:["The clearance and the runway; the wind need not be read back","Only the wind","Everything, including the wind","Only your callsign"],e:"Landing clearances are on the readback list; the surface wind is information and is not."},
{q:"ATC: \"Golf-CD, line up and wait runway 25.\" What may you do?",o:["Enter the runway and line up, but not take off","Take off when ready","Hold at the holding point","Cross the runway"],e:"Line up and wait means enter and line up only. Take-off needs a separate clearance using the words 'cleared for take-off'."}
]});

extendTopic("comms", "services", { qs:[
{type:"match", q:"Match each station suffix to the service it provides.", pairs:[["TOWER","Aerodrome control"],["GROUND","Ground movement control"],["APPROACH","Approach control"],["INFORMATION","Flight information service"],["RADIO","Air/ground communication service"]],
  e:"The suffix tells you what to expect: control and clearances, information only, or an air/ground radio operator."},
{q:"For which flights is the UK Deconfliction Service intended?",o:["IFR flights","VFR flights in the circuit","Flights inside controlled airspace only","Gliders"],e:"Deconfliction Service gives traffic information plus avoiding-action advice and is intended for IFR flight. VFR pilots usually take Basic or Traffic Service."},
{q:"Under a Traffic Service, ATC reports traffic in your 12 o'clock, 3 miles, opposite direction. Who decides what to do about it?",o:["The pilot","The controller","The other aircraft's pilot","Whoever spots the other first"],e:"Under Traffic Service the controller gives information; avoiding action is the pilot's decision."},
{q:"You are receiving a Traffic Service and want to change to a Basic Service. What should you do?",o:["Tell the controller and agree the change","Simply stop listening","Change squawk to 7000 without telling ATC","Switch frequency"],e:"The type of service is agreed between pilot and controller, and changes are agreed and read back too."},

extendTopic("comms", "emergency", { qs:[
{type:"order", q:"Put the main parts of a MAYDAY message in order, after \"MAYDAY MAYDAY MAYDAY\" and the station addressed.", items:["Callsign","Aircraft type","Nature of the emergency","Intentions","Position, height and heading","Pilot qualification"],
  e:"Then other useful information such as persons on board and endurance. If time is short, say what you can; the order helps the controller, but getting the call out matters most."},
{q:"When should you select squawk 7700?",o:["In an emergency, unless ATC has already given you a code","Whenever you are uncertain of your position","On every flight outside controlled airspace","When your radio fails"],e:"7700 alerts every radar unit to an emergency. If you are already working ATC on a discrete code, keep it unless told otherwise."},
{q:"ATC asks you to use the speechless procedure. What does that mean?",o:["Your transmitter carrier is heard but not your voice, so you answer by pressing the transmit button a set number of times","You must stop transmitting completely","You should squawk 7600 and land","You should switch to 121.5"],e:"If ATC can hear your carrier but no speech, they can ask yes/no questions and you reply with presses of the transmit button."},

]});

// =====================================================================
// App logic
// =====================================================================
const KEY = "c150cl.v1";          // checklist progress
const PKEY = "c150cl.prefs";      // display preferences
const MAX_AGE = 6 * 3600 * 1000;  // progress older than 6 h is discarded

let state = {};                   // itemKey -> true
let last = null;                  // id of last phase opened
let prefs = { mode:"day", size:"m", haptic:true };
let staleCleared = false;
let currentPhase = null;
let section = "cl";            // "cl" checklist, "tr" training notes, "ex" exams

const $ = id => document.getElementById(id);
const home = $("home"), phaseView = $("phaseView"), hdr = $("hdr"), hdrTitle = $("hdrTitle");
const hprogBar = $("hprogBar"), modeBtn = $("modeBtn");
const ALL = NORMAL.concat(EMERG);
const byId = id => ALL.find(p => p.id === id);

// ---------- storage (all wrapped: storage can be blocked) ----------
function load(){
  try{ const p = JSON.parse(localStorage.getItem(PKEY) || "null"); if(p) Object.assign(prefs, p); }catch(e){}
  try{
    const s = JSON.parse(localStorage.getItem(KEY) || "null");
    if(s && s.t){
      if(Date.now() - s.t < MAX_AGE){ state = s.state || {}; last = s.last || null; }
      else { staleCleared = Object.keys(s.state || {}).length > 0; localStorage.removeItem(KEY); }
    }
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({ t:Date.now(), state, last })); }catch(e){} }
function savePrefs(){ try{ localStorage.setItem(PKEY, JSON.stringify(prefs)); }catch(e){} }

// ---------- helpers ----------
function itemsOf(phase){
  const out = [];
  phase.subs.forEach((sub,si) => sub.items.forEach((it,ii) => out.push({ key:`${phase.id}.${si}.${ii}`, si, ii, it })));
  return out;
}
function progress(phase){
  const items = itemsOf(phase);
  const done = items.filter(x => state[x.key]).length;
  return { done, total:items.length, next:items.find(x => !state[x.key]) };
}
function resetPhase(phase){ itemsOf(phase).forEach(x => delete state[x.key]); save(); }

let toastT = null;
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 1600);
}
function buzz(){ if(prefs.haptic && navigator.vibrate){ try{ navigator.vibrate(12); }catch(e){} } }

// Two-tap confirm: first tap arms (turns red), second within 3 s fires.
function armedButton(cls, label, armedLabel, action){
  const b = document.createElement("button");
  b.className = cls; b.textContent = label;
  let t = null;
  b.addEventListener("click", () => {
    if(b.classList.contains("armed")){
      clearTimeout(t); b.classList.remove("armed"); b.textContent = label; action();
    } else {
      b.classList.add("armed"); b.textContent = armedLabel;
      t = setTimeout(() => { b.classList.remove("armed"); b.textContent = label; }, 3000);
    }
  });
  return b;
}

// ---------- display prefs ----------
const MODES = { day:{ icon:"☁", name:"Day mode" }, sun:{ icon:"☀", name:"Sunlight mode" }, night:{ icon:"☾", name:"Night mode" } };
const THEME = { day:"#0e3a5c", sun:"#000000", night:"#05090d" };
function applyPrefs(){
  document.body.dataset.mode = prefs.mode;
  document.documentElement.dataset.size = prefs.size;
  modeBtn.textContent = MODES[prefs.mode].icon;
  const tc = document.querySelector('meta[name="theme-color"]'); if(tc) tc.content = THEME[prefs.mode];
}
modeBtn.addEventListener("click", () => {
  const order = ["day","sun","night"];
  prefs.mode = order[(order.indexOf(prefs.mode) + 1) % 3];
  applyPrefs(); savePrefs(); toast(MODES[prefs.mode].name);
});

// ---------- home ----------
function renderHome(){
  currentPhase = null;
  section = "cl"; $("studyView").hidden = true; $("emergFab").hidden = false;
  hdr.classList.add("top"); hdr.classList.remove("insub"); markTabs();
  phaseView.hidden = true; home.hidden = false;
  hdr.classList.remove("inphase");
  hdrTitle.innerHTML = 'Cessna 150/152<small>Pooley’s Checklist · MOD05/18</small>';
  home.innerHTML = "";

  const cav = document.createElement("div");
  cav.className = "caveat";
  cav.textContent = "Not authoritative — supplement to the Pilot's Operating Handbook";
  home.appendChild(cav);

  if(staleCleared){
    const s = document.createElement("div");
    s.className = "stale";
    s.textContent = "Ticks from your last session were over 6 hours old and have been cleared.";
    home.appendChild(s);
  }

  // Continue card: last phase opened, if part-done
  const lp = last && byId(last);
  if(lp){
    const p = progress(lp);
    if(p.done > 0 && p.done < p.total){
      const c = document.createElement("button");
      c.className = "cont";
      c.innerHTML = `<span class="ct"><span class="k">Continue</span><div class="n">${lp.title}</div>`+
        `<div class="x">${p.done} / ${p.total} · Next: ${p.next.it[0]}</div></span><span class="arrow">›</span>`;
      c.addEventListener("click", () => openPhase(lp));
      home.appendChild(c);
    }
  }

  home.appendChild(label("Normal Procedures", false));
  home.appendChild(grid(NORMAL, false));
  home.appendChild(label("Emergencies", true));
  home.appendChild(grid(EMERG, true));
}
function label(text, red){
  const l = document.createElement("div");
  l.className = "grid-label" + (red ? " red" : "");
  l.textContent = text;
  return l;
}
function grid(list, red){
  const g = document.createElement("div");
  g.className = "grid";
  list.forEach((phase, idx) => {
    const b = document.createElement("button");
    b.className = "pbtn" + (red ? " red" : "");
    const p = progress(phase);
    if(red){
      b.innerHTML = `<span class="pnum">E${idx+1}</span><span class="pname">${phase.title}</span>`;
    } else {
      if(p.done === p.total) b.classList.add("done");
      const pct = Math.round(p.done / p.total * 100);
      b.innerHTML = `<span class="pnum">${String(idx+1).padStart(2,"0")}</span>`+
        `<span class="pname">${phase.title}</span>`+
        `<span class="pbar"><i style="width:${pct}%"></i></span>`+
        `<span class="pcount">${p.done === p.total ? "✓ Complete" : p.done + " / " + p.total}</span>`;
    }
    b.addEventListener("click", () => openPhase(phase));
    g.appendChild(b);
  });
  return g;
}

// ---------- phase view ----------
let doneCard = null;
function renderPhase(phase){
  currentPhase = phase;
  last = phase.id; save();
  home.hidden = true; phaseView.hidden = false;
  section = "cl"; $("studyView").hidden = true; $("emergFab").hidden = false;
  hdr.classList.remove("top", "insub");
  hdr.classList.add("inphase");
  phaseView.innerHTML = "";

  if(phase.note){
    const n = document.createElement("div");
    n.className = "pnote" + (phase.emerg ? " warn" : "");
    n.textContent = phase.note;
    phaseView.appendChild(n);
  }

  const singleDrill = phase.subs.length === 1 && phase.subs[0].name === "Drill";
  let lastSi = -1;
  itemsOf(phase).forEach(({ key, si, it }) => {
    if(si !== lastSi && !singleDrill){
      const s = document.createElement("div");
      s.className = "sub" + (phase.emerg ? " red" : "");
      s.textContent = phase.subs[si].name;
      phaseView.appendChild(s);
    }
    lastSi = si;
    const b = document.createElement("button");
    b.className = "ibtn" + (phase.emerg ? " red" : "") + (state[key] ? " checked" : "");
    b.setAttribute("aria-pressed", state[key] ? "true" : "false");
    const mn = it[2] ? `<span class="mn">${it[2]}</span>` : "";
    b.innerHTML = `<span class="box"></span><span class="txt"><span class="chal">${mn}${it[0]}</span><span class="resp">${it[1]}</span></span>`;
    b.addEventListener("click", () => {
      const on = !state[key];
      if(on) state[key] = true; else delete state[key];
      b.classList.toggle("checked", on);
      b.setAttribute("aria-pressed", on ? "true" : "false");
      save(); buzz();
      refreshPhase(on);
    });
    phaseView.appendChild(b);
  });

  if(phase.endnote){
    const n = document.createElement("div");
    n.className = "pnote warn";
    n.textContent = phase.endnote;
    phaseView.appendChild(n);
  }

  // Completion card with "next phase" button
  doneCard = document.createElement("div");
  doneCard.className = "donecard";
  const idx = NORMAL.indexOf(phase);
  const nextPhase = idx >= 0 ? NORMAL[idx + 1] : null;
  doneCard.innerHTML = `<div class="dt">✓ ${phase.emerg ? "Drill" : "Section"} complete</div>`;
  const nb = document.createElement("button");
  nb.className = "bigbtn" + (nextPhase ? "" : " ghost");
  nb.textContent = nextPhase ? `Next: ${nextPhase.title} ›` : "Back to phases";
  nb.addEventListener("click", () => nextPhase ? openPhase(nextPhase, true) : goHome());
  doneCard.appendChild(nb);
  phaseView.appendChild(doneCard);

  phaseView.appendChild(armedButton("resetbtn", "Reset this section", "Tap again to reset", () => {
    resetPhase(phase); renderPhase(phase); toast("Section reset");
  }));

  window.scrollTo(0, 0);
  refreshPhase(false);
  // Resuming part-way through: bring the next item into view
  const p = progress(phase);
  if(p.done > 0 && p.done < p.total){
    const n = phaseView.querySelector(".ibtn.next");
    if(n) setTimeout(() => n.scrollIntoView({ block:"center" }), 0);
  }
}

// Updates header progress, "next" highlight and completion card.
function refreshPhase(advance){
  const phase = currentPhase; if(!phase) return;
  const p = progress(phase);
  hdrTitle.innerHTML = `${phase.title}<small>${phase.emerg ? "Emergency drill" : "Normal procedure"} · ${p.done} / ${p.total}</small>`;
  hprogBar.style.width = (p.done / p.total * 100) + "%";

  const btns = [...phaseView.querySelectorAll(".ibtn")];
  btns.forEach(b => b.classList.remove("next"));
  const nxt = btns.find(b => !b.classList.contains("checked"));
  doneCard.hidden = !!nxt;
  if(nxt){
    nxt.classList.add("next");
    if(advance) keepInView(nxt);
  } else if(advance){
    doneCard.scrollIntoView({ behavior:"smooth", block:"center" });
  }
}
function keepInView(el){
  const r = el.getBoundingClientRect();
  if(r.top < hdr.offsetHeight + 8 || r.bottom > window.innerHeight - 110){
    el.scrollIntoView({ behavior:"smooth", block:"center" });
  }
}

// ---------- navigation (hardware back button aware) ----------
function openPhase(phase, replace){
  closeSheet();
  renderPhase(phase);
  try{ history[replace ? "replaceState" : "pushState"]({ ph:phase.id }, ""); }catch(e){}
}
function goHome(){
  closeSheet();
  if(history.state && history.state.ph){ try{ history.back(); return; }catch(e){} }
  renderHome();
}
window.addEventListener("popstate", e => {
  closeSheet();
  if(e.state && e.state.st){ Study.fromState(e.state); return; }
  if(e.state && e.state.lg){ Logbook.fromState(e.state); return; }
  const ph = e.state && e.state.ph && byId(e.state.ph);
  ph ? renderPhase(ph) : renderHome();
});
$("backBtn").addEventListener("click", () => section === "cl" ? goHome() : section === "lg" ? Logbook.back() : Study.back());

// ---------- section tabs (top-level screens only) ----------
function markTabs(){
  [["tabCl","cl"],["tabTr","tr"],["tabEx","ex"],["tabLg","lg"]].forEach(([id, s]) => {
    const b = $(id); b.classList.toggle("on", section === s); b.setAttribute("aria-pressed", section === s ? "true" : "false");
  });
}
$("tabCl").addEventListener("click", () => { if(section === "cl") return; try{ history.replaceState({}, ""); }catch(e){} renderHome(); });
$("tabTr").addEventListener("click", () => { if(section === "tr") return; Study.showTraining(); });
$("tabEx").addEventListener("click", () => { if(section === "ex") return; Study.showExams(); });
$("tabLg").addEventListener("click", () => { if(section === "lg") return; Logbook.show(); });

// ---------- bottom sheet ----------
function openSheet(title, red, body){
  $("sheetTitle").textContent = title;
  $("sheetHead").classList.toggle("red", !!red);
  const sb = $("sheetBody"); sb.innerHTML = ""; sb.appendChild(body);
  $("sheet").hidden = false;
}
function closeSheet(){ $("sheet").hidden = true; }
$("sheetClose").addEventListener("click", closeSheet);
$("sheetBackdrop").addEventListener("click", closeSheet);

// Emergency quick list: two taps from anywhere to any drill
$("emergFab").addEventListener("click", () => {
  const list = document.createElement("div");
  list.className = "elist";
  EMERG.forEach(ph => {
    const b = document.createElement("button");
    b.className = "ebtn";
    b.innerHTML = `<span>${ph.title}</span><span>›</span>`;
    b.addEventListener("click", () => openPhase(ph, !!(currentPhase && currentPhase.emerg)));
    list.appendChild(b);
  });
  openSheet("Emergencies", true, list);
});

// Settings
$("setBtn").addEventListener("click", () => {
  const wrap = document.createElement("div");
  const seg = (title, opts, key, note) => {
    const g = document.createElement("div"); g.className = "setgroup";
    g.innerHTML = `<div class="setlabel">${title}</div>`;
    const s = document.createElement("div"); s.className = "seg";
    opts.forEach(([v, lbl]) => {
      const b = document.createElement("button");
      b.textContent = lbl; if(prefs[key] === v) b.classList.add("on");
      b.addEventListener("click", () => {
        prefs[key] = v; applyPrefs(); savePrefs();
        s.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      });
      s.appendChild(b);
    });
    g.appendChild(s);
    if(note){ const n = document.createElement("div"); n.className = "setnote"; n.textContent = note; g.appendChild(n); }
    wrap.appendChild(g);
  };
  seg("Display", [["day","☁ Day"],["sun","☀ Sun"],["night","☾ Night"]], "mode",
      "Sun = black on white for glare. Night = dim, for dusk and cockpit at night.");
  seg("Text size", [["s","S"],["m","M"],["l","L"],["xl","XL"]], "size");
  seg("Vibrate on tick", [[true,"On"],[false,"Off"]], "haptic");

  const g = document.createElement("div"); g.className = "setgroup";
  g.innerHTML = `<div class="setlabel">Progress</div>`;
  g.appendChild(armedButton("resetbtn", "Reset all checks", "Tap again to reset everything", () => {
    state = {}; last = null; staleCleared = false; save(); closeSheet(); goHome(); renderHome(); toast("All checks reset");
  }));
  const n = document.createElement("div"); n.className = "setnote";
  n.textContent = "Ticks are saved on this device and cleared automatically after 6 hours of no use, so an old session never carries into a new flight.";
  g.appendChild(n);
  wrap.appendChild(g);

  const ga = document.createElement("div"); ga.className = "setgroup";
  ga.innerHTML = `<div class="setlabel">Exam answers</div>`;
  ga.appendChild(armedButton("resetbtn", "Reset exam answers", "Tap again to clear answers", () => {
    Study.reset(); closeSheet();
    if(section === "tr") Study.showTraining();
    if(section === "ex") Study.showExams();
    toast("Exam answers cleared");
  }));
  const gn = document.createElement("div"); gn.className = "setnote";
  gn.textContent = "Exam answers for every subject are kept on this device until you clear them. They are separate from checklist ticks.";
  ga.appendChild(gn);
  wrap.appendChild(ga);

  const gb = document.createElement("div"); gb.className = "setgroup";
  gb.innerHTML = `<div class="setlabel">Backup</div>`;
  const bb = document.createElement("button"); bb.className = "resetbtn"; bb.textContent = "Backup and restore";
  bb.addEventListener("click", () => { closeSheet(); Logbook.renderBackupFromSettings(); });
  gb.appendChild(bb);
  const bn = document.createElement("div"); bn.className = "setnote";
  bn.textContent = "Save your logbook, exam answers and settings to a file, or restore them on a new phone.";
  gb.appendChild(bn);
  wrap.appendChild(gb);

  openSheet("Settings", false, wrap);
});

// ---------- keep the screen on (where supported) ----------
let wakeLock = null;
async function keepAwake(){
  try{ if("wakeLock" in navigator && document.visibilityState === "visible") wakeLock = await navigator.wakeLock.request("screen"); }catch(e){}
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") keepAwake(); });
document.addEventListener("click", function once(){ keepAwake(); document.removeEventListener("click", once); });


// =====================================================================
// Hands-on diagrams for the Training notes.
// A topic's notes include <div class="widget" data-w="name"></div>; after the
// notes are drawn, mountWidgets() builds each one from WIDGETS[name].
// =====================================================================
const WIDGETS = {};
function mountWidgets(root){
  root.querySelectorAll(".widget[data-w]").forEach(el => {
    const f = WIDGETS[el.dataset.w];
    if(f){ try{ f(el); }catch(e){ el.textContent = "This diagram could not be drawn."; } }
  });
}

const W = (() => {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
  const norm = d => ((Math.round(d) % 360) + 360) % 360;
  const hdg = d => { const n = norm(d); return String(n === 0 ? 360 : n).padStart(3, "0"); };
  const r1 = n => Math.round(n * 10) / 10;
  let uid = 0;
  function slider(label, min, max, step, value, show, onInput){
    const id = "w" + (++uid);
    const d = document.createElement("div"); d.className = "wctl";
    d.innerHTML = `<label for="${id}"><span>${esc(label)}</span><b></b></label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${value}">`;
    const inp = d.querySelector("input"), out = d.querySelector("b");
    const sync = () => { out.textContent = show(+inp.value); };
    inp.addEventListener("input", () => { sync(); onInput(); });
    sync();
    return { el:d, get:() => +inp.value, set:v => { inp.value = v; sync(); } };
  }
  function seg(options, value, onChange){
    const d = document.createElement("div"); d.className = "wseg";
    let cur = value;
    options.forEach(([v, lbl]) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = lbl;
      if(v === cur) b.classList.add("on");
      b.addEventListener("click", () => { cur = v; d.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); onChange(v); });
      d.appendChild(b);
    });
    return { el:d, get:() => cur };
  }
  function outs(list){ return `<div class="wout">${list.map(([k,v,hl]) => `<div class="o${hl ? " hl" : ""}"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join("")}</div>`; }
  function box(cls, html){ const d = document.createElement("div"); if(cls) d.className = cls; if(html != null) d.innerHTML = html; return d; }
  function arrow(x1,y1,x2,y2,cls,width){ return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" class="ln ${cls||""}" style="stroke-width:${width||2.5}" marker-end="url(#arr)"/>`; }
  return { esc, rad, deg, norm, hdg, r1, slider, seg, outs, box, arrow };
})();

WIDGETS.loadfactor = root => {
  const pic = W.box("wsvg"), out = W.box(), msg = W.box("wmsg");
  const bank = W.slider("Angle of bank", 0, 75, 5, 30, v => v + "°", draw);
  const vs = W.slider("Stall speed, wings level", 40, 70, 1, 48, v => v + " kt", draw);
  const ctl = W.box("wgrid"); ctl.append(bank.el, vs.el);
  root.append(ctl, pic, out, msg);
  function draw(){
    const b = bank.get(), n = 1 / Math.cos(W.rad(b)), vst = vs.get() * Math.sqrt(n);
    const cx = 160, cy = 120, L = 34 * n, a = W.rad(b);
    const wx = Math.cos(a) * 80, wy = Math.sin(a) * 80;
    const lx = Math.sin(a) * L, ly = -Math.cos(a) * L;
    pic.innerHTML = `<svg viewBox="0 0 320 220" role="img" aria-label="Rear view of an aircraft banked at ${b} degrees with its lift tilted">
      <rect class="fb" x="1" y="1" width="318" height="218" rx="6"/>
      <line x1="20" y1="200" x2="300" y2="200" class="ln dot2"/><text class="tm" x="22" y="194">horizon</text>
      <line x1="${cx-wx}" y1="${cy-wy}" x2="${cx+wx}" y2="${cy+wy}" class="ln" style="stroke-width:5"/>
      <circle cx="${cx}" cy="${cy}" r="10" class="f-card ln"/>
      ${W.arrow(cx, cy, cx+lx, cy+ly, "pa", 3)}
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-34}" class="ln dash"/>
      ${W.arrow(cx, cy+12, cx, cy+46, "", 3)}
      <text class="tb" x="16" y="24">LIFT = ${n.toFixed(2)} × WEIGHT</text><text class="tm" x="16" y="38">rear view, banked right</text>
      <text class="tb" x="${cx-8}" y="${cy+52}" text-anchor="end">WEIGHT</text>
    </svg>`;
    out.innerHTML = W.outs([["Load factor", n.toFixed(2) + " g", true], ["Stall speed now", Math.round(vst) + " kt", true], ["Lift needed", "+" + Math.round((n - 1) * 100) + "%"]]);
    msg.textContent = b === 0 ? "Wings level: lift equals weight, load factor 1." :

    msg.className = "wmsg" + (b >= 60 ? " warn" : "");
  }
  draw();
};

WIDGETS.metar = root => {
  const SAMPLES = [
    "METAR EGNT 171020Z 24012KT 9999 FEW030 SCT045 12/07 Q1009",
    "METAR EGPH 171050Z 27018G30KT 240V310 9999 -SHRA BKN022 09/04 Q0998",
    "METAR EGPD 170920Z VRB03KT 3000 BR OVC004 08/08 Q1011 TEMPO 1200 BR",
    "METAR EGCC 171420Z 21008KT CAVOK 18/09 Q1016 NOSIG",
    "METAR EGLL 170650Z 05004KT 0400 R27L/0600 FG VV001 06/06 Q1027"
  ];
  const WX = { MI:"shallow", BC:"patches of", PR:"partial", DR:"low drifting", BL:"blowing", SH:"showers of", TS:"thunderstorm with", FZ:"freezing",
    DZ:"drizzle", RA:"rain", SN:"snow", SG:"snow grains", PL:"ice pellets", GR:"hail", GS:"small hail", UP:"unknown precipitation",
    BR:"mist", FG:"fog", FU:"smoke", VA:"volcanic ash", DU:"dust", SA:"sand", HZ:"haze", PO:"dust whirls", SQ:"squalls", FC:"funnel cloud", SS:"sandstorm", DS:"duststorm" };
  const AMT = { FEW:"Few (1–2 oktas)", SCT:"Scattered (3–4 oktas)", BKN:"Broken (5–7 oktas)", OVC:"Overcast (8 oktas)" };
  const temp = s => (s[0] === "M" ? "−" + +s.slice(1) : +s) + " °C";
  function decode(g, i){
    let m;
    if(g === "METAR") return "Report type: routine actual weather (METAR).";
    if(g === "SPECI") return "Report type: special report, issued because conditions changed significantly.";
    if(i <= 1 && /^[A-Z]{4}$/.test(g)) return `Aerodrome: ICAO location indicator ${g}.`;
    if((m = g.match(/^(\d{2})(\d{2})(\d{2})Z$/))) return `Observed on day ${+m[1]} of the month at ${m[2]}:${m[3]} UTC.`;
    if(g === "AUTO") return "Automatic observation, no human observer.";
    if((m = g.match(/^(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT$/))) return (m[1] === "VRB" ? "Wind variable in direction" : `Wind from ${m[1]}° true`) + ` at ${+m[2]} kt` + (m[3] ? `, gusting ${+m[3]} kt` : "") + ".";
    if((m = g.match(/^(\d{3})V(\d{3})$/))) return `Wind direction varying between ${m[1]}° and ${m[2]}° true.`;
    if(g === "CAVOK") return "CAVOK: visibility 10 km or more, no cloud below 5,000 ft (or the highest MSA if higher), no CB or TCU, no significant weather.";
    if(g === "9999") return "Visibility 10 km or more.";
    if((m = g.match(/^(\d{4})$/))) return `Visibility ${(+m[1]).toLocaleString("en-GB")} m.` + (+m[1] < 1000 ? " Below 1,000 m: fog conditions." : "");
    if((m = g.match(/^R(\d{2}[LCR]?)\/([PM])?(\d{4})[UDN]?$/))) return `Runway visual range on runway ${m[1]}: ${m[2] === "P" ? "more than " : m[2] === "M" ? "less than " : ""}${+m[3]} m.`;
    if((m = g.match(/^(FEW|SCT|BKN|OVC)(\d{3})(CB|TCU)?$/))) return `${AMT[m[1]]} cloud, base ${(+m[2]*100).toLocaleString("en-GB")} ft above aerodrome level` + (m[3] === "CB" ? ", cumulonimbus." : m[3] === "TCU" ? ", towering cumulus." : ".");
    if((m = g.match(/^VV(\d{3})$/))) return `Sky obscured; vertical visibility ${(+m[1]*100)} ft.`;
    if(g === "NSC") return "No significant cloud.";
    if(g === "NCD") return "No cloud detected (automatic station).";
    if((m = g.match(/^(M?\d{2})\/(M?\d{2})$/))) return `Temperature ${temp(m[1])}, dew point ${temp(m[2])}.` + (m[1] === m[2] ? " Saturated: expect mist, fog or low cloud." : "");
    if((m = g.match(/^Q(\d{4})$/))) return `QNH ${+m[1]} hPa.`;
    if(g === "NOSIG") return "Trend: no significant change expected in the next 2 hours.";
    if(g === "TEMPO") return "Trend: temporarily, the following conditions.";
    if(g === "BECMG") return "Trend: becoming, a lasting change to the following.";
    if((m = g.match(/^(\+|-|VC)?((?:MI|BC|PR|DR|BL|SH|TS|FZ)?)((?:DZ|RA|SN|SG|PL|GR|GS|UP|BR|FG|FU|VA|DU|SA|HZ|PO|SQ|FC|SS|DS)+)$/))){
      const parts = [];
      if(m[1] === "+") parts.push("heavy"); if(m[1] === "-") parts.push("light");
      if(m[2]) parts.push(WX[m[2]]);
      (m[3].match(/../g) || []).forEach(c => parts.push(WX[c]));
      return "Weather: " + parts.join(" ") + (m[1] === "VC" ? " in the vicinity" : "") + ".";
    }
    return "Not decoded here. Check the group in the Met Office or CAA guidance.";
  }
  let text = SAMPLES[0], sel = -1, seen = new Set();
  const pick = W.box("wseg");
  SAMPLES.forEach((s, k) => { const b = document.createElement("button"); b.type = "button"; b.textContent = s.split(" ")[1]; if(k === 0) b.classList.add("on");
    b.addEventListener("click", () => { pick.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); text = s; inp.value = s; sel = -1; seen = new Set(); draw(); }); pick.appendChild(b); });
  const inp = document.createElement("input"); inp.className = "wtext"; inp.value = text; inp.setAttribute("aria-label", "METAR to decode");
  inp.addEventListener("input", () => { text = inp.value.toUpperCase(); sel = -1; seen = new Set(); pick.querySelectorAll("button").forEach(x => x.classList.remove("on")); draw(); });
  const groups = W.box("groups"), msg = W.box("say");
  root.append(W.box("wmsg", "Pick a report, or paste one, then tap each group to decode it."), pick, inp, groups, msg);
  function draw(){
    const gs = text.trim().split(/\s+/).filter(Boolean);
    groups.innerHTML = "";
    gs.forEach((g, i) => { const b = document.createElement("button"); b.type = "button"; b.textContent = g;
      if(i === sel) b.classList.add("on"); else if(seen.has(i)) b.classList.add("seen");
      b.addEventListener("click", () => { sel = i; seen.add(i); draw(); }); groups.appendChild(b); });
    msg.innerHTML = sel >= 0 && gs[sel] ? `<small>${W.esc(gs[sel])}</small>${W.esc(decode(gs[sel], sel))}` : `<small>Decoded</small>Tap a group above. ${seen.size} of ${gs.length} decoded.`;
  }
  draw();
};

WIDGETS.windtri = root => {
  const pic = W.box("wsvg"), out = W.box(), msg = W.box("wmsg");
  const tr = W.slider("Planned track", 0, 355, 5, 90, v => W.hdg(v) + "°", draw);
  const tas = W.slider("True airspeed", 60, 140, 5, 100, v => v + " kt", draw);
  const wd = W.slider("Wind from", 0, 350, 10, 30, v => W.hdg(v) + "°", draw);
  const ws = W.slider("Wind speed", 0, 40, 1, 20, v => v + " kt", draw);
  const ctl = W.box("wgrid"); ctl.append(tr.el, tas.el, wd.el, ws.el);
  root.append(ctl, pic, out, msg);
  function draw(){
    const T = tr.get(), V = tas.get(), D = wd.get(), S = ws.get();
    const wa = W.rad(D - T), xw = S * Math.sin(wa);
    const drift = W.deg(Math.asin(Math.max(-1, Math.min(1, xw / V))));
    const H = T + drift, gs = V * Math.cos(W.rad(drift)) - S * Math.cos(wa);
    // vectors in screen coordinates (north up)
    const vx = b => Math.sin(W.rad(b)), vy = b => -Math.cos(W.rad(b));
    const pts = [[0,0], [V*vx(H), V*vy(H)], [V*vx(H) + S*vx(D+180), V*vy(H) + S*vy(D+180)]];
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const w = Math.max(...xs) - Math.min(...xs) || 1, h = Math.max(...ys) - Math.min(...ys) || 1;
    const k = Math.min(260 / w, 170 / h, 1.6), ox = 170 - (Math.min(...xs) + w/2) * k, oy = 110 - (Math.min(...ys) + h/2) * k;
    const P = p => [ox + p[0]*k, oy + p[1]*k];
    const [a, b, c] = pts.map(P);
    pic.innerHTML = `<svg viewBox="0 0 340 230" role="img" aria-label="Wind triangle for these values">
      <rect class="fb" x="1" y="1" width="338" height="228" rx="6"/>
      <line x1="320" y1="40" x2="320" y2="14" class="ln" marker-end="url(#arr)"/><text class="tb" x="320" y="52" text-anchor="middle">N</text>
      ${W.arrow(a[0], a[1], b[0], b[1], "", 2.5)}
      ${S ? W.arrow(b[0], b[1], c[0], c[1], "pb", 2.5) : ""}
      ${W.arrow(a[0], a[1], c[0], c[1], "pa", 2.5)}
      <circle cx="${a[0]}" cy="${a[1]}" r="4" class="f-ink"/>
      <text class="t" x="${(a[0]+b[0])/2 + 6}" y="${(a[1]+b[1])/2 - 4}">heading ${W.hdg(H)}° / TAS</text>
      <text class="t" x="${(a[0]+c[0])/2 + 6}" y="${(a[1]+c[1])/2 + 14}">track ${W.hdg(T)}° / GS</text>
      ${S ? `<text class="t" x="${(b[0]+c[0])/2 + 6}" y="${(b[1]+c[1])/2}">wind</text>` : ""}
    </svg>`;
    out.innerHTML = W.outs([["Heading to fly", W.hdg(H) + "°", true], ["Drift", Math.abs(drift).toFixed(0) + "° " + (drift < -0.5 ? "right" : drift > 0.5 ? "left" : ""), false], ["Groundspeed", Math.round(gs) + " kt", true], ["Max drift (rule)", Math.round(S*60/V) + "°"]]);
    msg.textContent = S === 0 ? "No wind: heading equals track and groundspeed equals TAS." :
      `The wind is from the ${xw < 0 ? "left" : "right"} of track, so the aircraft drifts ${drift < 0 ? "right" : "left"} and you head ${Math.abs(drift).toFixed(0)}° into wind. ` +
      (gs < V ? `A headwind component cuts your groundspeed by ${Math.round(V - gs)} kt.` : `A tailwind component adds ${Math.round(gs - V)} kt.`);
  }
  draw();
};

WIDGETS.crosswind = root => {
  const pic = W.box("wsvg"), out = W.box(), msg = W.box("wmsg");
  const rw = W.slider("Runway", 1, 36, 1, 27, v => String(v).padStart(2, "0"), draw);
  const wd = W.slider("Wind from (magnetic)", 0, 350, 10, 300, v => W.hdg(v) + "°", draw);
