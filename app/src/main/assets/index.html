  const ctl = W.box("wgrid"); ctl.append(rw.el, wd.el, ws.el);
  root.append(ctl, pic, out, msg);
  function draw(){
    const R = rw.get() * 10, D = wd.get(), S = ws.get(), rel = ((D - R) % 360 + 540) % 360 - 180;
    const head = S * Math.cos(W.rad(rel)), cross = S * Math.sin(W.rad(rel));
    const cx = 170, cy = 115, r1 = 100, r2 = 34;
    const sx = cx + Math.sin(W.rad(rel)) * r1, sy = cy - Math.cos(W.rad(rel)) * r1, ex = cx + Math.sin(W.rad(rel)) * r2, ey = cy - Math.cos(W.rad(rel)) * r2;
    pic.innerHTML = `<svg viewBox="0 0 340 230" role="img" aria-label="Runway with the wind arrow">
      <rect class="fb" x="1" y="1" width="338" height="228" rx="6"/>
      <rect x="${cx-16}" y="20" width="32" height="190" rx="2" class="f-rw"/>
      <line x1="${cx}" y1="50" x2="${cx}" y2="180" class="mkl" stroke-dasharray="10 9"/>
      <text x="${cx}" y="200" text-anchor="middle" style="font:800 13px sans-serif;fill:var(--mk)">${String(rw.get()).padStart(2,"0")}</text>
      <text class="tm" x="${cx}" y="16" text-anchor="middle">landing direction ↑</text>
      ${S ? W.arrow(sx, sy, ex, ey, "pb", 3.5) : ""}
    </svg>`;
    out.innerHTML = W.outs([[head >= 0 ? "Headwind" : "Tailwind", Math.abs(head).toFixed(0) + " kt", head < 0], ["Crosswind", Math.abs(cross).toFixed(0) + " kt " + (Math.abs(cross) < 0.5 ? "" : cross > 0 ? "from right" : "from left"), true], ["Angle off runway", Math.abs(rel) + "°"]]);
    msg.className = "wmsg" + (head < 0 ? " warn" : "");
    msg.textContent = head < -0.5 ? "Tailwind: longer take-off and landing runs. Consider the other runway direction." :
      `Rule of thumb: at ${Math.abs(rel)}° off, crosswind is about ${Math.abs(rel) >= 60 ? "all" : Math.abs(rel) >= 45 ? "0.7" : Math.abs(rel) >= 30 ? "half" : Math.abs(rel) >= 15 ? "a quarter" : "almost none"} of the wind. Compare with your aircraft's maximum demonstrated crosswind in the POH.`;
  }
  draw();

const PHON = { A:"Alfa",B:"Bravo",C:"Charlie",D:"Delta",E:"Echo",F:"Foxtrot",G:"Golf",H:"Hotel",I:"India",J:"Juliett",K:"Kilo",L:"Lima",M:"Mike",N:"November",O:"Oscar",P:"Papa",Q:"Quebec",R:"Romeo",S:"Sierra",T:"Tango",U:"Uniform",V:"Victor",W:"Whiskey",X:"X-ray",Y:"Yankee",Z:"Zulu" };
const DIG = ["zero","one","two","tree","four","fife","six","seven","eight","niner"];
const sayDigits = s => String(s).split("").filter(c => /\d/.test(c)).map(c => DIG[+c]).join(" ");
WIDGETS.phonetic = root => {
  const inp = document.createElement("input"); inp.className = "wtext"; inp.value = "G-ABCD"; inp.setAttribute("aria-label", "Registration");
  const full = W.box("say"), abbr = W.box("say");
  root.append(W.box("wmsg", "Type a registration."), inp, full, abbr);
  function draw(){
    const r = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    const word = c => PHON[c] || (/\d/.test(c) ? DIG[+c] : c);
    full.innerHTML = `<small>In full (first call)</small>${W.esc(r.split("").map(word).join(" ") || "—")}`;
    abbr.innerHTML = `<small>Abbreviated (only after ATC abbreviates first)</small>${W.esc(r.length >= 3 ? [r[0], r.slice(-2)[0], r.slice(-1)].map(word).join(" ") : "—")}`;
  }
  inp.addEventListener("input", draw); draw();
};
WIDGETS.numbers = root => {
  const kinds = [["alt","Altitude"],["fl","Flight level"],["hdg","Heading"],["freq","Frequency"],["qnh","QNH"],["sq","Squawk"],["wind","Wind"]];
  const defaults = { alt:"2500", fl:"55", hdg:"080", freq:"126.700", qnh:"998", sq:"4521", wind:"240/12" };
  let kind = "alt";
  const pick = W.seg(kinds, kind, v => { kind = v; inp.value = defaults[v]; draw(); });
  const inp = document.createElement("input"); inp.className = "wtext"; inp.value = defaults[kind]; inp.setAttribute("aria-label", "Value");
  const say = W.box("say");
  root.append(pick.el, inp, say);
  function altitude(n){
    const th = Math.floor(n / 1000), hu = Math.floor((n % 1000) / 100), rest = n % 100;
    if(rest) return sayDigits(String(n)) + " feet";
    return [th ? sayDigits(String(th)) + " thousand" : "", hu ? DIG[hu] + " hundred" : ""].filter(Boolean).join(" ") + " feet";
  }
  function speak(){
    const v = inp.value.trim();
    if(kind === "alt"){ const n = parseInt(v.replace(/\D/g, ""), 10); return isNaN(n) ? "" : altitude(n); }
    if(kind === "fl") return "flight level " + sayDigits(v);
    if(kind === "hdg"){ const n = parseInt(v, 10); return isNaN(n) ? "" : "heading " + sayDigits(String(n % 360 || 360).padStart(3, "0")); }
    if(kind === "freq"){
      const f = parseFloat(v); if(isNaN(f)) return "";
      let s = f.toFixed(3); if(s.endsWith("00")) s = s.slice(0, -2);
      const [a, b] = s.split("."); return sayDigits(a) + " decimal " + sayDigits(b);
    }
    if(kind === "qnh"){ const n = parseInt(v, 10); return isNaN(n) ? "" : "QNH " + sayDigits(String(n)) + (n < 1000 ? " hectopascals" : ""); }
    if(kind === "sq") return "squawk " + sayDigits(v);
    if(kind === "wind"){ const m = v.match(/^(\d{1,3})\D+(\d{1,3})/); return m ? sayDigits(m[1].padStart(3, "0")) + " degrees, " + sayDigits(m[2]) + " knots" : ""; }
    return "";
  }
  function draw(){ const s = speak(); say.innerHTML = `<small>Say</small>${W.esc(s ? "“" + s + "”" : "Type a value")}`; }
  inp.addEventListener("input", draw); draw();
};

WIDGETS.asi = root => {
  const pic = W.box("wsvg"), out = W.box(), msg = W.box("wmsg");
  const v = W.slider("Indicated airspeed", 30, 160, 1, 70, x => x + " kt", draw);
  root.append(W.box("fine", "Example speeds for a light trainer, for illustration only. Use the figures in your aircraft's POH."), v.el, pic, out, msg);
  const A0 = 30, A1 = 160, ang = s => (-150 + (s - A0) / (A1 - A0) * 300) * Math.PI / 180;
  const pt = (s, r) => [150 + Math.sin(ang(s)) * r, 120 - Math.cos(ang(s)) * r];
  const arc = (s1, s2, r, cls, w) => { const [x1, y1] = pt(s1, r), [x2, y2] = pt(s2, r), large = (s2 - s1) / (A1 - A0) * 300 > 180 ? 1 : 0;
    return `<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${large} 1 ${x2.toFixed(1)},${y2.toFixed(1)}" style="fill:none;stroke:${cls};stroke-width:${w}"/>`; };
  function zone(s){
    const E = ASI_EX;
    if(s < E.vso) return ["Below the white arc", "Below the stall speed with full flap: the aircraft can't fly level here.", true];
    if(s < E.vs1) return ["White arc only", "Flap operating range, below the clean stall speed: only with flap down.", false];
    if(s <= E.vfe) return ["White and green arcs", "Flap may be used, and you are above the clean stall speed.", false];
    if(s <= E.vno) return ["Green arc", "Normal operating range. Flap must be up above Vfe.", false];
    if(s < E.vne) return ["Yellow arc", "Caution range: smooth air only, no large or abrupt control movements.", true];
    return ["Red line or above", "At or beyond the never exceed speed: structural failure is possible.", true];
  }
  function draw(){
    const s = v.get(), E = ASI_EX, [nx, ny] = pt(s, 78);
    pic.innerHTML = `<svg viewBox="0 0 300 240" role="img" aria-label="Airspeed indicator at ${s} knots">
      <circle cx="150" cy="120" r="108" class="f-ink"/><circle cx="150" cy="120" r="104" style="fill:#1a1f26"/>
      ${arc(E.vso, E.vfe, 94, "#f2f2f2", 7)}${arc(E.vs1, E.vno, 86, "#2db36a", 9)}${arc(E.vno, E.vne, 86, "#f2c230", 9)}
      ${(() => { const [a1, b1] = pt(E.vne, 78), [a2, b2] = pt(E.vne, 100); return `<line x1="${a1}" y1="${b1}" x2="${a2}" y2="${b2}" style="stroke:#e0442b;stroke-width:5"/>`; })()}
      ${[40,60,80,100,120,140,160].map(k => { const [a, b] = pt(k, 66); return `<text x="${a.toFixed(1)}" y="${(b + 4).toFixed(1)}" text-anchor="middle" style="font:700 12px sans-serif;fill:#f2f2f2">${k}</text>`; }).join("")}
      <line x1="150" y1="120" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" style="stroke:#ffffff;stroke-width:4;stroke-linecap:round"/>
      <circle cx="150" cy="120" r="7" style="fill:#f2f2f2"/>
      <text x="150" y="168" text-anchor="middle" style="font:700 10px sans-serif;fill:#c8c8c8">KNOTS</text>
    </svg>`;
    const [z, m, warn] = zone(s);
    out.innerHTML = W.outs([["Airspeed", s + " kt", true], ["You are in", z, warn]]);
    msg.className = "wmsg" + (warn ? " warn" : ""); msg.textContent = m;
  }
  draw();
};

WIDGETS.wb = root => {
  // Invented example aircraft and envelope, matching the worked example in the notes.
  const E = { bem:520, bemArm:0.85, seat:0.95, fuel:1.05, bag:1.60, mtom:760 };
  const fwd = m => m <= 650 ? 0.80 : 0.80 + (m - 650) / (760 - 650) * 0.04, aft = 0.95;
  const pic = W.box("wsvg"), out = W.box(), msg = W.box("wmsg");
  const seats = W.slider("Pilot and passenger", 60, 200, 5, 160, x => x + " kg", draw);
  const fuel = W.slider("Fuel at take-off", 0, 100, 5, 60, x => x + " L", draw);
  const bag = W.slider("Baggage (max 25 kg)", 0, 25, 1, 10, x => x + " kg", draw);
  const burn = W.slider("Fuel used on the flight", 0, 100, 5, 40, x => x + " L", draw);
  const ctl = W.box("wgrid"); ctl.append(seats.el, fuel.el, bag.el, burn.el);
  root.append(W.box("fine", "Invented example aircraft and envelope, for practice only. Use your aircraft's weight schedule and POH for real loading."), ctl, pic, out, msg);
  function calc(L){
    const f = L * 0.72, m = E.bem + seats.get() + f + bag.get();
    const mo = E.bem * E.bemArm + seats.get() * E.seat + f * E.fuel + bag.get() * E.bag;
    return { m, cg:mo / m, ok:m <= E.mtom && mo / m >= fwd(m) && mo / m <= aft };
  }
  function draw(){
    if(burn.get() > fuel.get()) burn.set(fuel.get());
    const to = calc(fuel.get()), ld = calc(fuel.get() - burn.get());
    const X = cg => 40 + (cg - 0.76) / (0.98 - 0.76) * 260, Y = m => 200 - (m - 560) / (800 - 560) * 170;
    const env = [[0.80, 560], [0.80, 650], [0.84, 760], [0.95, 760], [0.95, 560]].map(([c, m]) => `${X(c).toFixed(1)},${Y(m).toFixed(1)}`).join(" ");
    pic.innerHTML = `<svg viewBox="0 0 320 230" role="img" aria-label="CG envelope with take-off and landing points">
      <rect class="fb" x="1" y="1" width="318" height="228" rx="6"/>
      <polygon points="${env}" class="f-tint ln"/>
      ${[0.78, 0.82, 0.86, 0.90, 0.94, 0.98].map(c => `<text class="tm" x="${X(c)}" y="218" text-anchor="middle">${c.toFixed(2)}</text>`).join("")}
      ${[600, 650, 700, 750, 800].map(m => `<text class="tm" x="34" y="${Y(m) + 3}" text-anchor="end">${m}</text>`).join("")}
      <text class="tm" x="180" y="228" text-anchor="middle">CG (m aft of datum)</text>
      <line x1="${X(to.cg)}" y1="${Y(to.m)}" x2="${X(ld.cg)}" y2="${Y(ld.m)}" class="ln dash"/>
      <circle cx="${X(to.cg).toFixed(1)}" cy="${Y(to.m).toFixed(1)}" r="7" style="fill:${to.ok ? "var(--tick)" : "var(--emerg)"}"/>
      <circle cx="${X(ld.cg).toFixed(1)}" cy="${Y(ld.m).toFixed(1)}" r="6" style="fill:var(--card);stroke:${ld.ok ? "var(--tick)" : "var(--emerg)"};stroke-width:3"/>
      <text class="t" x="${X(to.cg) + 10}" y="${Y(to.m) - 8}">take-off</text><text class="t" x="${X(ld.cg) + 10}" y="${Y(ld.m) + 14}">landing</text>
    </svg>`;
    out.innerHTML = W.outs([["Take-off mass", Math.round(to.m) + " kg", to.m > E.mtom], ["Take-off CG", to.cg.toFixed(3) + " m", !to.ok], ["Landing mass", Math.round(ld.m) + " kg"], ["Landing CG", ld.cg.toFixed(3) + " m", !ld.ok]]);
    const why = r => r.m > E.mtom ? `over the ${E.mtom} kg maximum` : r.cg < fwd(r.m) ? "CG ahead of the forward limit" : r.cg > aft ? "CG behind the aft limit" : "within limits";
    msg.className = "wmsg" + (to.ok && ld.ok ? "" : " warn");
    msg.textContent = `Take-off: ${why(to)}. Landing: ${why(ld)}. ` + (to.ok && ld.ok ? "Both points are inside the envelope." : "Change the load or fuel until both points sit inside the envelope.");
  }
  draw();
};

WIDGETS.perf = root => {
  const FACT = [["dry","Dry grass",1.20,1.15],["wet","Wet grass",1.30,1.35],["slope","2% slope (uphill for take-off, downhill for landing)",1.10,1.10],["elev","1,000 ft elevation",1.10,1.05],["temp","10 °C warmer than the chart",1.10,1.05],["wt","10% heavier than the chart",1.20,1.10],["tail","Tailwind 10% of lift-off speed",1.20,1.20],["soft","Soft ground or snow",1.25,1.25]];
  let mode = "to", on = { dry:true }, safety = true;
  const out = W.box(), msg = W.box("wmsg");
  const m = W.seg([["to","Take-off"],["ldg","Landing"]], mode, x => { mode = x; draw(); });
  const book = W.slider("Distance from the POH chart", 200, 700, 10, 400, x => x + " m", draw);
  const avail = W.slider("Distance available (TODA or LDA)", 300, 1200, 10, 700, x => x + " m", draw);
  const chips = W.box("toggles");
  FACT.forEach(([k, lab]) => { const b = document.createElement("button"); b.type = "button"; b.className = "qchip tog" + (on[k] ? " on" : ""); b.textContent = lab;
    b.addEventListener("click", () => { on[k] = !on[k]; if(k === "dry" && on.dry) on.wet = false; if(k === "wet" && on.wet) on.dry = false; [...chips.children].forEach((c, i) => c.classList.toggle("on", !!on[FACT[i][0]])); draw(); }); chips.appendChild(b); });
  const sb = document.createElement("button"); sb.type = "button"; sb.className = "qchip tog on"; sb.textContent = "Add the CAA safety factor";
  sb.addEventListener("click", () => { safety = !safety; sb.classList.toggle("on", safety); draw(); });
  const ctl = W.box("wgrid"); ctl.append(book.el, avail.el);
  root.append(m.el, ctl, W.box("zlabel", "Conditions today"), chips, sb, out, msg);
  function draw(){
    const i = mode === "to" ? 2 : 3, used = FACT.filter(f => on[f[0]]);
    let mult = used.reduce((p, f) => p * f[i], 1);
    const sf = mode === "to" ? 1.33 : 1.43;
    if(safety) mult *= sf;
    const need = book.get() * mult, ok = need <= avail.get();
    out.innerHTML = W.outs([["Combined factor", "×" + mult.toFixed(2)], ["Distance needed", Math.round(need) + " m", true], ["Margin", (ok ? "+" : "") + Math.round(avail.get() - need) + " m", !ok]]);
    msg.className = "wmsg" + (ok ? "" : " warn");
    msg.textContent = `${book.get()} m × ${[...used.map(f => f[i].toFixed(2)), ...(safety ? [sf.toFixed(2)] : [])].join(" × ") || "1"} = ${Math.round(need)} m. ` + (ok ? "Fits the distance available." : "More than the distance available: don't go as planned.");
  }
  draw();
};

WIDGETS.densalt = root => {
  const out = W.box(), msg = W.box("wmsg");
  const el = W.slider("Aerodrome elevation", 0, 3000, 50, 300, x => x.toLocaleString("en-GB") + " ft", draw);
  const q = W.slider("QNH", 980, 1040, 1, 1003, x => x + " hPa", draw);
  const t = W.slider("Outside air temperature", -10, 40, 1, 28, x => x + " °C", draw);
  const ctl = W.box("wgrid"); ctl.append(el.el, q.el, t.el);
  root.append(ctl, out, msg);
  function draw(){
    const pa = el.get() + (1013 - q.get()) * 30, isa = 15 - 2 * pa / 1000, da = pa + 120 * (t.get() - isa);
    out.innerHTML = W.outs([["Pressure altitude", Math.round(pa).toLocaleString("en-GB") + " ft"], ["ISA temp there", isa.toFixed(0) + " °C"], ["Density altitude", Math.round(da / 10) * 10 + " ft", true]]);
    msg.className = "wmsg" + (da - el.get() > 2000 ? " warn" : "");
    msg.textContent = `The aircraft will perform as if it were at about ${Math.round(da / 100) * 100} ft, ${Math.round((da - el.get()) / 100) * 100} ft ${da >= el.get() ? "above" : "below"} the real elevation. Pressure altitude = ${el.get()} + (1013 − ${q.get()}) × 30. Density altitude ≈ pressure altitude + 120 × (OAT − ISA).`;
  }
  draw();
};

WIDGETS.fuelplan = root => {
  const out = W.box(), msg = W.box("wmsg");
  let res = 30;
  const trip = W.slider("Trip time", 15, 240, 5, 90, x => `${Math.floor(x/60)} h ${x%60} min`, draw);
  const ff = W.slider("Fuel flow", 15, 35, 1, 23, x => x + " L/h", draw);
  const taxi = W.slider("Taxi and run-up", 0, 10, 1, 3, x => x + " L", draw);
  const cont = W.slider("Contingency", 0, 20, 5, 10, x => x + "% of trip", draw);
  const alt = W.slider("Diversion to alternate", 0, 60, 5, 20, x => x + " min", draw);
  const have = W.slider("Usable fuel on board", 20, 150, 1, 85, x => x + " L", draw);
  const r = W.seg([[30,"VFR day: 30 min"],[45,"VFR night: 45 min"],[60,"Personal: 60 min"]], res, x => { res = x; draw(); });
  const ctl = W.box("wgrid"); ctl.append(trip.el, ff.el, taxi.el, cont.el, alt.el, have.el);
  root.append(ctl, W.box("zlabel", "Final reserve"), r.el, out, msg);
  function draw(){
    const f = ff.get(), t = f * trip.get() / 60, c = t * cont.get() / 100, a = f * alt.get() / 60, fr = f * res / 60, need = taxi.get() + t + c + a + fr, spare = have.get() - need;
    out.innerHTML = W.outs([["Trip", t.toFixed(1) + " L"], ["Contingency", c.toFixed(1) + " L"], ["Alternate", a.toFixed(1) + " L"], ["Final reserve", fr.toFixed(1) + " L"], ["Total needed", need.toFixed(1) + " L", true], ["Spare", (spare >= 0 ? "+" : "") + spare.toFixed(1) + " L", spare < 0]]);
    msg.className = "wmsg" + (spare < 0 ? " warn" : "");
    msg.textContent = spare < 0 ? `Short by ${(-spare).toFixed(1)} L. Add fuel (if mass and balance allow), shorten the route, or plan a fuel stop.` :
      `Enough, with ${spare.toFixed(1)} L spare: about ${Math.round(spare / f * 60)} min of extra flying on top of all the allowances.`;
  }
  draw();
};

WIDGETS.wake = root => {

  function draw(){

      ${w ? `<path d="M290,30 L240,30" class="ln" marker-end="url(#arr)"/><text class="tm" x="265" y="22" text-anchor="middle">wind ${w} kt</text>` : ""}
      <circle cx="${upX}" cy="96" r="13" class="ln pb" style="fill:none;stroke-width:3"/><text class="tm" x="${upX}" y="74" text-anchor="middle">upwind</text>

// =====================================================================
// Training and Exams sections
// Two tabs over the same SUBJECTS data. Training is the notes; Exams is
// practice by topic, a mock paper per subject and review of misses.
// Shares only the header, the settings sheet and the display mode with the
// checklist. Answers have their own storage key.
// =====================================================================
const Study = (() => {
  const SKEY = "ppl-study-v2", OLD_KEY = "ppl-air-law-v1";
  const PASS = 75, MOCK_N = 20;
  const view = $("studyView");
  let store = { ans:{} };
  let sess = null;

  // The nine CAA PPL(A) papers, in syllabus order. Subjects not yet written
  // show on the Training screen as "not added yet".
  const PAPERS = [
    ["010","Air Law"],["020","Aircraft General Knowledge"],["030","Flight Performance & Planning"],
    ["040","Human Performance"],["050","Meteorology"],["060","Navigation"],
    ["070","Operational Procedures"],["080","Principles of Flight"],["090","Communications"]
  ];

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const subjectByCode = code => SUBJECTS.find(s => s.code === code);
  const subjectById = id => SUBJECTS.find(s => s.id === id);
  const topicOf = (s, tid) => s.topics.find(t => t.id === tid);
  const qid = (s,t,i) => `${s.id}:${t.id}-${i+1}`;
  const ALLQ = [];
  SUBJECTS.forEach(s => s.topics.forEach(t => t.qs.forEach((q,i) => ALLQ.push({ id:qid(s,t,i), s, t, q }))));
  const byQ = {}; ALLQ.forEach(x => byQ[x.id] = x);
  const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  // ---------- storage ----------
  function load(){
    try{ const s = JSON.parse(localStorage.getItem(SKEY) || "null"); if(s && s.ans){ store = s; return; } }catch(e){}
    // First run after the update: carry Air Law answers across from the old key.
    try{
      const o = JSON.parse(localStorage.getItem(OLD_KEY) || "null");
      if(o && o.ans){
        Object.keys(o.ans).forEach(k => { if(byQ["airlaw:" + k]) store.ans["airlaw:" + k] = o.ans[k]; });
        save();
      }
    }catch(e){}
  }
  function save(){ try{ localStorage.setItem(SKEY, JSON.stringify(store)); }catch(e){} }
  function rec(id, ok){ const p = store.ans[id] || { n:0, c:0 }; store.ans[id] = { n:p.n+1, c:p.c+(ok?1:0), ok, t:Date.now() }; save(); }
  function reset(){ store = { ans:{} }; save(); try{ localStorage.removeItem(OLD_KEY); }catch(e){} }

  function stats(list){ let a=0, ok=0; list.forEach(x => { const r = store.ans[x.id]; if(r){ a++; if(r.ok) ok++; } }); return { a, ok, n:list.length }; }
  const qsOf = s => ALLQ.filter(x => x.s === s);
  const qsOfTopic = (s,t) => ALLQ.filter(x => x.s === s && x.t === t);
  const missedIn = list => list.filter(x => store.ans[x.id] && !store.ans[x.id].ok).map(x => x.id);

  // ---------- screen chrome ----------
  function enter(sec, kind){
    // kind: "top" | "sub" | "quiz"
    section = sec;
    home.hidden = true; phaseView.hidden = true; view.hidden = false;
    currentPhase = null;
    $("emergFab").hidden = true;
    hdr.classList.toggle("top", kind === "top");
    hdr.classList.toggle("insub", kind === "sub");
    hdr.classList.toggle("inphase", kind === "quiz");
    markTabs();
    window.scrollTo(0, 0);
  }
  function title(main, small){ hdrTitle.innerHTML = `${esc(main)}<small>${esc(small)}</small>`; }
  function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
  function btn(cls, html, fn, attrs){
    const b = el("button", cls, html);
    if(attrs) Object.entries(attrs).forEach(([k,v]) => b.setAttribute(k, v));
    b.addEventListener("click", fn);
    return b;
  }
  function card(num, ref, name, pct, count, done, fn, disabled){
    const b = btn("pbtn" + (done ? " done" : "") + (disabled ? " off" : ""),
      `<span class="pnum">${num}</span>`+
      `<span><span class="pref">${esc(ref)}</span><span class="pname" style="display:block">${esc(name)}</span></span>`+
      `<span class="pbar"><i style="width:${pct}%"></i></span>`+
      `<span class="pcount">${count}</span>`, fn, disabled ? { disabled:"" } : null);
    return b;
  }
  const push = st => { try{ history.pushState(st, ""); }catch(e){} };
  const replace = st => { try{ history.replaceState(st, ""); }catch(e){} };

  // ---------- TRAINING ----------
  function renderTrainingHome(){
    sess = null;
    enter("tr", "top");
    const built = PAPERS.filter(p => subjectByCode(p[0])).length;
    title("Training", `PPL theory notes · ${built} of 9 subjects`);
    view.innerHTML = "";
    view.appendChild(el("div", "caveat", "Study notes, not authoritative — check rules against current CAA publications"));
    view.appendChild(el("div", "grid-label", "Subjects"));
    const g = el("div", "grid");
    PAPERS.forEach(([code, name]) => {
      const s = subjectByCode(code);
      if(!s){ g.appendChild(card(code, "Paper " + code, name, 0, "Not added yet", false, () => {}, true)); return; }
      g.appendChild(card(code, `${s.topics.length} topics`, s.name, 0, "Read the notes ›", false, () => { push({ st:"trs", s:s.id }); renderTrainingSubject(s); }));
    });
    view.appendChild(g);
  }
  function renderTrainingSubject(s){
    sess = null;
    enter("tr", "sub");
    title(s.name, `Training · paper ${s.code}`);
    view.innerHTML = "";
    const w = el("div", "topic");
    w.appendChild(el("p", "lede", esc(s.blurb)));
    w.appendChild(el("div", "grid-label", "Topics"));
    const g = el("div", "grid");
    s.topics.forEach((t, idx) => {
      const st = stats(qsOfTopic(s,t));
      g.appendChild(card(String(idx+1).padStart(2,"0"), t.ref, t.title, Math.round(100*st.ok/st.n),
        st.a ? `${st.ok} / ${st.n} right` : `${st.n} questions`, st.ok === st.n,
        () => { push({ st:"trt", s:s.id, t:t.id }); renderTrainingTopic(s, t); }));
    });
    w.appendChild(g);
    w.appendChild(btn("bigbtn ghost", `Go to the ${s.name} exam ›`, () => { replace({ st:"exs", s:s.id }); renderExamSubject(s); }));
    view.appendChild(w);
  }
  function renderTrainingTopic(s, t){
    sess = null;
    enter("tr", "sub");
    title(t.title, `${s.name} · ${t.ref}`);
    view.innerHTML = "";
    const st = stats(qsOfTopic(s,t));
    const w = el("div", "topic");
    w.appendChild(el("p", "lede", esc(t.blurb)));
    const notes = el("div", "card", `<div class="learn">${t.learn()}</div>`);
    w.appendChild(notes);
    mountWidgets(notes);
    w.appendChild(btn("bigbtn", `Practise this topic · ${st.n} questions${st.a ? " (" + st.ok + " right so far)" : ""}`,
      () => start("topic", shuffle(qsOfTopic(s,t).map(x => x.id)), { s:s.id, t:t.id, from:"tr" }, false)));
    const i = s.topics.indexOf(t), nt = s.topics[i+1];
    if(nt) w.appendChild(btn("bigbtn ghost", `Next topic: ${esc(nt.title)} ›`, () => { replace({ st:"trt", s:s.id, t:nt.id }); renderTrainingTopic(s, nt); }));
    view.appendChild(w);
  }

  // ---------- EXAMS ----------
  function renderExamHome(){
    sess = null;
    enter("ex", "top");
    const all = stats(ALLQ);
    title("Exams", `Practice papers · pass mark ${PASS}%`);
    view.innerHTML = "";
    view.appendChild(el("div", "caveat", "Original practice questions — not the CAA question bank"));
    view.appendChild(el("div", "stat", all.a
      ? `<b>${all.a}</b> of ${all.n} questions tried · <b>${Math.round(100*all.ok/all.a)}%</b> right on last attempt`
      : `${all.n} questions across ${SUBJECTS.length} subjects · each mock is ${MOCK_N} questions`));
    const m = missedIn(ALLQ).length;
    view.appendChild(btn("bigbtn ghost", `Review all misses · ${m}`, () => start("review", shuffle(missedIn(ALLQ)), { from:"ex" }, false), m ? null : { disabled:"" }));
    view.appendChild(el("div", "grid-label", "Papers"));
    const g = el("div", "grid");
    PAPERS.forEach(([code, name]) => {
      const s = subjectByCode(code);
      if(!s) return;
      const st = stats(qsOf(s));
      const pct = st.a ? Math.round(100*st.ok/st.a) : 0;
      const ready = st.a === st.n && pct >= PASS;
      g.appendChild(card(code, st.a ? `${pct}% on ${st.a} tried` : `${st.n} questions`, s.name, Math.round(100*st.ok/st.n),
        ready ? "✓ Ready" : st.a ? `${st.ok} / ${st.n} right` : "Not started", ready,
        () => { push({ st:"exs", s:s.id }); renderExamSubject(s); }));
    });
    view.appendChild(g);
  }
  function renderExamSubject(s){
    sess = null;
    enter("ex", "sub");
    const qs = qsOf(s), st = stats(qs);
    title(s.name, `Exams · paper ${s.code}`);
    view.innerHTML = "";
    const w = el("div", "topic");
    w.appendChild(el("div", "stat", st.a
      ? `<b>${st.a}</b> of ${st.n} tried · <b>${Math.round(100*st.ok/st.a)}%</b> right on last attempt · pass mark ${PASS}%`
      : `${st.n} questions · pass mark ${PASS}%`));
    const row = el("div", "row2");
    const n = Math.min(MOCK_N, qs.filter(x => typeOf(x.q) === "mc").length);
    row.appendChild(btn("cont", `<span class="ct"><span class="k">Mock paper</span><div class="n">${n} random ${esc(s.name)} questions</div><div class="x">Multiple choice, like the real paper · marked at the end against ${PASS}%</div></span><span class="arrow">›</span>`,
      () => start("mock", shuffle(qs.filter(x => typeOf(x.q) === "mc").map(x => x.id)).slice(0, n), { s:s.id, from:"ex" }, false)));
    const m = missedIn(qs).length;
    row.appendChild(btn("bigbtn ghost", `Review misses · ${m}`, () => start("review", shuffle(missedIn(qs)), { s:s.id, from:"ex" }, false), m ? null : { disabled:"" }));
    w.appendChild(row);
    w.appendChild(el("div", "grid-label", "Practise by topic"));
    const g = el("div", "grid");
    s.topics.forEach((t, idx) => {
      const ts = stats(qsOfTopic(s,t));
      g.appendChild(card(String(idx+1).padStart(2,"0"), t.ref, t.title, Math.round(100*ts.ok/ts.n),
        ts.ok === ts.n ? "✓ All right" : ts.a ? `${ts.ok} / ${ts.n} right` : `${ts.n} questions`, ts.ok === ts.n,
        () => start("topic", shuffle(qsOfTopic(s,t).map(x => x.id)), { s:s.id, t:t.id, from:"ex" }, false)));
    });
    w.appendChild(g);
    w.appendChild(btn("bigbtn ghost", `Read the ${s.name} notes ›`, () => { replace({ st:"trs", s:s.id }); renderTrainingSubject(s); }));
    view.appendChild(w);
  }

  // ---------- questions ----------
  // Question types: multiple choice (default, o: answers with the correct one first),
  // "calc" (typed number; fixed a/tol/unit/steps or gen() returning fresh numbers each time),
  // "order" (items listed in the correct order) and "match" (pairs [left, right]).
  const typeOf = q => q.type || "mc";
  function start(kind, ids, ctx, replaceEntry){
    if(kind === "mock") ids = ids.filter(id => typeOf(byQ[id].q) === "mc");   // mocks mirror the real multiple-choice paper
    if(!ids.length) return;
    sess = { kind, ids, i:0, log:[], cur:null, ctx };
    nextQ();
    (replaceEntry ? replace : push)({ st:"q" });
    renderQ();
  }
  function nextQ(){
    const id = sess.ids[sess.i], q = byQ[id].q, type = typeOf(q);
    const cur = { id, type, done:false, ok:false };
    if(type === "mc"){ cur.text = q.q; cur.opts = shuffle(q.o.map((t,i) => ({ t, ok:i === 0 }))); cur.picked = null; cur.e = q.e; }
    if(type === "calc"){ const g = q.gen ? q.gen() : q; Object.assign(cur, { text:g.q, a:g.a, tol:g.tol || 0, unit:g.unit || "", steps:g.steps || [], e:g.e || q.e || "", neg:!!(g.neg || q.neg), val:"" }); }
    if(type === "order"){ cur.text = q.q; cur.items = q.items; cur.pool = shuffle(q.items.map((t,i) => i)); while(cur.pool.length > 1 && cur.pool.every((v,i) => v === i)) cur.pool = shuffle(cur.pool); cur.seq = []; cur.e = q.e; }
    if(type === "match"){ cur.text = q.q; cur.pairs = q.pairs; cur.right = shuffle(q.pairs.map((p,i) => i)); cur.sel = null; cur.map = {}; cur.e = q.e; }
    sess.cur = cur;
  }
  function sessLabel(){
    const s = sess.ctx.s && subjectById(sess.ctx.s);
    if(sess.kind === "mock") return `${s.name} mock`;
    if(sess.kind === "review") return s ? `${s.name} misses` : "All misses";
    return topicOf(s, sess.ctx.t).title;
  }
  const fmt = n => (Math.round(n * 100) / 100).toLocaleString("en-GB");
  function renderQ(){
    enter(sess.ctx.from, "quiz");
    const cur = sess.cur, x = byQ[cur.id];
    const tag = { mc:"", calc:"Work it out", order:"Put in order", match:"Match the pairs" }[cur.type];
    title(sessLabel(), `Question ${sess.i+1} of ${sess.ids.length}` + (sess.ctx.s ? "" : ` · ${x.s.name}`));
    hprogBar.style.width = (sess.i / sess.ids.length * 100) + "%";
    view.innerHTML = "";
    const w = el("div", "quiz");
    if(tag) w.appendChild(el("div", "qtag", tag));
    const q = el("p", "qtext"); q.textContent = cur.text; w.appendChild(q);
    ({ mc:drawMC, calc:drawCalc, order:drawOrder, match:drawMatch })[cur.type](w, cur);
    if(cur.done && sess.kind !== "mock"){
      const e = el("div", "expl " + (cur.ok ? "good" : "bad"), `<span class="v">${cur.ok ? "Correct" : "Not quite"}</span>`);
      if(cur.type === "calc"){
        e.innerHTML += `<div class="ans">Answer: <b>${fmt(cur.a)}${esc(cur.unit)}</b>${cur.tol ? ` <span class="tolnote">(within ${fmt(cur.tol)}${esc(cur.unit)} accepted)</span>` : ""}</div>`;
        if(cur.steps.length) e.innerHTML += `<ol class="steps">${cur.steps.map(st => `<li>${esc(st)}</li>`).join("")}</ol>`;
      }
      if(cur.e) e.appendChild(el("div", "", esc(cur.e)));
      e.setAttribute("role", "status");
      w.appendChild(e);
      w.appendChild(btn("bigbtn", sess.i >= sess.ids.length - 1 ? "See results ›" : "Next question ›", advance));
      setTimeout(() => e.scrollIntoView({ behavior:"smooth", block:"nearest" }), 0);
    }
    view.appendChild(w);
  }
  function finish(ok, yours, correct){
    const cur = sess.cur;
    cur.done = true; cur.ok = ok;
    sess.log.push({ id:cur.id, ok, text:cur.text, yours, correct, why:[cur.type === "calc" && cur.steps.length ? cur.steps.join(" ") : "", cur.e].filter(Boolean).join(" ") });
    rec(cur.id, ok);
    buzz();
    if(sess.kind === "mock") advance(); else renderQ();
  }

  // multiple choice
  function drawMC(w, cur){
    const opts = el("div", "opts");
    const shown = cur.done && sess.kind !== "mock";
    cur.opts.forEach((o,k) => {
      let cls = "opt";
      if(shown){ if(o.ok) cls += " ok"; else if(k === cur.picked) cls += " no"; }
      opts.appendChild(btn(cls, `<span class="l">${"ABCD"[k]}</span><span class="ot">${esc(o.t)}</span>`, () => {
        if(cur.done) return;
        cur.picked = k;
        finish(o.ok, o.t, cur.opts.find(z => z.ok).t);
      }, shown ? { disabled:"" } : null));
    });
    w.appendChild(opts);
  }

  // typed calculation
  function drawCalc(w, cur){
    const row = el("div", "calcrow");
    const inp = document.createElement("input");
    inp.type = "text"; inp.inputMode = cur.neg ? "text" : "decimal"; inp.id = "calcIn"; inp.className = "calcin";
    inp.setAttribute("aria-label", "Your answer"); inp.autocomplete = "off"; inp.value = cur.val;
    if(cur.done){ inp.disabled = true; row.classList.add(cur.ok ? "ok" : "no"); }
    row.appendChild(inp);
    if(cur.unit) row.appendChild(el("span", "unit", esc(cur.unit.trim())));
    w.appendChild(row);
    if(cur.done) return;
    const msg = el("div", "calcmsg");
    const go = () => {
      const v = parseFloat(String(inp.value).replace(/[\u2212\u2013]/g, "-").replace(/,/g, "").replace(/[^0-9.\-]/g, ""));
      if(isNaN(v)){ msg.textContent = "Type a number first."; return; }
      cur.val = inp.value;
      finish(Math.abs(v - cur.a) <= cur.tol + 1e-9, fmt(v) + cur.unit, fmt(cur.a) + cur.unit);
    };
    inp.addEventListener("keydown", e => { if(e.key === "Enter") go(); });
    w.appendChild(msg);
    w.appendChild(btn("bigbtn", "Check answer", go));
    setTimeout(() => { try{ inp.focus({ preventScroll:true }); }catch(e){} }, 50);
  }

  // put in order: tap items from the pool to build the sequence
  function drawOrder(w, cur){
    const ans = el("ol", "seq");
    const shown = cur.done && sess.kind !== "mock";
    cur.seq.forEach((idx, pos) => {
      const li = el("li");
      const b = btn("chip placed" + (shown ? (idx === pos ? " ok" : " no") : ""), `<span class="cn">${pos+1}</span><span>${esc(cur.items[idx])}</span>`,
        () => { if(cur.done) return; cur.seq.splice(pos, 1); cur.pool.push(idx); renderQ(); }, shown ? { disabled:"" } : null);
      li.appendChild(b); ans.appendChild(li);
    });
    for(let k = cur.seq.length; k < cur.items.length; k++) ans.appendChild(el("li", "slot", `<span class="cn">${k+1}</span>`));
    w.appendChild(el("div", "zlabel", cur.done ? "Your order" : "Your order · tap an item to send it back"));
    w.appendChild(ans);
    if(shown && !cur.ok){
      w.appendChild(el("div", "zlabel", "Correct order"));
      w.appendChild(el("ol", "seq right", cur.items.map((t,i) => `<li><span class="chip ok"><span class="cn">${i+1}</span><span>${esc(t)}</span></span></li>`).join("")));
    }
    if(cur.done) return;
    w.appendChild(el("div", "zlabel", "Tap in order"));
    const pool = el("div", "pool");
    cur.pool.forEach((idx, k) => pool.appendChild(btn("chip", esc(cur.items[idx]), () => { cur.pool.splice(k, 1); cur.seq.push(idx); renderQ(); })));
    w.appendChild(pool);
    const full = cur.seq.length === cur.items.length;
    w.appendChild(btn("bigbtn", full ? "Check order" : `Place all ${cur.items.length} items`, () => {
      const ok = cur.seq.every((v,i) => v === i);
      finish(ok, cur.seq.map(i => cur.items[i]).join(" → "), cur.items.join(" → "));
    }, full ? null : { disabled:"" }));
  }

  // match: tap a numbered item, then the answer that goes with it
  function drawMatch(w, cur){
    const shown = cur.done && sess.kind !== "mock";
    if(!cur.done && cur.sel == null && Object.keys(cur.map).length < cur.pairs.length) cur.sel = cur.pairs.findIndex((p,i) => cur.map[i] == null);
    const used = {}; Object.entries(cur.map).forEach(([l, r]) => used[r] = +l);
    w.appendChild(el("div", "zlabel", cur.done ? "Your pairs" : "Tap a numbered item, then its match"));
    const L = el("div", "mcol");
    cur.pairs.forEach((p, i) => {
      const paired = cur.map[i] != null;
      let cls = "chip left" + (cur.sel === i ? " sel" : "") + (paired ? " paired" : "");
      if(shown) cls += cur.map[i] === i ? " ok" : " no";
      L.appendChild(btn(cls, `<span class="cn">${i+1}</span><span>${esc(p[0])}</span>` + (shown && cur.map[i] !== i ? `<span class="fix">→ ${esc(p[1])}</span>` : ""),
        () => { if(cur.done) return; if(paired){ delete cur.map[i]; cur.sel = i; } else cur.sel = cur.sel === i ? null : i; renderQ(); }, shown ? { disabled:"" } : null));
    });
    w.appendChild(L);
    const R = el("div", "mcol right");
    cur.right.forEach(ri => {
      const owner = used[ri];
      let cls = "chip" + (owner != null ? " paired" : "");
      R.appendChild(btn(cls, (owner != null ? `<span class="cn">${owner+1}</span>` : `<span class="cn empty"></span>`) + `<span>${esc(cur.pairs[ri][1])}</span>`, () => {
        if(cur.done) return;
        if(owner != null){ delete cur.map[owner]; renderQ(); return; }
        if(cur.sel == null){ return; }
        cur.map[cur.sel] = ri;
        const next = cur.pairs.findIndex((p,i) => cur.map[i] == null);
        cur.sel = next >= 0 ? next : null;
        renderQ();
      }, shown ? { disabled:"" } : null));
    });
    w.appendChild(R);
    if(cur.done) return;
    const full = Object.keys(cur.map).length === cur.pairs.length;
    w.appendChild(btn("bigbtn", full ? "Check pairs" : `Pair all ${cur.pairs.length} items`, () => {
      const ok = cur.pairs.every((p,i) => cur.map[i] === i);
      finish(ok, cur.pairs.map((p,i) => `${p[0]} → ${cur.pairs[cur.map[i]][1]}`).join("; "), cur.pairs.map(p => `${p[0]} → ${p[1]}`).join("; "));
    }, full ? null : { disabled:"" }));
  }

  function advance(){
    sess.i++;
    if(sess.i >= sess.ids.length){ replace({ st:"res" }); renderResult(); }
    else { nextQ(); renderQ(); }
  }

  // ---------- results ----------
  function renderResult(){
    enter(sess.ctx.from, "sub");
    const n = sess.log.length, right = sess.log.filter(l => l.ok).length;
    const pct = n ? Math.round(100 * right / n) : 0;
    title(sessLabel(), "Results");
    view.innerHTML = "";
    const w = el("div", "quiz");
    w.appendChild(el("div", "score", `<span class="n">${right}/${n}</span><span class="p">${pct}%</span>` +
      (sess.kind === "mock" ? `<span class="pill ${pct >= PASS ? "good" : "bad"}">${pct >= PASS ? "Above" : "Below"} the ${PASS}% pass mark</span>` : "")));
    const wrong = sess.log.filter(l => !l.ok);
    w.appendChild(label(wrong.length ? "Missed, with the reasoning" : "Every question right", !!wrong.length));
    wrong.forEach(l => {
      w.appendChild(el("div", "miss",
        `<div class="mq">${esc(l.text)}</div>`+
        `<div class="ma y"><b>You said</b>${esc(l.yours)}</div>`+
        `<div class="ma c"><b>Correct</b>${esc(l.correct)}</div>`+
        (l.why ? `<div class="why">${esc(l.why)}</div>` : "")));
    });
    const ctx = sess.ctx;
    if(wrong.length) w.appendChild(btn("bigbtn", `Retry the ${wrong.length} missed`, () => start("review", shuffle(wrong.map(l => l.id)), { s:ctx.s, from:ctx.from }, true)));
    if(sess.kind === "mock"){
      const s = subjectById(ctx.s), qs = qsOf(s).filter(x => typeOf(x.q) === "mc");
      w.appendChild(btn("bigbtn" + (wrong.length ? " ghost" : ""), "Another mock paper",
        () => start("mock", shuffle(qs.map(x => x.id)).slice(0, Math.min(MOCK_N, qs.length)), ctx, true)));
    }
    w.appendChild(btn("bigbtn ghost", "Done", back));
    view.appendChild(w);
  }

  // ---------- navigation ----------
  function back(){
    const s = history.state && history.state.st;
    if(s && s !== "tr" && s !== "ex"){ try{ history.back(); return; }catch(e){} }
    section === "ex" ? renderExamHome() : renderTrainingHome();
  }
  // Called from popstate with a study history entry
  function fromState(st){
    const s = st.s && subjectById(st.s);
    if(st.st === "trs" && s) return renderTrainingSubject(s);
    if(st.st === "trt" && s && topicOf(s, st.t)) return renderTrainingTopic(s, topicOf(s, st.t));
    if(st.st === "exs" && s) return renderExamSubject(s);
    if(st.st === "q" && sess) return renderQ();
    if(st.st === "res" && sess) return renderResult();
    if(st.st === "ex") return renderExamHome();
    renderTrainingHome();
  }
  function showTraining(){ replace({ st:"tr" }); renderTrainingHome(); }
  function showExams(){ replace({ st:"ex" }); renderExamHome(); }

  load();
  function openTopic(sid, tid){
    const s = subjectById(sid), t = s && topicOf(s, tid);
    if(!t) return;
    push({ st:"trt", s:sid, t:tid }); renderTrainingTopic(s, t);
  }
  return { showTraining, showExams, fromState, back, reset, openTopic };
})();


// =====================================================================
// Logbook: flights, totals against the PPL minimums, lesson cards with
// flashcards for each exercise, and backup / restore of all app data.
// Renders into the same #studyView container as Training and Exams.
// =====================================================================
const Logbook = (() => {
  const LKEY = "ppl-log-v1";
  const BACKUP_KEYS = ["c150cl.prefs", "ppl-study-v2", LKEY];
  const view = $("studyView");
  let log = { v:1, flights:[] };
  let pendingImport = null;

  // Current UK PPL(A) minimums as published by the CAA (check with your school)
  const REQS = [
    { k:"total", label:"Flight instruction", need:40*60, note:"40 h, or 35 h on an approved ATO course" },
    { k:"solo", label:"Supervised solo", need:10*60, note:"10 h" },
    { k:"soloxc", label:"Solo cross-country", need:5*60, note:"at least 5 h of the solo time" },
    { k:"qxc", label:"Qualifying cross-country", need:1, note:"150 nm, full-stop landings at 2 other aerodromes" }
  ];

  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
  const hm = m => `${Math.floor(m/60)}:${String(Math.round(m%60)).padStart(2, "0")}`;
  const lessonById = id => LESSONS.find(l => l.id === id);
  const today = () => new Date().toISOString().slice(0, 10);
  const fmtDate = d => { try{ return new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" }); }catch(e){ return d; } };
  const newId = () => "f" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  function el(tag, cls, html){ const e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
  function btn(cls, html, fn, attrs){ const b = el("button", cls, html); b.type = "button"; if(attrs) Object.entries(attrs).forEach(([k,v]) => b.setAttribute(k, v)); b.addEventListener("click", fn); return b; }
  const push = st => { try{ history.pushState(st, ""); }catch(e){} };
  const replace = st => { try{ history.replaceState(st, ""); }catch(e){} };
  function title(main, small){ hdrTitle.innerHTML = `${esc(main)}<small>${esc(small)}</small>`; }
  function enter(kind){
    section = "lg";
    home.hidden = true; phaseView.hidden = true; view.hidden = false;
    currentPhase = null;
    $("emergFab").hidden = true;
    hdr.classList.toggle("top", kind === "top");
    hdr.classList.toggle("insub", kind === "sub");
    hdr.classList.remove("inphase");
    markTabs();
    window.scrollTo(0, 0);
  }

  // ---------- storage ----------
  function load(){ try{ const s = JSON.parse(localStorage.getItem(LKEY) || "null"); if(s && Array.isArray(s.flights)) log = s; }catch(e){} }
  function save(){ try{ localStorage.setItem(LKEY, JSON.stringify(log)); }catch(e){} }
  const sorted = () => log.flights.slice().sort((a,b) => (b.date + (b.dep || "")).localeCompare(a.date + (a.dep || "")));
  function clean(f){
    const s = v => typeof v === "string" ? v.slice(0, 2000) : "";
    return {
      id: s(f.id) || newId(), date: /^\d{4}-\d{2}-\d{2}$/.test(f.date) ? f.date : today(),
      type: s(f.type), reg: s(f.reg).toUpperCase(), pic: s(f.pic),
      cap: ["Dual", "Solo", "PIC"].includes(f.cap) ? f.cap : "Dual",
      from: s(f.from), to: s(f.to), dep: s(f.dep), arr: s(f.arr),
      mins: Math.max(0, Math.min(24*60, Math.round(+f.mins || 0))), ldg: Math.max(0, Math.min(99, Math.round(+f.ldg || 0))),
      xc: !!f.xc, qxc: !!f.qxc, ex: Array.isArray(f.ex) ? f.ex.filter(x => lessonById(x)) : [],
      remarks: s(f.remarks), well: s(f.well), work: s(f.work), instr: s(f.instr)
    };
  }

  // ---------- totals ----------
  function totals(){
    const t = { total:0, dual:0, solo:0, soloxc:0, pic:0, ldg:0, qxc:0, n:log.flights.length };
    log.flights.forEach(f => {
      t.total += f.mins; t.ldg += f.ldg;
      if(f.cap === "Dual") t.dual += f.mins;
      if(f.cap === "Solo"){ t.solo += f.mins; if(f.xc) t.soloxc += f.mins; if(f.qxc) t.qxc = 1; }
      if(f.cap === "PIC") t.pic += f.mins;
    });
    return t;
  }
  function exCounts(){ const c = {}; log.flights.forEach(f => f.ex.forEach(x => c[x] = (c[x] || 0) + 1)); return c; }

  // ---------- home ----------
  function renderHome(){
    enter("top");
    const t = totals();
    title("Logbook", t.n ? `${t.n} flight${t.n === 1 ? "" : "s"} · ${hm(t.total)} total` : "Your flights and lesson cards");
    view.innerHTML = "";
    const w = el("div", "topic");
    w.appendChild(btn("cont", `<span class="ct"><span class="k">New entry</span><div class="n">Log a flight</div><div class="x">Times, exercises flown and your debrief</div></span><span class="arrow">+</span>`, () => { push({ lg:"form" }); renderForm(null); }));
    if(!t.n){
      w.appendChild(el("div", "card empty", `<h3>No flights logged yet</h3><p>Log each lesson as you fly it, or bring your existing paper logbook in with <b>Backup and import</b>. Every exercise has a lesson card with the main points and flashcards, so you can start with those now.</p>`));
    } else {
      w.appendChild(el("div", "wout lgtiles", [
        ["Total", hm(t.total), true], ["Dual", hm(t.dual)], ["Solo", hm(t.solo)], ["Solo XC", hm(t.soloxc)], ["Landings", String(t.ldg)], ["Flights", String(t.n)]
      ].map(([k,v,hl]) => `<div class="o${hl ? " hl" : ""}"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("")));
      // PPL minimums
      w.appendChild(el("div", "grid-label", "Towards the PPL minimums"));
      const rq = el("div", "reqs");
      REQS.forEach(r => {
        const have = t[r.k], pct = Math.min(100, Math.round(100 * have / r.need)), done = have >= r.need;
        rq.appendChild(el("div", "req" + (done ? " done" : ""),
          `<div class="rq1"><b>${r.label}</b><span>${r.k === "qxc" ? (done ? "✓ Flown" : "Not yet") : `${hm(have)} / ${hm(r.need)}`}</span></div>`+
          `<div class="pbar"><i style="width:${pct}%"></i></div><div class="rq2">${r.note}</div>`));
      });
      w.appendChild(rq);
      w.appendChild(el("div", "fine", "Minimums as published by the CAA for the PPL(A). Your school's records are the official ones."));
      // hours by month
      w.appendChild(el("div", "grid-label", "Hours by month"));
      w.appendChild(monthChart());
    }
    // exercises
    w.appendChild(el("div", "grid-label", "Lesson cards"));
    const counts = exCounts(), xg = el("div", "xgrid");
    LESSONS.forEach(l => xg.appendChild(btn("xcard" + (counts[l.id] ? " flown" : ""),
      `<span class="xn">${esc(l.id)}</span><span class="xt">${esc(l.title)}</span><span class="xc">${counts[l.id] ? `Flown ×${counts[l.id]}` : `${(FLASH[l.id] || []).length} card${(FLASH[l.id] || []).length === 1 ? "" : "s"}`}</span>`,
      () => { push({ lg:"lesson", ex:l.id }); renderLesson(l); })));
    w.appendChild(xg);
    // flights
    if(t.n){
      w.appendChild(el("div", "grid-label", "Flights"));
      const list = el("div", "flist");
      sorted().forEach(f => list.appendChild(flightCard(f)));
      w.appendChild(list);
    }
    w.appendChild(btn("bigbtn ghost", "Backup and import", () => { push({ lg:"backup" }); renderBackup(); }));
    view.appendChild(w);
  }
  function flightCard(f){
    return btn("fcard",
      `<span class="fdate">${esc(fmtDate(f.date))}</span>`+
      `<span class="fmain"><b>${esc(f.from || "—")}${f.to && f.to !== f.from ? " → " + esc(f.to) : ""}</b><span>${esc(f.reg)} ${esc(f.type)}</span></span>`+
      `<span class="fside"><span class="fpill ${f.cap.toLowerCase()}">${f.cap}</span><b>${hm(f.mins)}</b></span>`+
      (f.ex.length ? `<span class="fex">${f.ex.map(x => `<i>Ex ${esc(x)}</i>`).join("")}</span>` : ""),
      () => { push({ lg:"flight", id:f.id }); renderFlight(f); });
  }
  function monthChart(){
    const now = new Date(), months = [];
    for(let i = 11; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ key:d.toISOString().slice(0, 7), lab:d.toLocaleDateString("en-GB", { month:"narrow" }), m:0 }); }
    log.flights.forEach(f => { const mo = months.find(x => x.key === f.date.slice(0, 7)); if(mo) mo.m += f.mins; });
    const max = Math.max(60, ...months.map(x => x.m)), W = 340, bw = 22, gap = (W - 30 - 12 * bw) / 11;
    const svg = `<svg viewBox="0 0 ${W} 150" role="img" aria-label="Hours flown each month for the last 12 months">
      <rect class="fb" x="1" y="1" width="${W-2}" height="148" rx="6"/>
      ${months.map((x, i) => { const h = Math.round(x.m / max * 96), X = 15 + i * (bw + gap);
        return `<rect x="${X.toFixed(1)}" y="${118 - h}" width="${bw}" height="${h}" rx="3" class="${i === 11 ? "f-mag" : "f-tint"} ln" style="stroke-width:${h ? 1 : 0}"/>`+
          (x.m ? `<text class="tm" x="${(X + bw/2).toFixed(1)}" y="${112 - h}" text-anchor="middle">${(x.m/60).toFixed(1)}</text>` : "")+
          `<text class="tm" x="${(X + bw/2).toFixed(1)}" y="136" text-anchor="middle">${x.lab}</text>`; }).join("")}
    </svg>`;
    return el("div", "fig wsvg", svg);
  }

  // ---------- one flight ----------
  function renderFlight(f){
    enter("sub");
    title(fmtDate(f.date), `${f.reg} · ${f.cap} · ${hm(f.mins)}`);
    view.innerHTML = "";
    const w = el("div", "topic");
    w.appendChild(el("div", "card", `<div class="fdet">`+
      [["Aircraft", `${f.reg} ${f.type}`], ["Pilot in command", f.pic], ["Capacity", f.cap], ["From", f.from], ["To", f.to],
       ["Departure", f.dep], ["Arrival", f.arr], ["Flight time", hm(f.mins)], ["Landings", f.ldg],
       ["Cross-country", f.xc ? (f.qxc ? "Yes, qualifying" : "Yes") : "No"]]
        .filter(r => r[1] !== "" && r[1] != null).map(([k,v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join("") + `</div>` +
      (f.remarks ? `<p class="frem">${esc(f.remarks)}</p>` : "")));
    if(f.ex.length){
      w.appendChild(el("div", "grid-label", "Lesson cards for this flight"));
      f.ex.forEach(x => { const l = lessonById(x);
        w.appendChild(btn("lcard", `<span class="xn">Ex ${esc(l.id)}</span><b>${esc(l.title)}</b><ul>${l.points.slice(0, 3).map(p => `<li>${esc(p)}</li>`).join("")}</ul><span class="more">Open the card and flashcards ›</span>`,
          () => { push({ lg:"lesson", ex:l.id }); renderLesson(l); })); });
    }
    // debrief: saved as you type
    w.appendChild(el("div", "grid-label", "Your debrief"));
    const deb = el("div", "card debrief");
    [["well", "What went well"], ["work", "What to work on"], ["instr", "Instructor's comments"]].forEach(([k, lab]) => {
      const id = `deb-${k}`;
      const box = el("div", "dfield", `<label for="${id}">${lab}</label>`);
      const ta = document.createElement("textarea"); ta.id = id; ta.rows = 3; ta.value = f[k] || ""; ta.className = "wtext";
      let t = null;
      ta.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => { f[k] = ta.value; save(); }, 400); });
      ta.addEventListener("blur", () => { f[k] = ta.value; save(); });
      box.appendChild(ta); deb.appendChild(box);
    });
    deb.appendChild(el("div", "fine", "Saved as you type."));
    w.appendChild(deb);
    const row = el("div", "row2");
    row.appendChild(btn("bigbtn", "Edit flight", () => { push({ lg:"form", id:f.id }); renderForm(f); }));
    row.appendChild(armedButton("resetbtn", "Delete flight", "Tap again to delete", () => {
      log.flights = log.flights.filter(x => x.id !== f.id); save(); toast("Flight deleted"); back();
    }));
    w.appendChild(row);
    view.appendChild(w);
  }

  // ---------- lesson card ----------
  function renderLesson(l){
    enter("sub");
    title(`Ex ${l.id} · ${l.title}`, "Lesson card");
    view.innerHTML = "";
    const w = el("div", "topic");
    w.appendChild(el("div", "card", `<div class="learn">`+
      `<h3>Main points</h3><ul>${l.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>`+
      (l.watch.length ? `<div class="box trap"><b>Watch for</b>${l.watch.map(esc).join(" ")}</div>` : "")+
      `<p class="fine">General study notes. Your school's briefing, your instructor and the POH come first.</p></div>`));
    const cards = FLASH[l.id] || [];
    if(cards.length){
      w.appendChild(el("div", "grid-label", `Flashcards · ${cards.length}`));
      w.appendChild(flashDeck(cards));
    }
    const links = el("div", "links");
    l.topics.forEach(([sid, tid]) => {
      const s = SUBJECTS.find(x => x.id === sid), t = s && s.topics.find(x => x.id === tid);
      if(t) links.appendChild(btn("chip", `<span class="cn">${esc(s.code)}</span><span>${esc(t.title)}</span>`, () => Study.openTopic(sid, tid)));
    });
    l.checks.forEach(id => { const ph = byId(id);
      if(ph) links.appendChild(btn("chip" + (ph.emerg ? " emerg" : ""), `<span class="cn">✓</span><span>${esc(ph.title)}</span>`, () => openPhase(ph))); });
    if(links.children.length){ w.appendChild(el("div", "grid-label", "Read up and check")); w.appendChild(links); }
    // flights with this exercise, and what you noted
    const mine = sorted().filter(f => f.ex.includes(l.id));
    if(mine.length){
      w.appendChild(el("div", "grid-label", `Your flights · ${mine.length}`));
      const notes = mine.filter(f => f.well || f.work || f.instr);
      if(notes.length) w.appendChild(el("div", "card notes", notes.map(f =>
        `<div class="note1"><span class="fdate">${esc(fmtDate(f.date))}</span>`+
        (f.work ? `<p><b>Work on:</b> ${esc(f.work)}</p>` : "") + (f.well ? `<p><b>Went well:</b> ${esc(f.well)}</p>` : "") + (f.instr ? `<p><b>Instructor:</b> ${esc(f.instr)}</p>` : "") + `</div>`).join("")));
      const list = el("div", "flist"); mine.forEach(f => list.appendChild(flightCard(f))); w.appendChild(list);
    }
    view.appendChild(w);
  }
  function flashDeck(cards){
    const order = cards.map((c, i) => i);
    let i = 0, flipped = false;
    const box = el("div", "deck");
    function draw(){
      const [front, backText] = cards[order[i]];
      box.innerHTML = "";
      const card = btn("flash" + (flipped ? " flipped" : ""), `<span class="fside1">${flipped ? "Answer" : "Question"} · ${i + 1} of ${cards.length}</span><span class="ftext">${esc(flipped ? backText : front)}</span><span class="fhint">${flipped ? "Tap to see the question" : "Tap to reveal"}</span>`,
        () => { flipped = !flipped; draw(); }, { "aria-live":"polite" });
      box.appendChild(card);
      const nav = el("div", "deckbar");
      nav.appendChild(btn("seg1", "‹ Prev", () => { i = (i - 1 + cards.length) % cards.length; flipped = false; draw(); }));
      nav.appendChild(btn("seg1", "Shuffle", () => { for(let k = order.length - 1; k > 0; k--){ const j = Math.floor(Math.random() * (k + 1)); [order[k], order[j]] = [order[j], order[k]]; } i = 0; flipped = false; draw(); }));
      nav.appendChild(btn("seg1", "Next ›", () => { i = (i + 1) % cards.length; flipped = false; draw(); }));
      box.appendChild(nav);
    }
    draw();
    return box;
  }

  // ---------- add or edit a flight ----------
  function recent(field){ const seen = []; sorted().forEach(f => { const v = f[field]; if(v && !seen.includes(v)) seen.push(v); }); return seen.slice(0, 4); }
  function renderForm(f){
    enter("sub");
    const editing = !!f;
    const d = editing ? Object.assign({}, f) : { date:today(), type:(recent("type")[0] || "C150"), reg:(recent("reg")[0] || ""), pic:(recent("pic")[0] || ""), cap:"Dual",
      from:(recent("from")[0] || ""), to:"", dep:"", arr:"", mins:60, ldg:1, xc:false, qxc:false, ex:[], remarks:"", well:"", work:"", instr:"" };
    title(editing ? "Edit flight" : "Log a flight", "Times in UTC, as in your logbook");
    view.innerHTML = "";
    const w = el("div", "topic");
    const form = el("form", "card lform"); form.noValidate = true;
    const field = (id, label, input) => { const b = el("div", "dfield", `<label for="${id}">${label}</label>`); b.appendChild(input); return b; };
    const text = (id, value, attrs) => { const i = document.createElement("input"); i.id = id; i.className = "wtext"; i.value = value == null ? "" : value; Object.entries(attrs || {}).forEach(([k,v]) => i.setAttribute(k, v)); return i; };
    const quick = (input, values) => { if(!values.length) return null; const r = el("div", "quick"); values.forEach(v => r.appendChild(btn("qchip", esc(v), () => { input.value = v; input.dispatchEvent(new Event("input")); }))); return r; };

    const fDate = text("lf-date", d.date, { type:"date" });
    const fReg = text("lf-reg", d.reg, { autocapitalize:"characters", placeholder:"G-ABCD" });
    const fType = text("lf-type", d.type, { placeholder:"C150" });
    const fPic = text("lf-pic", d.pic, { placeholder:"Instructor's name, or SELF" });
    const fFrom = text("lf-from", d.from, { placeholder:"Eshott" });
    const fTo = text("lf-to", d.to, { placeholder:"Same as departure if local" });
    const fDep = text("lf-dep", d.dep, { type:"time" });
    const fArr = text("lf-arr", d.arr, { type:"time" });
    const fTime = text("lf-time", hm(d.mins), { inputmode:"numeric", placeholder:"1:05" });
    const fLdg = text("lf-ldg", d.ldg, { inputmode:"numeric" });
    const fRem = document.createElement("textarea"); fRem.id = "lf-rem"; fRem.className = "wtext"; fRem.rows = 2; fRem.value = d.remarks;

    const g1 = el("div", "fgrid");
    g1.append(field("lf-date", "Date", fDate), field("lf-reg", "Registration", fReg));
    const q1 = quick(fReg, recent("reg")); if(q1) g1.lastChild.appendChild(q1);
    g1.append(field("lf-type", "Type", fType));
    const q2 = quick(fType, [...new Set([...recent("type"), "C150", "C152"])].slice(0, 4)); g1.lastChild.appendChild(q2);
    g1.append(field("lf-pic", "Pilot in command", fPic));
    const q3 = quick(fPic, [...new Set([...recent("pic"), "SELF"])].slice(0, 4)); g1.lastChild.appendChild(q3);
    form.appendChild(g1);

    form.appendChild(el("div", "zlabel", "Your capacity"));
    const cap = W.seg([["Dual", "Dual (P/UT)"], ["Solo", "Solo (supervised)"], ["PIC", "PIC (licensed)"]], d.cap, v => { d.cap = v; if(v !== "Dual" && !fPic.value) fPic.value = "SELF"; });
    form.appendChild(cap.el);

    const g2 = el("div", "fgrid");
    g2.append(field("lf-from", "From", fFrom), field("lf-to", "To", fTo), field("lf-dep", "Take-off (UTC)", fDep), field("lf-arr", "Landing (UTC)", fArr), field("lf-time", "Flight time (h:mm)", fTime), field("lf-ldg", "Landings", fLdg));
    const q4 = quick(fFrom, recent("from")); if(q4) g2.children[0].appendChild(q4);
    form.appendChild(g2);
    const syncTime = () => {
      if(!fDep.value || !fArr.value) return;
      const [a, b] = [fDep.value, fArr.value].map(v => { const [h, m] = v.split(":").map(Number); return h * 60 + m; });
      let mins = b - a; if(mins < 0) mins += 24 * 60;
      fTime.value = hm(mins);
    };
    fDep.addEventListener("change", syncTime); fArr.addEventListener("change", syncTime);

    const xcRow = el("div", "toggles");
    const tog = (label, key) => { const b = btn("qchip tog" + (d[key] ? " on" : ""), label, () => { d[key] = !d[key]; b.classList.toggle("on", d[key]); if(key === "qxc" && d.qxc && !d.xc){ d.xc = true; xcBtn.classList.add("on"); } }); return b; };
    const xcBtn = tog("Cross-country", "xc"); xcRow.append(xcBtn, tog("Qualifying solo cross-country", "qxc"));
    form.appendChild(el("div", "zlabel", "Flight"));
    form.appendChild(xcRow);

    form.appendChild(el("div", "zlabel", "Exercises flown · tap all that apply"));
    const exg = el("div", "exgrid");
    LESSONS.forEach(l => { const b = btn("qchip ex" + (d.ex.includes(l.id) ? " on" : ""), `<b>${esc(l.id)}</b> ${esc(l.title)}`, () => {
      d.ex = d.ex.includes(l.id) ? d.ex.filter(x => x !== l.id) : [...d.ex, l.id]; b.classList.toggle("on", d.ex.includes(l.id)); }); exg.appendChild(b); });
    form.appendChild(exg);
    form.appendChild(field("lf-rem", "Remarks (as in your logbook)", fRem));
    const msg = el("div", "calcmsg");
    form.appendChild(msg);
    form.appendChild(btn("bigbtn", editing ? "Save changes" : "Save flight", () => form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit"))));
    form.addEventListener("submit", e => {
      e.preventDefault();
      const tm = fTime.value.trim(); let mins = NaN;
      if(/^\d{1,2}:\d{2}$/.test(tm)){ const [h, m] = tm.split(":").map(Number); mins = h * 60 + m; }
      else if(/^\d+(\.\d+)?$/.test(tm)) mins = Math.round(parseFloat(tm) * 60);
      if(!fDate.value){ msg.textContent = "Add the date."; return; }
      if(!fReg.value.trim()){ msg.textContent = "Add the aircraft registration."; return; }
      if(!(mins > 0)){ msg.textContent = "Add the flight time, for example 1:05."; return; }
      const rec = clean(Object.assign(d, { date:fDate.value, reg:fReg.value.trim(), type:fType.value.trim(), pic:fPic.value.trim(),
        from:fFrom.value.trim(), to:fTo.value.trim() || fFrom.value.trim(), dep:fDep.value, arr:fArr.value, mins, ldg:parseInt(fLdg.value, 10) || 0, remarks:fRem.value.trim() }));
      if(editing){ const k = log.flights.findIndex(x => x.id === f.id); log.flights[k] = Object.assign(rec, { id:f.id }); }
      else log.flights.push(rec);
      save(); buzz(); toast(editing ? "Flight updated" : "Flight saved");
      // Editing returns to the flight page underneath; a new flight replaces the form with its page
      if(editing && history.state && history.state.lg === "form"){ try{ history.back(); return; }catch(e){} }
      replace({ lg:"flight", id:rec.id }); renderFlight(log.flights.find(x => x.id === rec.id));
    });
    w.appendChild(form);
    view.appendChild(w);
  }

  // ---------- backup and import ----------
  function exportText(){
    const storage = {};
    BACKUP_KEYS.forEach(k => { try{ const v = localStorage.getItem(k); if(v != null) storage[k] = v; }catch(e){} });
    return JSON.stringify({ app:"PPL Kneeboard", kind:"backup", v:1, exported:new Date().toISOString(), storage }, null, 1);
  }
  function exportAll(){
    const name = `ppl-kneeboard-backup-${today()}.json`, text = exportText();
    if(window.AndroidBridge && AndroidBridge.exportFile){ AndroidBridge.exportFile(name, text); return true; }
    return false;
  }
  function pickImport(){
    if(window.AndroidBridge && AndroidBridge.importFile){ AndroidBridge.importFile(); return true; }
    return false;
  }
  // Called with the text of a chosen file (from Android) or pasted text (elsewhere)
  function handleImport(text){
    let data = null;
    try{ data = JSON.parse(text); }catch(e){}
    if(!data || data.app !== "PPL Kneeboard"){ pendingImport = { error:"That file isn't a PPL Kneeboard backup or logbook file." }; }
    else {
      let flights = [];
      if(data.kind === "logbook" && Array.isArray(data.flights)) flights = data.flights;
      if(data.kind === "backup" && data.storage && data.storage[LKEY]){ try{ flights = JSON.parse(data.storage[LKEY]).flights || []; }catch(e){} }
      flights = flights.map(clean);
      const exists = f => log.flights.some(x => x.id === f.id || (x.date === f.date && x.reg === f.reg && x.mins === f.mins && x.from === f.from && x.dep === f.dep));
      const fresh = flights.filter(f => !exists(f));
      let answers = 0;
      if(data.kind === "backup" && data.storage && data.storage["ppl-study-v2"]){ try{ answers = Object.keys(JSON.parse(data.storage["ppl-study-v2"]).ans || {}).length; }catch(e){} }
      pendingImport = { data, fresh, dupes:flights.length - fresh.length, answers };
    }
    if(!(history.state && history.state.lg === "backup")) push({ lg:"backup" });
    renderBackup();
  }
  function applyImport(){
    const p = pendingImport; if(!p || p.error) return;
    log.flights.push(...p.fresh); save();
    if(p.data.kind === "backup"){
      ["c150cl.prefs", "ppl-study-v2"].forEach(k => { if(p.data.storage[k] != null){ try{ localStorage.setItem(k, p.data.storage[k]); }catch(e){} } });
      pendingImport = null;
      toast("Backup restored");
      setTimeout(() => location.reload(), 600);   // settings and answers load at start-up
      return;
    }
    pendingImport = null; toast(`${p.fresh.length} flight${p.fresh.length === 1 ? "" : "s"} imported`); renderBackup();
  }
  function renderBackup(){
    enter("sub");
    title("Backup and import", "Keep your progress safe");
    view.innerHTML = "";
    const w = el("div", "topic");
    const p = pendingImport;
    if(p){
      const c = el("div", "card confirm");
      if(p.error){ c.innerHTML = `<h3>Can't import that file</h3><p>${esc(p.error)}</p>`; c.appendChild(btn("bigbtn ghost", "OK", () => { pendingImport = null; renderBackup(); })); }
      else {
        const what = p.data.kind === "backup"
          ? `A full backup from ${esc(fmtDate((p.data.exported || "").slice(0, 10)))}: ${p.fresh.length} new flight${p.fresh.length === 1 ? "" : "s"}${p.dupes ? ` (${p.dupes} already here)` : ""}, ${p.answers} exam answers and your display settings. Exam answers and settings on this device will be replaced; flights are added, never removed.`
          : `${p.fresh.length} new flight${p.fresh.length === 1 ? "" : "s"} to add${p.dupes ? `, ${p.dupes} already in your logbook and skipped` : ""}.`;
        c.innerHTML = `<h3>Ready to import</h3><p>${what}</p>`;
        const row = el("div", "row2");
        row.appendChild(btn("bigbtn", p.data.kind === "backup" ? "Restore backup" : "Add flights", applyImport, (p.fresh.length || p.data.kind === "backup") ? null : { disabled:"" }));
        row.appendChild(btn("bigbtn ghost", "Cancel", () => { pendingImport = null; renderBackup(); }));
        c.appendChild(row);
      }
      w.appendChild(c);
    }
    const t = totals();
    w.appendChild(el("div", "card", `<div class="learn"><h3>Back up everything</h3><p>Saves your logbook (${t.n} flight${t.n === 1 ? "" : "s"}), exam answers and display settings to one file. Keep it somewhere safe, such as Google Drive. Do this before uninstalling the app or changing phone.</p></div>`));
    const native = !!(window.AndroidBridge && AndroidBridge.exportFile);
    w.appendChild(btn("bigbtn", "Save a backup file", () => { if(!exportAll()) showText(); }));
    w.appendChild(el("div", "card", `<div class="learn"><h3>Restore or import</h3><p>Choose a backup file to restore, or a logbook file (for example your paper logbook typed up for you) to add its flights. Flights already in your logbook are skipped.</p></div>`));
    w.appendChild(btn("bigbtn ghost", "Choose a file to import", () => { if(!pickImport()) showPaste(); }));
    const extra = el("div", "");
    w.appendChild(extra);
    function showText(){
      extra.innerHTML = "";
      const ta = document.createElement("textarea"); ta.className = "wtext"; ta.rows = 6; ta.readOnly = true; ta.value = exportText(); ta.id = "bk-out";
      extra.append(el("div", "zlabel", "Copy this text and keep it safe"), ta, btn("bigbtn ghost", "Copy", () => {
        try{ navigator.clipboard.writeText(ta.value).then(() => toast("Copied"), () => { ta.select(); }); }catch(e){ ta.select(); } }));
    }
    function showPaste(){
      extra.innerHTML = "";
      const ta = document.createElement("textarea"); ta.className = "wtext"; ta.rows = 6; ta.id = "bk-in"; ta.placeholder = "Paste backup or logbook text here";
      extra.append(el("div", "zlabel", "Paste the file's text"), ta, btn("bigbtn", "Import pasted text", () => handleImport(ta.value)));
    }
    if(!native) w.appendChild(el("div", "fine", "In the Android app these buttons save and open files. In a browser they show text to copy or paste."));
    view.appendChild(w);
  }

  // ---------- navigation ----------
  function back(){
    const s = history.state && history.state.lg;
    if(s && s !== "home"){ try{ history.back(); return; }catch(e){} }
    renderHome();
  }
  function fromState(st){
    if(st.lg === "flight"){ const f = log.flights.find(x => x.id === st.id); if(f) return renderFlight(f); }
    if(st.lg === "lesson"){ const l = lessonById(st.ex); if(l) return renderLesson(l); }
    if(st.lg === "form") return renderForm(st.id ? log.flights.find(x => x.id === st.id) || null : null);
    if(st.lg === "backup") return renderBackup();
    renderHome();
  }
  function show(){ replace({ lg:"home" }); renderHome(); }

  // Android file bridge callbacks
  window.onImportFile = text => handleImport(text);
  window.onImportFailed = () => toast("Couldn't read that file");
  window.onExportDone = ok => toast(ok ? "Backup saved" : "Backup not saved");

  load();
  return { show, fromState, back, exportAll, pickImport, handleImport, renderBackupFromSettings:() => { push({ lg:"backup" }); renderBackup(); } };
})();

// ---------- boot ----------
load();
applyPrefs();
try{ history.replaceState({}, ""); }catch(e){}
renderHome();
</script>
</body>
</html>
