T.push({ id:"hypoxia", ref:"040 · 1", title:"Breathing, hypoxia and carbon monoxide",
blurb:"What happens to the body as air pressure falls, and two cabin hazards that feel the same.",
learn:()=>`
<h3>The atmosphere and oxygen</h3>
<p>Air is about <b>21% oxygen</b> at every altitude a light aircraft reaches. What falls with height is the <b>pressure</b>, so each breath delivers less oxygen into the blood.</p>
<h3>Hypoxia</h3>
<p>Hypoxia is a shortage of oxygen in the body's tissues. It is dangerous because it is <b>insidious</b>: one of the first things it affects is judgement, so the pilot may feel fine, even euphoric.</p>
<ul>
<li>Symptoms include impaired judgement, euphoria, slowed thinking, headache, tingling, visual impairment and cyanosis (blue lips and fingernails).</li>
<li><b>Night vision</b> is one of the first things affected, from as low as about 5,000 ft.</li>
<li>Smoking, alcohol, fatigue and poor fitness all lower your tolerance.</li>
<li>Treatment: descend, and use oxygen if available.</li>
</ul>
<h3>Hyperventilation</h3>
<p>Over-breathing, often from anxiety, washes too much <b>carbon dioxide</b> out of the blood. Symptoms are dizziness, tingling in the hands and lips, and feeling light-headed, very similar to hypoxia. Treatment: consciously slow your breathing rate and depth, or talk out loud, which naturally slows it.</p>
<h3>Carbon monoxide</h3>
<p>Carbon monoxide is colourless and odourless. In a light aircraft it most often comes from an exhaust leak into the <b>cabin heater</b>. It binds to haemoglobin about 200 times more readily than oxygen, so even small amounts block oxygen transport. Symptoms: headache, drowsiness, nausea, impaired judgement.</p>
<p>Action: heater off, fresh air vents open, land as soon as possible. A carbon monoxide detector in the cockpit is cheap protection.</p>
<div class="box trap"><b>Common trap</b>The proportion of oxygen does not fall with height. The partial pressure of oxygen does.</div>`,
qs:[
{q:"How does the percentage of oxygen in the air change as you climb in a light aircraft?",o:["It stays at about 21%","It falls steadily","It rises","It halves every 5,000 ft"],e:"The proportion stays at about 21%. The total pressure, and so the partial pressure of oxygen, falls."},
{q:"Why is hypoxia particularly dangerous for a pilot?",o:["Its early effects impair judgement, so the pilot may not recognise it","It always causes immediate unconsciousness","It only occurs above 25,000 ft","It is always accompanied by severe pain"],e:"Hypoxia is insidious: it degrades judgement early, and can bring euphoria, so the pilot may feel fine while performing badly."},
{q:"Which faculty is often affected first by mild hypoxia at moderate altitudes?",o:["Night vision","Hearing","Sense of smell","Muscle strength"],e:"Night vision is sensitive to reduced oxygen and can be impaired from as low as about 5,000 ft."},
{q:"What causes the symptoms of hyperventilation?",o:["Too much carbon dioxide being breathed out","Too little oxygen in the air","Carbon monoxide in the cabin","Nitrogen bubbles in the blood"],e:"Over-breathing lowers the carbon dioxide level in the blood, causing dizziness and tingling. The cure is to slow the breathing down."},
{q:"In a single-engine light aircraft, what is the most likely source of carbon monoxide in the cabin?",o:["An exhaust leak into the cabin heating system","The fuel tanks","The battery","Passengers' breath"],e:"Cabin heat is usually taken from a muff around the exhaust. A crack lets exhaust gas, including carbon monoxide, into the cabin."},
{q:"You suspect carbon monoxide poisoning in flight. What should you do?",o:["Turn the heater off, open the fresh air vents and land as soon as possible","Turn the heater up and climb","Breathe faster to clear it","Continue and see if the symptoms go"],e:"Stop the source, ventilate, and land. Carbon monoxide leaves the blood slowly, so symptoms can persist."},
{q:"Why is carbon monoxide so harmful even in small amounts?",o:["It combines with haemoglobin far more readily than oxygen does","It displaces nitrogen in the lungs","It raises blood pressure","It irritates the eyes"],e:"Haemoglobin takes up carbon monoxide about 200 times more readily than oxygen, so it blocks the blood's oxygen-carrying capacity."}
]});

T.push({ id:"vision", ref:"040 · 2", title:"Vision and lookout",
blurb:"How the eye works, night adaptation, scanning for traffic and approach illusions.",
learn:()=>`
<h3>The eye</h3>
<div class="tbl"><table>
<tr><th>Cells</th><th>Where</th><th>Good for</th></tr>
<tr><td>Cones</td><td>Concentrated at the centre (the fovea)</td><td>Colour and fine detail, in good light</td></tr>
<tr><td>Rods</td><td>Around the edge of the retina</td><td>Low light and movement; no colour</td></tr>
</table></div>
<ul>
<li>The <b>blind spot</b> is where the optic nerve leaves the eye. Using both eyes and moving the head covers it.</li>
<li>Full <b>dark adaptation</b> takes about 30 minutes. A bright light destroys it in seconds.</li>
<li>At night, look slightly to one side of an object (<b>off-centre viewing</b>), because the centre of the eye has no rods.</li>
</ul>
<h3>Lookout</h3>
<ul>
<li>In a featureless sky the eye relaxes to focus a metre or two away (<b>empty field myopia</b>). Focus on something distant, such as a cloud or the horizon, then scan.</li>
<li>The eye sees detail only when it stops. Scan in short, regular steps of about 10°, pausing at each.</li>
<li>An aircraft on a collision course stays at a <b>constant relative bearing</b>. It does not appear to move, and grows very slowly until the last few seconds.</li>
</ul>
<h3>Approach illusions</h3>
<div class="tbl"><table>
<tr><th>Runway</th><th>Makes you feel</th><th>Risk</th></tr>
<tr><td>Upsloping</td><td>Too high</td><td>Flying a low approach</td></tr>
<tr><td>Downsloping</td><td>Too low</td><td>Flying a high approach</td></tr>
<tr><td>Narrower than usual</td><td>Too high</td><td>Flying a low approach</td></tr>
<tr><td>Wider than usual</td><td>Too low</td><td>Flying a high approach</td></tr>
</table></div>`,
qs:[
{q:"Which cells in the eye are mainly used for vision at night?",o:["Rods","Cones","The fovea","The optic nerve"],e:"Rods are sensitive to low light and movement but not colour. Cones need good light."},
{q:"About how long does it take for the eyes to fully adapt to darkness?",o:["30 minutes","2 minutes","5 minutes","2 hours"],e:"Full dark adaptation takes around 30 minutes, and bright light can undo it almost at once."},
{q:"Another aircraft is on a collision course with you. How will it appear?",o:["Stationary in your field of view, at a constant relative bearing","Moving rapidly across the windscreen","Getting smaller","Moving up and down"],e:"An aircraft that is going to hit you holds the same relative position. Its lack of movement makes it hard to spot."},
{q:"What is empty field myopia?",o:["The eye relaxing to focus close by when there is nothing to look at","Short-sightedness caused by bright sunlight","Loss of colour vision at altitude","The blind spot in each eye"],e:"With no features to focus on, the eye focuses a metre or two away, so distant aircraft are missed. Focus on something distant before scanning."},
{q:"What is the best technique for scanning for other traffic?",o:["Short, regular movements of about 10°, pausing at each","One continuous sweep from side to side","Staring straight ahead","Looking only where traffic is reported"],e:"The eye only detects detail when it is still, so scan in short steps with a pause at each."},
{q:"Approaching an upsloping runway, what illusion is likely?",o:["Feeling too high, leading to a low approach","Feeling too low, leading to a high approach","Feeling too fast","No illusion"],e:"An upslope makes the runway look longer and steeper, as if you are high. Pilots then tend to descend too low."},
{q:"At night, how should you look at a dim object to see it best?",o:["Slightly to one side of it","Directly at it","With one eye closed","Through a red filter"],e:"The centre of the eye has only cones, which need good light. Looking slightly off-centre puts the image on the rods."}
]});

T.push({ id:"balance", ref:"040 · 3", title:"Balance, disorientation and pressure",
blurb:"The balance organs, the illusions they produce, and what pressure changes do to ears, sinuses and divers.",
learn:()=>`
<h3>The balance organs</h3>
<ul>
<li>The <b>semicircular canals</b> detect <b>angular acceleration</b> (starting or stopping a rotation). A steady rate of turn soon stops being felt.</li>
<li>The <b>otoliths</b> detect <b>linear acceleration</b> and gravity. They cannot tell the difference between tilting and accelerating.</li>
</ul>
<h3>Illusions</h3>
<div class="tbl"><table>
<tr><th>Illusion</th><th>Cause</th><th>Feels like</th></tr>
<tr><td>The leans</td><td>A slow roll into a turn goes undetected; rolling level is felt</td><td>Banked the other way when actually level</td></tr>
<tr><td>Somatogravic</td><td>Forward acceleration, e.g. take-off or go-around at night</td><td>Nose-up pitch, tempting the pilot to push the nose down</td></tr>
<tr><td>Coriolis</td><td>Moving the head during a turn</td><td>Strong tumbling sensation</td></tr>
</table></div>
<p>Without visual references these feelings are unreliable. The answer is to believe the instruments, and to avoid flying into cloud or poor visibility without the training to do so.</p>
<h3>Pressure changes</h3>
<ul>
<li>The <b>Eustachian tube</b> equalises pressure in the middle ear. Air escapes easily on the climb; on the <b>descent</b>, air has to get back in, and a cold or congestion can block it, causing severe ear pain. The <b>Valsalva</b> manoeuvre (pinch the nose, close the mouth, gently blow) helps. Don't fly with a heavy cold.</li>
<li>Sinuses can be blocked the same way.</li>
<li><b>Scuba diving</b>: the body absorbs extra nitrogen under water. Flying soon afterwards lowers the pressure further, and nitrogen can form bubbles in the blood (<b>decompression sickness</b>). Leave a suitable interval after diving; check current guidance with your instructor or AME.</li>
</ul>`,
qs:[
{q:"What do the semicircular canals detect?",o:["Angular acceleration","Linear acceleration","Gravity alone","Sound"],e:"The canals respond to changes in rotation. Linear acceleration and gravity are sensed by the otoliths."},
{q:"After a long, steady turn, a pilot rolls level but feels banked the other way. What is this illusion called?",o:["The leans","Somatogravic illusion","Coriolis illusion","Empty field myopia"],e:"The canals adapted to the steady turn, so rolling level is sensed as a roll in the opposite direction."},
{q:"At night, a pilot accelerating on take-off feels the nose pitching up. What is this, and what is the danger?",o:["A somatogravic illusion; the pilot may push the nose down towards the ground","The leans; the pilot may roll the wrong way","Coriolis illusion; the pilot may spin","Hypoxia; the pilot may lose consciousness"],e:"The otoliths can't tell acceleration from a nose-up tilt. Without visual cues, the pilot may lower the nose into a descent."},
{q:"Which head movement during a turn is most likely to cause a strong tumbling sensation?",o:["A sudden head movement, such as looking down to pick something up","Keeping the head still","Looking straight ahead","Closing one eye"],e:"Moving the head during a turn stimulates more than one canal at once, producing the Coriolis illusion."},
{q:"With a heavy cold, when is ear pain most likely in flight?",o:["During the descent","During the climb","In level cruise","Only on the ground"],e:"On the descent air has to flow back into the middle ear through the Eustachian tube, which congestion blocks."},
{q:"What is the Valsalva manoeuvre used for?",o:["To help equalise pressure in the middle ear","To cure hyperventilation","To recover from the leans","To improve night vision"],e:"Gently blowing against a closed mouth and pinched nose pushes air up the Eustachian tube into the middle ear."},
{q:"Why should you avoid flying soon after scuba diving?",o:["Nitrogen absorbed while diving can form bubbles as pressure falls, causing decompression sickness","Diving raises blood alcohol","Diving damages night vision","Salt water affects the balance organs for a week"],e:"Under pressure the body absorbs extra nitrogen. Reducing pressure by flying can bring it out of solution as bubbles. Leave a suitable interval, as current guidance advises."}
]});

T.push({ id:"health", ref:"040 · 4", title:"Fitness to fly",
blurb:"Alcohol and the law, medication, minor illness and the IMSAFE check.",
learn:()=>`
<h3>Alcohol</h3>
<ul>
<li>In the UK, the Railways and Transport Safety Act 2003 sets the limit for pilots at <b>20 mg of alcohol per 100 ml of blood</b> (9 µg per 100 ml of breath). That is a quarter of the drink-drive limit in England.</li>
<li>The body removes alcohol at roughly <b>one unit an hour</b>. Coffee, food, sleep or exercise do not speed it up.</li>
<li>A common guide is at least 8 hours from "bottle to throttle", and much longer after heavy drinking. The hangover itself impairs performance even when the alcohol has gone.</li>
</ul>
<h3>Medication and illness</h3>
<ul>
<li>Many over-the-counter medicines affect fitness to fly. Antihistamines (hay fever, cold remedies) commonly cause drowsiness.</li>
<li>If in doubt, ask an aviation medical examiner (AME) before flying.</li>
<li>A cold can block the ears and sinuses; an upset stomach causes dehydration and distraction.</li>
<li>Your medical certificate does not cover a temporary illness: you must not fly if you know or suspect you are unfit.</li>
</ul>
<h3>The IMSAFE check</h3>
<div class="sq">
<div class="tile"><div class="big">I</div><div class="d">Illness</div></div>
<div class="tile"><div class="big">M</div><div class="d">Medication</div></div>
<div class="tile"><div class="big">S</div><div class="d">Stress</div></div>
<div class="tile"><div class="big">A</div><div class="d">Alcohol</div></div>
<div class="tile"><div class="big">F</div><div class="d">Fatigue</div></div>
<div class="tile"><div class="big">E</div><div class="d">Eating</div></div>
</div>
<h3>Fatigue and the body clock</h3>
<ul>
<li>The <b>circadian rhythm</b> is a roughly 24-hour cycle. Alertness is lowest in the <b>early hours of the morning</b>, with a smaller dip in the early afternoon.</li>
<li><b>Acute</b> fatigue follows a long or demanding day and is cured by rest. <b>Chronic</b> fatigue builds up over weeks of poor sleep or stress and needs longer recovery.</li>
<li>Caffeine masks tiredness but does not remove it. Only sleep does.</li>
</ul>`,
qs:[
{q:"What is the UK legal alcohol limit in the blood for a pilot?",o:["20 mg per 100 ml","80 mg per 100 ml","50 mg per 100 ml","There is no limit, only a guideline"],e:"The Railways and Transport Safety Act 2003 sets 20 mg per 100 ml of blood for pilots, a quarter of the England drink-drive limit."},
{q:"Which of these speeds up the removal of alcohol from the body?",o:["None of them; only time does","Strong coffee","A big meal","Exercise"],e:"The liver removes alcohol at a roughly fixed rate, about one unit an hour. Nothing you eat or do changes that."},
{q:"Many hay fever and cold remedies contain antihistamines. What is their most likely effect on a pilot?",o:["Drowsiness","Better night vision","Faster reactions","No effect"],e:"Antihistamines commonly cause drowsiness and slowed reactions. Check with an AME before flying on any new medicine."},
{q:"What does the \"S\" in the IMSAFE check stand for?",o:["Stress","Sleep","Symptoms","Speed"],e:"IMSAFE: Illness, Medication, Stress, Alcohol, Fatigue, Eating."},
{q:"When is a person's natural alertness typically at its lowest?",o:["In the early hours of the morning","Mid-morning","Early evening","Just after waking"],e:"The circadian low is in the early hours of the morning, with a smaller dip in the early afternoon."},
{q:"What is the difference between acute and chronic fatigue?",o:["Acute follows a single demanding period and is cured by rest; chronic builds up over a long time","Acute is mild and chronic is severe","Acute is mental and chronic is physical","There is no difference"],e:"Acute fatigue is short-term and recovers with a good sleep. Chronic fatigue accumulates over weeks and needs longer to recover."},
{q:"Your Class 2 medical is valid, but you have a heavy cold today. Which statement is correct?",o:["You must not fly if you know or suspect you are unfit, whatever the certificate says","The valid certificate means you are fit to fly","You can fly if you take a decongestant","Colds are not relevant to flying"],e:"A medical certificate shows you met the standard when examined. You are responsible for not flying while temporarily unfit."}
]});

T.push({ id:"processing", ref:"040 · 5", title:"Information processing and stress",
blurb:"Memory, attention, expectation and how stress and workload affect performance.",
learn:()=>`
<h3>Memory</h3>
<ul>
<li><b>Short-term (working) memory</b> holds about <b>7 ± 2 items</b>, for only a short time unless rehearsed. That is why you write down clearances and use checklists.</li>
<li><b>Long-term memory</b> stores knowledge and experience.</li>
<li><b>Motor programmes</b> are well-practised skills that run without conscious thought, such as flaring for landing. Useful, but a programme can run in the wrong situation: selecting the wrong lever out of habit.</li>
</ul>
<h3>Attention and perception</h3>
<ul>
<li>Attention is limited. Focusing hard on one task (such as a radio problem) can push out others (such as flying the aircraft).</li>
<li><b>Expectation</b> shapes what we perceive. A pilot expecting "cleared to land" may hear it when ATC said something else.</li>
<li><b>Confirmation bias</b>: once we have made up our minds, we look for evidence that agrees and ignore what doesn't. A common route to getting lost.</li>
<li><b>Situational awareness</b> is an accurate picture of what is happening around you, and what is likely to happen next.</li>
</ul>
<h3>Stress and arousal</h3>
${arousal}
<p>Under high stress, attention narrows (<b>tunnel vision</b>), thinking becomes rigid, and people fall back on old habits. Stress outside flying (work, money, relationships) adds to the load you bring into the cockpit.</p>`,
qs:[
{q:"Roughly how many items can short-term memory hold?",o:["7 ± 2","3 ± 1","20 ± 5","Unlimited, for a few seconds"],e:"Working memory holds about seven items, which is why long clearances should be written down."},
{q:"What is a motor programme?",o:["A well-practised skill performed without conscious thought","A checklist","A long-term memory of a route","A computer program in the aircraft"],e:"Motor programmes free up attention, but can run automatically in the wrong context."},
{q:"According to the Yerkes–Dodson relationship, performance is best at:",o:["A moderate level of arousal","Very low arousal","Very high arousal","Any level of arousal"],e:"Too little arousal brings boredom and inattention; too much brings overload. Moderate arousal gives the best performance."},
{q:"A pilot hears \"cleared to land\" when ATC actually said \"continue approach\". What is the most likely cause?",o:["Expectation","Hypoxia","Empty field myopia","Hyperventilation"],e:"Expectation strongly shapes perception. Listening carefully and reading back properly guards against it."},
{q:"Uncertain of position, a pilot convinces himself a town ahead is the one on the plan and ignores a river that doesn't fit. This is an example of:",o:["Confirmation bias","The leans","Motor programme error","Empty field myopia"],e:"Confirmation bias makes us accept evidence that fits our picture and discount what doesn't."},
{q:"What is a typical effect of high stress on a pilot's attention?",o:["It narrows, causing tunnel vision","It widens to take in everything","It is unaffected","It becomes faster and more accurate"],e:"High stress narrows attention to a few items, so important information outside that focus is missed."},
{q:"What is situational awareness?",o:["An accurate picture of what is happening and what is likely to happen next","Knowing the aircraft's registration","The ability to fly without instruments","A memory technique for checklists"],e:"Good situational awareness covers the aircraft, the environment, the weather and the plan, now and in the near future."}
]});

T.push({ id:"decisions", ref:"040 · 6", title:"Decision making and error",
blurb:"How accidents happen, types of error, hazardous attitudes and a structured way to decide.",
learn:()=>`
${swiss}
<h3>Types of error</h3>
<div class="tbl"><table>
<tr><th>Error</th><th>What happens</th><th>Example</th></tr>
<tr><td>Slip</td><td>The right plan, carried out wrongly</td><td>Selecting the flap lever instead of the trim</td></tr>
<tr><td>Lapse</td><td>A memory failure: something forgotten</td><td>Forgetting to switch fuel tanks</td></tr>
<tr><td>Mistake</td><td>The wrong plan, carried out as intended</td><td>Choosing to continue into worsening weather</td></tr>
</table></div>
<p>Checklists catch slips and lapses. Mistakes need better decisions.</p>
<h3>Hazardous attitudes</h3>
<div class="tbl"><table>

<tr><td>Invulnerability</td><td>"It won't happen to me."</td><td>"It could happen to me."</td></tr>
<tr><td>Macho</td><td>"I can do it."</td><td>"Taking chances is foolish."</td></tr>
<tr><td>Resignation</td><td>"What's the use?"</td><td>"I'm not helpless. I can make a difference."</td></tr>
</table></div>
<h3>Deciding under pressure: DODAR</h3>
<p><b>D</b>iagnose · <b>O</b>ptions · <b>D</b>ecide · <b>A</b>ssign tasks · <b>R</b>eview. Fly the aircraft first; then work through the problem.</p>
<h3>Plan continuation</h3>
<p>"Get-there-itis" is the pull to continue with a plan despite signs it should change. Set <b>personal minimums</b> on the ground (weather, wind, fuel reserve) so the decision is made before the pressure is on.</p>`,

T.push({ id:"atmos", ref:"050 · 1", title:"The atmosphere and altimetry",
blurb:"The International Standard Atmosphere, pressure with height, and how pressure and temperature fool the altimeter.",
learn:()=>`
<h3>International Standard Atmosphere (ISA)</h3>
<div class="tbl"><table>
<tr><th>Value</th><th>ISA</th></tr>
<tr><td>Mean sea level pressure</td><td>1013.25 hPa</td></tr>
<tr><td>Mean sea level temperature</td><td>+15 °C</td></tr>
<tr><td>Temperature lapse rate</td><td>1.98 °C per 1,000 ft (use 2 °C)</td></tr>
<tr><td>Tropopause</td><td>About 36,000 ft, at −56.5 °C</td></tr>
</table></div>
<p>Near the surface, pressure falls by about <b>1 hPa for every 30 ft</b> of height. Use 30 ft per hPa for altimeter calculations.</p>
<h3>Density</h3>
<p>Air density falls with height, with higher temperature and with higher humidity. Low density means less engine power, less propeller thrust and longer take-off runs. <b>Density altitude</b> is the height in the ISA that has the same density as the air you are in: a hot day at a high airfield can perform like a much higher one.</p>
<h3>Altimeter errors</h3>
<ul>
<li><b>Pressure:</b> flying from high to low pressure with the subscale unchanged, the altimeter over-reads, so you are <b>lower</b> than indicated. "High to low, look out below."</li>
<li><b>Temperature:</b> in air colder than ISA the altimeter also over-reads, so you are lower than indicated.</li>
</ul>
<p>Example: QNH 1013 set, and the actual QNH is now 1003. That is 10 hPa × 30 ft = 300 ft. You are 300 ft lower than the altimeter shows.</p>
<div class="box trap"><b>Common trap</b>Both errors point the same way when things get worse: lower pressure or colder air than the altimeter assumes puts you closer to the ground than it says.</div>`,

{q:"Near the surface, approximately how much height does 1 hPa represent?",o:["30 ft","10 ft","100 ft","300 ft"],e:"Use 30 ft per hPa for altimetry calculations at low level."},

{q:"How does air colder than ISA affect a pressure altimeter?",o:["It over-reads, so the aircraft is lower than indicated","It under-reads, so the aircraft is higher than indicated","It reads correctly","It reads correctly only above 3,000 ft"],e:"Cold air is denser and the pressure levels sit closer together, so at an indicated altitude you are lower than the altimeter assumes."},

T.push({ id:"stability", ref:"050 · 2", title:"Moisture, cloud base and stability",
blurb:"Dew point, the adiabatic lapse rates, estimating cloud base, and stable versus unstable air.",
learn:()=>`
<h3>Moisture</h3>
<p>The <b>dew point</b> is the temperature to which air must be cooled, at constant pressure, to become saturated. When air cools to its dew point, water vapour condenses into cloud, fog or dew. The closer temperature and dew point are, the more humid the air.</p>
<h3>Adiabatic lapse rates</h3>
<p>Rising air expands and cools without exchanging heat with its surroundings (adiabatic cooling).</p>
<div class="tbl"><table>
<tr><th>Rate</th><th>Value</th><th>Applies to</th></tr>
<tr><td>Dry adiabatic (DALR)</td><td>3 °C per 1,000 ft</td><td>Unsaturated rising air</td></tr>
<tr><td>Saturated adiabatic (SALR)</td><td>About 1.5 °C per 1,000 ft (varies)</td><td>Saturated rising air: condensation releases latent heat, so it cools more slowly</td></tr>
<tr><td>Environmental (ELR)</td><td>Whatever the actual atmosphere is doing</td><td>The air around the rising parcel</td></tr>
</table></div>
<h3>Estimating cloud base</h3>
<p>A rising parcel's temperature and dew point close at about 2.5 °C per 1,000 ft, so <span class="mono">cloud base (ft) ≈ (temperature − dew point) × 400</span>. Example: 15 °C and 9 °C gives 6 × 400 = 2,400 ft.</p>
<h3>Stability</h3>
<ul>
<li><b>Stable</b>: ELR less than SALR. Lifted air ends up colder than its surroundings and sinks back. Layer cloud (stratus), poor visibility in haze or drizzle, smooth air.</li>
<li><b>Unstable</b>: ELR greater than DALR. Lifted air stays warmer than its surroundings and keeps rising. Heap cloud (cumulus, Cb), showers, good visibility outside showers, bumpy air.</li>
<li><b>Conditionally unstable</b>: ELR between the two. Unstable only once the air is saturated.</li>
</ul>
<div class="box trap"><b>Common trap</b>Don't mix up the ISA lapse rate (about 2 °C per 1,000 ft) with the dry adiabatic rate (3 °C per 1,000 ft). ISA is a reference atmosphere; DALR describes a rising parcel of air.</div>`,
qs:[
{q:"What is the dew point?",o:["The temperature to which air must be cooled to become saturated","The temperature at which water freezes","The temperature at the cloud base","The difference between air temperature and humidity"],e:"Cool air to its dew point at constant pressure and it becomes saturated; any further cooling causes condensation."},
{q:"What is the dry adiabatic lapse rate?",o:["3 °C per 1,000 ft","2 °C per 1,000 ft","1.5 °C per 1,000 ft","1 °C per 1,000 ft"],e:"Unsaturated air cools at 3 °C per 1,000 ft as it rises. About 2 °C is ISA; about 1.5 °C is the saturated rate."},
{q:"Why is the saturated adiabatic lapse rate lower than the dry rate?",o:["Condensation releases latent heat into the rising air","Saturated air is denser","Saturated air rises more slowly","Water vapour absorbs radiation from the sun"],e:"As water vapour condenses it gives up latent heat, partly offsetting the cooling from expansion."},
{q:"Surface temperature is 17 °C and dew point is 11 °C. Approximately where will the base of cumulus cloud be?",o:["2,400 ft","1,200 ft","4,800 ft","600 ft"],e:"(17 − 11) × 400 = 2,400 ft."},
{q:"Air is described as stable when:",o:["The environmental lapse rate is less than the saturated adiabatic lapse rate","The environmental lapse rate is greater than the dry adiabatic lapse rate","The dew point is higher than the temperature","Surface heating is strong"],e:"If the environment cools more slowly than even saturated rising air, a lifted parcel becomes colder than its surroundings and sinks back. That is stable air."},
{q:"Which weather is typical of unstable air?",o:["Cumulus cloud, showers and good visibility outside them","Layer cloud, drizzle and poor visibility","Clear skies and haze","Fog and smooth air"],e:"Unstable air keeps rising, building heap cloud and showers; it mixes well, so visibility away from the showers is usually good."},
{q:"Which weather is typical of stable air?",o:["Stratiform cloud, poor visibility and smooth air","Cumulonimbus and thunderstorms","Heavy showers and gusty winds","Good visibility and bumpy air"],e:"Stable air resists vertical movement: layer cloud, trapped haze or drizzle, and little turbulence."}
]});

learn:()=>`
${clouds}
<h3>Fog</h3>
<p><b>Fog</b> is visibility below <b>1,000 m</b> due to water droplets. <b>Mist</b> is the same thing with visibility of 1,000 m or more. <b>Haze</b> is caused by dry particles such as dust and smoke.</p>
<div class="tbl"><table>
<tr><th>Type</th><th>How it forms</th><th>How it clears</th></tr>
<tr><td>Radiation fog</td><td>Over land, on a clear night with moist air and light wind (about 2–8 kt). The ground cools by radiation and chills the air above it to the dew point.</td><td>Heating after sunrise, or the wind strengthening and lifting it into low stratus</td></tr>
<tr><td>Advection fog</td><td>Warm, moist air moving over a colder surface, such as the sea in spring or cold ground in winter. Can form in stronger winds and at any time of day.</td><td>A change of air mass or wind direction; it can persist for days</td></tr>
<tr><td>Hill fog</td><td>Moist air forced up a slope cools to its dew point; low cloud sits on the hills.</td><td>Change of air mass</td></tr>
<tr><td>Frontal fog</td><td>Rain falling from warmer air into colder air below saturates it, near a front.</td><td>Passage of the front</td></tr>
</table></div>
<div class="box trap"><b>Common trap</b>Radiation fog needs <b>clear skies</b> (to let the ground cool) and <b>light</b> wind. Cloud cover or a strong wind prevents it. Advection fog does not need a clear night.</div>`,
qs:[
{q:"Which conditions favour radiation fog?",o:["A clear night, moist air and a light wind over land","An overcast night with strong winds","Warm, moist air moving over a cold sea","A sunny afternoon in summer"],e:"Clear skies let the ground lose heat; light wind mixes the cooling into a shallow layer; moist air reaches its dew point. Strong wind or cloud prevents it."},
{q:"How does advection fog form?",o:["Warm, moist air moves over a colder surface","Cold air moves over a warm sea","The ground cools on a clear night","Rain falls into cold air"],e:"Advection means horizontal movement: warm, moist air is cooled from below as it passes over cold land or sea."},
{q:"What visibility defines fog?",o:["Less than 1,000 m","Less than 5 km","Less than 1,500 m","Less than 500 m"],e:"Fog is visibility below 1,000 m due to water droplets. With visibility of 1,000 m or more it is reported as mist (BR)."},
{q:"Which cloud is the thick, grey, rain-bearing layer cloud with a low base?",o:["Nimbostratus","Cirrostratus","Altocumulus","Cumulus"],e:"Nimbostratus is the dense layer cloud that gives continuous rain or snow, often ahead of and at a warm front."},
{q:"Altostratus is classed as which level of cloud?",o:["Medium","Low","High","Vertical development"],e:"\"Alto\" means medium level. Altostratus and altocumulus are medium-level clouds."},
{q:"Which hazards are associated with cumulonimbus?",o:["Severe turbulence, icing, hail, lightning and windshear","Only light rain","Poor visibility but smooth air","Only icing above 10,000 ft"],e:"Cb is the most hazardous cloud: strong up and down draughts, hail, lightning, severe icing and gusty, shearing winds below it. Keep well clear."},
{q:"How does radiation fog usually clear?",o:["By surface heating after sunrise, or by the wind increasing","By the arrival of colder air","By darkness falling","It never clears without a front passing"],e:"Morning sun warms the ground and lifts the temperature above the dew point; an increasing wind can also lift it into a layer of low stratus."}

<h3>Air masses affecting the UK</h3>
<div class="tbl"><table>

<tr><td>Tropical maritime (Tm)</td><td>South-west</td><td>Warm and moist. Stable: low stratus, drizzle, poor visibility, hill and sea fog.</td></tr>

<tr><td>Tropical continental (Tc)</td><td>South-east, in summer</td><td>Hot, dry, hazy, with thunderstorms possible.</td></tr>
<tr><td>Arctic maritime (Am)</td><td>North</td><td>Very cold, unstable; snow showers in winter.</td></tr>
</table></div>
<h3>Fronts</h3>
${fronts}
<div class="tbl"><table>
<tr><th></th><th>Warm front passes</th><th>Cold front passes</th></tr>
<tr><td>Temperature</td><td>Rises</td><td>Falls</td></tr>
<tr><td>Wind (northern hemisphere)</td><td>Veers</td><td>Veers, often sharply, with gusts</td></tr>

<h3>Wind</h3>
<ul>

<li>Near the surface, friction slows the wind and turns it towards low pressure: the surface wind is <b>backed</b> and <b>lighter</b> than the wind at 2,000 ft. Climbing away from the surface, the wind <b>veers and increases</b>, more over land (about 30°) than over sea (about 10°).</li>

T.push({ id:"hazards", ref:"050 · 5", title:"Icing, thunderstorms and mountain waves",
blurb:"Carburettor and airframe icing, the life of a thunderstorm, and turbulence near hills.",
learn:()=>`
<h3>Carburettor icing</h3>
<p>Fuel evaporating in the carburettor, and the pressure drop in the venturi, can cool the air by 20 °C or more. Ice can form even on a <b>warm, humid day</b>. It is most likely with <b>high humidity</b> and at <b>reduced power</b> (descent, approach), when the throttle valve is partly closed. Signs: a drop in RPM (fixed-pitch propeller) and rough running. Use carburettor heat as your checklist and POH direct.</p>
<h3>Airframe icing</h3>
<p>Ice forms when <b>supercooled water droplets</b> (liquid below 0 °C) hit the airframe and freeze.</p>
<div class="tbl"><table>
<tr><th>Type</th><th>Forms from</th><th>Character</th></tr>
<tr><td>Clear (glaze) ice</td><td>Large supercooled drops, typically 0 to −10 °C, in cumuliform cloud or freezing rain</td><td>Heavy, hard, spreads back over the wing before freezing. The most dangerous.</td></tr>
<tr><td>Rime ice</td><td>Small supercooled drops, colder temperatures, layer cloud</td><td>White, brittle, rough; freezes on the leading edge.</td></tr>
<tr><td>Hoar frost</td><td>Water vapour freezing directly on a surface below 0 °C, e.g. after a cold night or a descent into warm moist air</td><td>Feathery; must be removed before flight.</td></tr>
</table></div>
<h3>Thunderstorms</h3>
<p>Need moist air, instability and a trigger to lift it (heating, a front or hills). Three stages:</p>
<ol>
<li><b>Cumulus</b>: updraughts throughout; the cloud grows.</li>
<li><b>Mature</b>: begins when precipitation falls from the base; violent up and downdraughts side by side, hail, lightning, gust front and microbursts. The most dangerous stage.</li>
<li><b>Dissipating</b>: mainly downdraughts; the storm rains itself out.</li>
</ol>
<h3>Mountain waves</h3>
<p>Strong wind blowing across a ridge, with stable air above, can set up standing waves downwind. <b>Lenticular</b> (lens-shaped) clouds mark the crests, and <b>rotor</b> clouds below them mark severe turbulence. Expect strong downdraughts on the lee side of hills.</p>`,
qs:[
{q:"When is carburettor icing most likely?",o:["At reduced power settings in humid air","Only when the outside air temperature is below 0 °C","At full power in dry air","Only in cloud"],e:"Partly closed throttle and high humidity give the greatest risk. The cooling in the carburettor means ice can form on a warm day."},
{q:"What first sign of carburettor icing would you expect in an aircraft with a fixed-pitch propeller?",o:["A drop in RPM","A rise in oil temperature","A rise in RPM","A rise in oil pressure"],e:"Ice restricts the airflow through the carburettor, reducing power, which shows as falling RPM with a fixed-pitch propeller, followed by rough running."},
{q:"What are supercooled water droplets?",o:["Liquid water droplets at a temperature below 0 °C","Ice crystals in high cloud","Water droplets just above 0 °C","Hailstones that have partly melted"],e:"Small droplets can stay liquid well below freezing. They freeze on impact with an aircraft, causing airframe icing."},
{q:"Which type of airframe ice is generally the most dangerous?",o:["Clear ice","Rime ice","Hoar frost","Ice crystals"],e:"Clear ice from large supercooled drops spreads back before freezing, is heavy and hard to see, and badly distorts the wing section."},
{q:"Which stage of a thunderstorm is the most dangerous?",o:["Mature","Cumulus","Dissipating","All stages are equally dangerous"],e:"The mature stage has precipitation, violent up and downdraughts side by side, hail, lightning and microbursts."},
{q:"What marks the start of the mature stage of a thunderstorm?",o:["Precipitation beginning to fall from the cloud base","The first updraught","The anvil top dissipating","The cloud base lifting"],e:"Falling precipitation drags air down with it, setting up the downdraughts that characterise the mature stage."},
{q:"Lenticular clouds downwind of a ridge indicate:",o:["Mountain waves, with possible severe turbulence and downdraughts","Fair weather and calm conditions","An approaching warm front","Radiation fog forming"],e:"Lens-shaped clouds sit in the crests of standing waves. Rotor beneath them can be severely turbulent, and downdraughts on the lee side can exceed an aircraft's climb rate."}
]});

T.push({ id:"reports", ref:"050 · 6", title:"METARs and TAFs",
blurb:"Reading the coded actual reports and forecasts, cloud amounts, CAVOK and change groups.",
learn:()=>`
<h3>A METAR, decoded</h3>
<p class="mono">EGNT 171020Z 24012KT 9999 FEW030 SCT045 12/07 Q1009</p>
<div class="tbl"><table>
<tr><th>Group</th><th>Meaning</th></tr>
<tr><td>EGNT</td><td>Aerodrome (Newcastle)</td></tr>
<tr><td>171020Z</td><td>17th day of the month, 10:20 UTC</td></tr>
<tr><td>24012KT</td><td>Wind from 240° <b>true</b> at 12 kt</td></tr>
<tr><td>9999</td><td>Visibility 10 km or more</td></tr>
<tr><td>FEW030 SCT045</td><td>Few cloud at 3,000 ft, scattered at 4,500 ft, <b>above aerodrome level</b></td></tr>
<tr><td>12/07</td><td>Temperature 12 °C, dew point 7 °C</td></tr>
<tr><td>Q1009</td><td>QNH 1009 hPa</td></tr>
</table></div>
<h3>Cloud amounts</h3>
<div class="sq">
<div class="tile"><div class="big">FEW</div><div class="d">1–2 oktas</div></div>
<div class="tile"><div class="big">SCT</div><div class="d">3–4 oktas</div></div>
<div class="tile"><div class="big">BKN</div><div class="d">5–7 oktas</div></div>
<div class="tile"><div class="big">OVC</div><div class="d">8 oktas</div></div>
</div>
<h3>CAVOK</h3>
<p>Ceiling and visibility OK: visibility 10 km or more, no cloud below 5,000 ft (or below the highest minimum sector altitude if higher), no cumulonimbus or towering cumulus, and no significant weather.</p>
<h3>Weather codes</h3>
<p><span class="mono">RA</span> rain, <span class="mono">DZ</span> drizzle, <span class="mono">SN</span> snow, <span class="mono">SH</span> showers, <span class="mono">TS</span> thunderstorm, <span class="mono">BR</span> mist, <span class="mono">FG</span> fog, <span class="mono">HZ</span> haze, <span class="mono">GR</span> hail. A <span class="mono">−</span> prefix means light, <span class="mono">+</span> heavy, and <span class="mono">VC</span> in the vicinity. So <span class="mono">−SHRA</span> is light rain showers.</p>
<h3>TAF change groups</h3>
<ul>
<li><b>BECMG</b>: a lasting change happening during the stated period.</li>
<li><b>TEMPO</b>: temporary fluctuations, each lasting less than an hour and in total less than half the period.</li>
<li><b>PROB30 / PROB40</b>: 30% or 40% probability.</li>
</ul>
<div class="box trap"><b>Common trap</b>METAR and TAF winds are in degrees <b>true</b>. The wind a tower or ATIS gives you for take-off and landing is in degrees <b>magnetic</b>, to match the runway.</div>`,
qs:[
{q:"In a METAR, what does SCT mean?",o:["3 to 4 oktas of cloud","1 to 2 oktas","5 to 7 oktas","8 oktas"],e:"FEW 1–2, SCT 3–4, BKN 5–7, OVC 8 oktas."},
{q:"In a METAR, what does BKN040 mean?",o:["5 to 7 oktas of cloud with a base of 4,000 ft above aerodrome level","Broken cloud at 400 ft","5 to 7 oktas at 4,000 ft above mean sea level","Cloud broken by thunderstorms at 4,000 ft"],e:"BKN is 5–7 oktas, and cloud heights in METARs are in hundreds of feet above aerodrome level."},
{q:"What does 9999 mean in the visibility group of a METAR?",o:["10 km or more","9,999 m exactly","Visibility not reported","Less than 10 km"],e:"9999 is the code for 10 km or more."},
{q:"Which of these is part of the definition of CAVOK?",o:["Visibility 10 km or more and no cloud below 5,000 ft (or the highest minimum sector altitude if higher)","No cloud at all","Visibility 5 km or more and no cloud below 1,500 ft","Wind calm and visibility unlimited"],e:"CAVOK needs 10 km or more visibility, no cloud below 5,000 ft or the highest MSA if higher, no CB or TCU and no significant weather. There may still be cloud higher up."},
{q:"In a METAR, the wind direction is given relative to:",o:["True north","Magnetic north","The runway in use","Grid north"],e:"Met reports give wind in degrees true. ATC and ATIS give surface wind in degrees magnetic for take-off and landing."},
{q:"What does −SHRA mean?",o:["Light rain showers","Heavy rain showers","Light snow showers","Shallow rain"],e:"− is light, SH is showers, RA is rain."},
{q:"In a TAF, what does TEMPO indicate?",o:["Temporary fluctuations, each lasting less than an hour and in total less than half the period","A permanent change during the period","A 30% chance of the conditions","Conditions at the start of the forecast only"],e:"TEMPO means conditions that come and go: each spell under an hour, and together less than half the stated period. BECMG is a lasting change."}
]});

T.push({ id:"earth", ref:"060 · 1", title:"The earth, direction and the compass",
blurb:"Latitude and longitude, the nautical mile, great circles, variation and deviation.",
learn:()=>`
<h3>Position and distance</h3>
<ul>
<li><b>Latitude</b> is measured north or south of the equator; <b>longitude</b> east or west of the Greenwich meridian.</li>
<li>One minute of latitude = <b>1 nautical mile</b>. 1 nm = 1,852 m (about 6,076 ft, or 1.15 statute miles).</li>
<li>A <b>great circle</b> is the shortest distance between two points on the earth. A <b>rhumb line</b> crosses every meridian at the same angle, so it holds a constant track, but is longer.</li>
</ul>
<h3>True, magnetic and compass</h3>
<p><b>Variation</b> is the angle between true north and magnetic north at a place. Lines joining places of equal variation are <b>isogonals</b>. <b>Deviation</b> is the compass error caused by the aircraft's own magnetic fields (engine, radios, wiring), recorded on the deviation card.</p>
${tvmdc}
<p>Going from true to magnetic to compass: <b>"Variation west, magnetic best; variation east, magnetic least."</b> West is added, east is subtracted. The same rule applies to deviation.</p>
<p>Example: true track 090°, variation 3°W: magnetic track 093°. Compass deviation 2°E: compass heading 091°.</p>
<div class="box note"><b>Note</b>Variation across the UK is currently small. Exam questions often use larger values to test the method, so practise the rule rather than memorising today's figure.</div>`,

{q:"What causes compass deviation?",o:["Magnetic fields within the aircraft","The difference between true and magnetic north","Turning errors","The earth's magnetic dip"],e:"Deviation is caused by the aircraft's own magnetism from the engine, radios and wiring. It differs with heading and is recorded on the deviation card."},

]});

T.push({ id:"charts", ref:"060 · 2", title:"Charts and scale",

learn:()=>`
<h3>UK VFR charts</h3>
<p>UK VFR charts are published at 1:500,000 and 1:250,000 and use the <b>Lambert conformal conic</b> projection.</p>
<ul>
<li><b>Conformal</b>: angles are shown correctly, so bearings measured on the chart are accurate.</li>
<li>Scale is nearly constant across the chart.</li>
<li>A straight line drawn on the chart is very close to a great circle.</li>
</ul>
<h3>Scale</h3>
<div class="tbl"><table>
<tr><th>Scale</th><th>1 cm on the chart</th><th>Use</th></tr>
<tr><td>1:500,000</td><td>5 km</td><td>The standard chart for cross-country planning</td></tr>
<tr><td>1:250,000</td><td>2.5 km</td><td>More ground detail over a smaller area; check the chart's legend for which airspace it shows</td></tr>
</table></div>
<h3>Heights on the chart</h3>
<ul>
<li>Spot heights, obstacles and the <b>Maximum Elevation Figure (MEF)</b> are shown in feet <b>above mean sea level</b>.</li>

<li>Airspace bases and tops are shown as altitudes (AMSL) or flight levels.</li>

T.push({ id:"tsd", ref:"060 · 3", title:"Time, speed, distance and fuel",
blurb:"The arithmetic behind the plog: times, groundspeeds, fuel and true airspeed.",
learn:()=>`
<h3>The basic relationship</h3>
<p><span class="mono">distance = speed × time</span>. With speed in knots (nautical miles per hour): <span class="mono">time (minutes) = distance × 60 ÷ groundspeed</span>.</p>
<ul>
<li>45 nm at 90 kt: 45 × 60 ÷ 90 = <b>30 minutes</b>.</li>
<li>A useful habit: work out <b>nautical miles per minute</b>. 90 kt is 1.5 nm/min; 120 kt is 2 nm/min.</li>
</ul>
<h3>Fuel</h3>
<ul>
<li><span class="mono">fuel used = consumption × time</span>. 24 L/h for 1 h 15 min (1.25 h) = 30 L.</li>
<li>1 US gallon = 3.785 litres. 1 imperial gallon = 4.546 litres.</li>
<li>Avgas has a specific gravity of about 0.72, so 1 litre weighs about 0.72 kg. Weight and balance needs the fuel in kg or lb.</li>
</ul>
<h3>True airspeed</h3>
<p>The airspeed indicator shows IAS. As density falls with height, TAS becomes higher than IAS. A rule of thumb: <b>TAS ≈ IAS + 2% per 1,000 ft</b>. So 100 kt IAS at 5,000 ft is about 110 kt TAS. Use the flight computer for exact figures.</p>
<div class="box trap"><b>Common trap</b>Use groundspeed, not TAS, for times and fuel along a leg. The wind changes the speed over the ground.</div>`,
qs:[
{q:"Groundspeed is 90 kt. How long will a 30 nm leg take?",o:["20 minutes","30 minutes","15 minutes","27 minutes"],e:"30 × 60 ÷ 90 = 20 minutes. At 90 kt you cover 1.5 nm per minute."},
{q:"You fly at a groundspeed of 100 kt for 18 minutes. How far have you travelled?",o:["30 nm","18 nm","36 nm","25 nm"],e:"100 kt is 1.67 nm per minute: 1.67 × 18 = 30 nm."},
{q:"You cover 60 nm in 40 minutes. What is your groundspeed?",o:["90 kt","60 kt","80 kt","120 kt"],e:"60 nm ÷ (40/60 h) = 90 kt."},
{q:"Fuel consumption is 25 L/h. How much fuel is used in 1 hour 24 minutes?",o:["35 L","30 L","34 L","40 L"],e:"1 h 24 min = 1.4 h. 25 × 1.4 = 35 L."},
{q:"How many litres are there in one US gallon?",o:["3.785","4.546","1.000","2.205"],e:"1 US gallon = 3.785 L. 4.546 L is an imperial gallon; 2.205 is pounds per kilogram."},
{q:"Using the rule of thumb, what is the approximate TAS for 100 kt IAS at 5,000 ft?",o:["110 kt","100 kt","105 kt","120 kt"],e:"Add about 2% per 1,000 ft: 10% at 5,000 ft, so about 110 kt."},
{q:"Which speed should you use to calculate the time for a leg?",o:["Groundspeed","True airspeed","Indicated airspeed","Calibrated airspeed"],e:"Time over the ground depends on the speed over the ground, which includes the effect of the wind."}
]});

T.push({ id:"wind", ref:"060 · 4", title:"Wind triangle, drift and crosswinds",
blurb:"Heading versus track, working out drift, and headwind and crosswind components.",
learn:()=>`
${windTri}
<h3>Heading and track</h3>
<ul>
<li><b>Heading</b> is where the nose points. <b>Track</b> is the path over the ground.</li>
<li><b>Drift</b> is the angle between them. Wind from the left drifts the aircraft to the right, so you head into wind: heading left of track.</li>
<li>Winds in forecasts are given as the direction they blow <b>from</b>.</li>
</ul>
<h3>Maximum drift</h3>
<p><span class="mono">max drift (°) ≈ wind speed × 60 ÷ TAS</span>. This is the drift with the wind at 90° to track; at smaller angles it is less. Example: 20 kt of wind at 100 kt TAS gives up to 12°.</p>
<h3>Wind components</h3>
<div class="tbl"><table>
<tr><th>Angle off the runway or track</th><th>Crosswind is about</th><th>Headwind is about</th></tr>
<tr><td>30°</td><td>½ of the wind speed</td><td>0.9 of the wind speed</td></tr>
<tr><td>45°</td><td>0.7</td><td>0.7</td></tr>
<tr><td>60°</td><td>0.9</td><td>½</td></tr>
<tr><td>90°</td><td>All of it</td><td>None</td></tr>
</table></div>
<p>Example: runway 27, wind 300° at 20 kt. That is 30° off, so crosswind about 10 kt and headwind about 17 kt. Check the result against the maximum demonstrated crosswind for your aircraft in the POH.</p>
<div class="box trap"><b>Common trap</b>The wind for a runway is given in degrees magnetic by ATC, matching the runway number. Don't mix it with a forecast wind in degrees true.</div>`,
qs:[
{q:"What is drift?",o:["The angle between heading and track","The angle between track and the wind direction","The difference between TAS and groundspeed","The angle between true and magnetic north"],e:"Drift is the angle between where the aircraft points (heading) and where it goes over the ground (track)."},
{q:"With 20 kt of wind and a TAS of 100 kt, what is the maximum possible drift?",o:["12°","20°","5°","8°"],e:"Max drift ≈ 20 × 60 ÷ 100 = 12°, with the wind at right angles to the track."},
{q:"The wind is blowing from the left of your track. To maintain track, your heading will be:",o:["To the left of track, into wind","To the right of track","The same as the track","Opposite to the track"],e:"The wind pushes the aircraft to the right, so you point into wind, to the left of the track, to stay on it."},
{q:"Runway 27 is in use and the surface wind is 300° at 20 kt. What is the approximate crosswind component?",o:["10 kt","20 kt","17 kt","5 kt"],e:"The wind is 30° off the runway. sin 30° = 0.5, so crosswind ≈ 10 kt."},
{q:"Runway 27 is in use and the surface wind is 330° at 20 kt. What is the approximate headwind component?",o:["10 kt","17 kt","20 kt","0 kt"],e:"The wind is 60° off the runway. cos 60° = 0.5, so headwind ≈ 10 kt; crosswind ≈ 17 kt."},
{q:"A forecast wind of 270/25 means the wind is:",o:["Blowing from 270° at 25 kt","Blowing towards 270° at 25 kt","Blowing from 270° at 25 mph","Blowing from 250° at 27 kt"],e:"Wind direction is always given as the direction it blows from, with speed in knots."},
{q:"With a tailwind component, compared with still air your groundspeed will be:",o:["Higher than your TAS","Lower than your TAS","The same as your TAS","Equal to your IAS"],e:"A tailwind adds to the speed over the ground."}
]});

T.push({ id:"onein60", ref:"060 · 5", title:"The 1 in 60 rule and en-route corrections",
blurb:"Using the 1 in 60 rule to find track error and get back to track.",
learn:()=>`
<p>At 60 nm, an angle of 1° covers a distance of about 1 nm. That gives quick mental arithmetic for small angles.</p>
${oneIn60}
<h3>Worked example</h3>
<p>You are 4 nm left of track after 30 nm, with 40 nm still to go.</p>
<ul>
<li>Track error = 4 × 60 ÷ 30 = <b>8°</b>.</li>
<li>Closing angle = 4 × 60 ÷ 40 = <b>6°</b>.</li>
<li>To reach the destination, alter heading <b>14° right</b> (TE + CA).</li>
<li>To fly parallel to the planned track instead, alter by the track error only (8° right).</li>
</ul>
<h3>Keeping track en route</h3>
<ul>
<li>Set heading over a known point and note the time.</li>
<li>Work from the chart to the ground: predict what you should see next, then look for it. Large features (coast, motorways, lakes, towns) first, details to confirm.</li>
<li>Check your fixes against the plog times, and revise the ETA.</li>
<li>If uncertain of position, follow a set procedure rather than wandering. Ask for help early: a training fix or a PAN call on 121.5 MHz is what it is for.</li>
</ul>`,
qs:[
{q:"Using the 1 in 60 rule, 1° of track error at 60 nm puts you how far off track?",o:["1 nm","6 nm","10 nm","0.6 nm"],e:"That is the rule itself: 1 in 60. At 30 nm the same 1° would be 0.5 nm off."},
{q:"After 30 nm you are 3 nm off track. What is the track error?",o:["6°","3°","10°","1°"],e:"Track error = off track × 60 ÷ distance gone = 3 × 60 ÷ 30 = 6°."},
{q:"You are 2 nm off track with 20 nm still to go. What is the closing angle?",o:["6°","10°","2°","4°"],e:"Closing angle = off track × 60 ÷ distance to go = 2 × 60 ÷ 20 = 6°."},
{q:"After 30 nm you are 4 nm left of track, with 40 nm to go. What alteration will take you to the destination?",o:["14° right","8° right","6° right","14° left"],e:"TE = 4 × 60 ÷ 30 = 8°; CA = 4 × 60 ÷ 40 = 6°. Alter 14° right, towards the track."},
{q:"You discover a track error and want to fly parallel to your planned track. By how much do you alter heading?",o:["By the track error only","By the closing angle only","By double the track error","By the track error plus the closing angle"],e:"Correcting by the track error cancels the drift you haven't allowed for, so you fly parallel. Adding the closing angle takes you back to destination."},
{q:"Which is the best order for map reading en route?",o:["From the chart to the ground: predict the next feature, then look for it","From the ground to the chart: look out, then find it on the map","Follow the largest town in view","Use only the compass and the clock"],e:"Predicting from the chart prevents you from making the ground fit what you want to see. Ground to chart is mainly for when you are uncertain of position."},
{q:"You are uncertain of your position. Which is the most sensible early action?",o:["Ask for help, for example a training fix or a PAN on 121.5 MHz","Fly in circles until you recognise something","Descend to read road signs","Keep going and hope to see the destination"],e:"Getting help early costs nothing. 121.5 MHz is staffed to give training fixes and help pilots who are uncertain of position."}
]});

T.push({ id:"radionav", ref:"060 · 6", title:"Radio navigation",
blurb:"VOR radials, Q-codes, DME, the ADF and NDB, VHF range and using GNSS sensibly.",
learn:()=>`
<h3>VOR</h3>
<ul>
<li>A <b>radial</b> is a magnetic bearing <b>from</b> the station.</li>
<li>The course deviation indicator (CDI) shows whether you are left or right of the selected course; the TO/FROM flag shows which side of the station you are on.</li>
<li>VOR works on VHF, so it needs line of sight.</li>
</ul>
<h3>Q-codes</h3>
<div class="tbl"><table>
<tr><th>Code</th><th>Meaning</th></tr>
<tr><td>QDM</td><td>Magnetic bearing <b>to</b> the station</td></tr>
<tr><td>QDR</td><td>Magnetic bearing <b>from</b> the station (QDM ± 180°)</td></tr>
<tr><td>QTE</td><td>True bearing from the station</td></tr>
<tr><td>QUJ</td><td>True bearing to the station</td></tr>
</table></div>
<h3>DME, ADF and NDB</h3>
<ul>
<li>DME gives <b>slant range</b> in nm, the straight-line distance from the aircraft to the station, not the distance over the ground.</li>
<li>The ADF needle points at the NDB. <span class="mono">magnetic heading + relative bearing = QDM</span>. Example: heading 300°, relative bearing 030° gives QDM 330°.</li>
</ul>
<h3>VHF range</h3>
<p>VHF (radio and VOR) is line of sight. <span class="mono">range (nm) ≈ 1.23 × √(height in ft)</span>. At 2,500 ft: about 61 nm. At 4,900 ft: about 86 nm.</p>
<h3>GNSS</h3>
<p>Satellite navigation is accurate, but it can be wrong or lost: interference, out-of-date databases, wrong waypoints. Plan the flight on a chart, cross-check GNSS against what you see, and be ready to navigate without it. Jamming is common in some areas.</p>`,
qs:[
{q:"What is a VOR radial?",o:["A magnetic bearing from the station","A magnetic bearing to the station","A true bearing from the station","A distance from the station"],e:"Radials are magnetic bearings from the VOR, so the 090 radial runs due magnetic east from the station."},
{q:"What does QDM mean?",o:["Magnetic bearing to the station","Magnetic bearing from the station","True bearing from the station","True bearing to the station"],e:"QDM is the magnetic heading to steer to the station in nil wind. QDR is the reciprocal."},
{q:"QDM is 050°. What is the QDR?",o:["230°","050°","130°","310°"],e:"QDR = QDM ± 180°. 050 + 180 = 230°."},
{q:"Magnetic heading is 300° and the ADF shows a relative bearing of 030°. What is the QDM?",o:["330°","270°","030°","150°"],e:"Magnetic heading + relative bearing = QDM: 300 + 30 = 330°."},
{q:"What does DME measure?",o:["Slant range from the aircraft to the station","Distance over the ground to the station","Groundspeed only","Bearing to the station"],e:"DME measures straight-line (slant) distance. Overhead the station at 6,000 ft it would show about 1 nm."},
{q:"Roughly what is the VHF radio range of an aircraft at 2,500 ft over flat terrain?",o:["61 nm","25 nm","150 nm","12 nm"],e:"1.23 × √2,500 = 1.23 × 50 ≈ 61 nm."},
{q:"Which statement about GNSS for VFR navigation is correct?",o:["It should be cross-checked against the chart and what you can see","It removes the need to plan the route on a chart","It cannot be affected by interference","Its database never needs updating"],e:"GNSS can be jammed, mis-programmed or out of date. Plan on a chart, cross-check, and be able to continue without it."}
]});
